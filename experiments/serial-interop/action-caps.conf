# Entity capacities for the ACTION-SERVER image over serial.
#
# `talker-serial.conf` carries the serial transport settings AND capacities
# sized for a talker: two queryables, four publishers, eight liveliness tokens.
# An action server needs more, and the shortfall is silent — it registers
# `send_goal`, then `cancel_goal`, then fails on `get_result` and tears the
# whole node down 150 ms after connecting, with no message saying which limit
# was hit.
#
# These values previously lived on a `-D` on one west command line and nowhere
# else. A clean rebuild therefore fell back to the talker's numbers and the
# image stopped working, which is how this file came to exist. Apply AFTER
# talker-serial.conf.
#
#   send_goal + cancel_goal + get_result            = 3 queryables
#   feedback + status + rosout + parameter_events   = publishers
#   one liveliness token per endpoint, plus the node
CONFIG_NROS_MAX_QUERYABLES=6
CONFIG_NROS_MAX_PUBLISHERS=6
CONFIG_NROS_MAX_LIVELINESS=16
CONFIG_NROS_MAX_SUBSCRIBERS=4

# The transport tasks plus the executor need more than the default four slots
# (issue 0839: the action image exhausted four and the only symptom was a
# session that never received).
CONFIG_NROS_ZEPHYR_TASK_SLOTS=6

# MEASURED, and this image does not currently fit.
#
# With the capacities above (which the action server genuinely needs), RTT and
# CONFIG_STACK_SENTINEL, a clean build is 98.7 % SRAM and the node tears itself
# down during entity creation -- there is no heap left. Shrinking these stacks
# to 6144 to make room did not help; it moved the failure earlier.
#
# So the action image can no longer be INSTRUMENTED on this board: there is not
# enough RAM to run it and observe it at the same time. That is a
# memory-reduction problem before it is a debugging problem, and it is why the
# stack-demand hunt for issue 0852 is currently blocked.
CONFIG_NROS_ZEPHYR_TASK_STACK_SIZE=8192

# 128 KiB of DTCM and 64 KiB of ITCM sat at 0 % on this part while SRAM was at
# 98.7 %. Stacks are the right tenant for DTCM: CPU-private, never a DMA
# target, and off the system bus.
CONFIG_NROS_ZEPHYR_STACKS_IN_DTCM=y

# The image contains no `malloc`/`free` — nano-ros routes every allocation
# through nros_platform_alloc — but the libc arena is reserved regardless of
# whether any caller survives the linker. Dead code is collected; dead
# RESERVATIONS are not.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0

# phase-392 amendment D — observe the board without a debugger.
#
# Attaching pyocd RTT halts the core often enough that the zenoh session misses
# keepalives and expires; issue 0879 then makes that permanent. Measured: graph
# resolves on every query with no probe, on none with the probe attached, and
# does not recover when the probe detaches. A fault visible only under a probe
# is a fault the probe helped cause.
CONFIG_NROS_FAULT_LOG=y
CONFIG_NROS_FAULT_LOG_FLASH=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# issue 0882 — left at the DEFAULT (y) deliberately.
#
# Turning it off proves the cause and is not a fix: it cures the crash and
# replaces it with a session that never recovers.
#
#                          through tap    direct
#   reconnect on (default)      0/8        7/10
#   reconnect off               8/8        4/10
#
# So neither setting is good, and the knob exists to run that experiment, not
# to ship. The fix belongs in the ordering inside `_zp_unicast_failed`.
# CONFIG_NROS_ZENOH_AUTO_RECONNECT=n
