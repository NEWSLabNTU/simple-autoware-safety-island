# Console over SEGGER RTT, read through the MCU-Link with `pyocd rtt`.
# zenoh owns the only wired UART (lpuart2), so the fatal-error message has
# nowhere else to go. RTT rides the existing SWD connection.
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_ASSERT=y
CONFIG_ASSERT_VERBOSE=y
# Name the fatal reason and dump the frame.
CONFIG_EXCEPTION_DEBUG=y
# Make a stack overflow say so. Without the MPU guard the overflowing thread
# branches through CONFIG_INIT_STACKS poison and arrives as an instruction-access
# violation at pc = 0xaaaaaaaa, which reads like corruption anywhere in the image.
# Too expensive for the shipping board conf (a guard region per thread, 23244 B
# over on that build); affordable here because this image is for triage.
CONFIG_HW_STACK_PROTECTION=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
# The default up-buffer is ~1 KiB; a ZENOH_DEBUG=3 trace wraps it long before a
# post-hoc reader attaches, which is why failing runs read back empty.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=16384
CONFIG_SEGGER_RTT_MODE_NO_BLOCK_SKIP=y
