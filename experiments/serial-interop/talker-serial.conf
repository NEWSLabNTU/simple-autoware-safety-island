# zenoh over SERIAL on the one wired UART (lpuart2 = DCD-LZ P6 = /dev/ttyUSB0).
# The console is moved to unwired lpuart0 by the overlay, so console bytes cannot
# corrupt the COBS frame stream.
CONFIG_NROS_RMW_ZENOH=y
CONFIG_NROS_TRANSPORT_SERIAL=y
CONFIG_NROS_ZENOH_LOCATOR="serial/uart@40330000#baudrate=115200"
CONFIG_SERIAL=y
CONFIG_UART_MCUX_LPUART=y
CONFIG_POSIX_API=y

# PRNG: zenoh-pico needs sys_rand_get; the board has no entropy driver, and the
# island board conf carries the same pair (insecure, fine for a bench talker).
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_TIMER_RANDOM_GENERATOR=y

# Board-scale sizing. The talker's own prj.conf and the zenoh snippet are
# host-scale; 320 KiB of SRAM is not.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=49152
CONFIG_NROS_MAX_PUBLISHERS=4
CONFIG_NROS_MAX_SUBSCRIBERS=4
CONFIG_NROS_MAX_QUERYABLES=2
CONFIG_NROS_MAX_LIVELINESS=8
CONFIG_NROS_EXECUTOR_MAX_CBS=4
CONFIG_NROS_EXECUTOR_MAX_NODES=2
CONFIG_NROS_EXECUTOR_ARENA_SIZE=16384

# No IP stack. The socket wrappers in nros_platform_zephyr_shims.c are now gated
# on CONFIG_NET_SOCKETS, so a serial-only image no longer has to carry one.
CONFIG_NETWORKING=n
CONFIG_NET_SOCKETS=n
CONFIG_NET_IPV4=n
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=n
CONFIG_NET_UDP=n
CONFIG_NET_L2_ETHERNET=n
CONFIG_NET_STATISTICS=n
CONFIG_NET_LOG=n
CONFIG_DNS_RESOLVER=n
CONFIG_NET_CONFIG_SETTINGS=n

# zenoh-pico's own TCP/UDP link code also needs the IP stack. A serial-only
# image must turn those links off, not just the Zephyr networking Kconfig.
CONFIG_NROS_ZENOH_LINK_TCP=n
CONFIG_NROS_ZENOH_LINK_UDP_UNICAST=n
CONFIG_NROS_ZENOH_LINK_UDP_MULTICAST=n

# Board-scale trim (re-added; an earlier DOTALL regex truncated this block).
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_NROS_EXECUTOR_ARENA_SIZE=8192
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=49152
CONFIG_NROS_GET_REPLY_BUF_SIZE=1024
CONFIG_NROS_FRAG_MAX_SIZE=512
CONFIG_NROS_SUBSCRIPTION_BUFFER_SIZE=256

# Serial send and receive each z_malloc 1507+1516 B per call, so the two paths
# want ~6 KiB of heap live at once. Give the arena room and take it back from
# places a one-publisher talker does not need.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=61440
CONFIG_NROS_EXECUTOR_ARENA_SIZE=4096
CONFIG_NROS_GET_REPLY_BUF_SIZE=512
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_NROS_MAX_PARAMETERS=4
CONFIG_NROS_MAX_PENDING_GETS=1
CONFIG_NROS_MAX_LARGE_SUBSCRIBERS=0

# zenoh-pico's z_malloc is k_malloc on Zephyr (src/system/zephyr/system.c), so
# its buffers come from the KERNEL heap, not the libc arena. Serial send and
# receive each take 1507+1516 B per call and both paths can be live at once, so
# HEAP_MEM_POOL_SIZE is the number that matters here -- the malloc arena is
# irrelevant to it.
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=8192

# Stack: the declare path is stack-heavy (_z_declare_resource alone reserves
# 340 B) and 4096 overflowed -- confirmed with CONFIG_MPU_STACK_GUARD, which
# reported "ZEPHYR FATAL ERROR 2: Stack overflow" where the unguarded build only
# showed a garbage PC. 8192 is the smallest that has not overflowed here.
CONFIG_MAIN_STACK_SIZE=8192
