# zenoh over SERIAL on the one wired UART (lpuart2 = DCD-LZ P6 = /dev/ttyUSB0).
# The console is moved to unwired lpuart0 by the overlay, so console bytes cannot
# corrupt the COBS frame stream.
CONFIG_NROS_RMW_ZENOH=y
CONFIG_NROS_TRANSPORT_SERIAL=y
CONFIG_NROS_ZENOH_LOCATOR="serial/uart@40330000#baudrate=115200"
CONFIG_SERIAL=y
CONFIG_UART_MCUX_LPUART=y
CONFIG_POSIX_API=y

# PRNG: zenoh-pico needs sys_rand_get; the board has no entropy driver, and the
# island board conf carries the same pair (insecure, fine for a bench talker).
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_TIMER_RANDOM_GENERATOR=y

# Board-scale sizing. The talker's own prj.conf and the zenoh snippet are
# host-scale; 320 KiB of SRAM is not.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=49152
CONFIG_NROS_MAX_PUBLISHERS=4
CONFIG_NROS_MAX_SUBSCRIBERS=4
CONFIG_NROS_MAX_QUERYABLES=2
CONFIG_NROS_MAX_LIVELINESS=8
CONFIG_NROS_EXECUTOR_MAX_CBS=4
CONFIG_NROS_EXECUTOR_MAX_NODES=2
CONFIG_NROS_EXECUTOR_ARENA_SIZE=16384

# No IP stack. The socket wrappers in nros_platform_zephyr_shims.c are now gated
# on CONFIG_NET_SOCKETS, so a serial-only image no longer has to carry one.
CONFIG_NETWORKING=n
CONFIG_NET_SOCKETS=n
CONFIG_NET_IPV4=n
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=n
CONFIG_NET_UDP=n
CONFIG_NET_L2_ETHERNET=n
CONFIG_NET_STATISTICS=n
CONFIG_NET_LOG=n
CONFIG_DNS_RESOLVER=n
CONFIG_NET_CONFIG_SETTINGS=n

# zenoh-pico's own TCP/UDP link code also needs the IP stack. A serial-only
# image must turn those links off, not just the Zephyr networking Kconfig.
CONFIG_NROS_ZENOH_LINK_TCP=n
CONFIG_NROS_ZENOH_LINK_UDP_UNICAST=n
CONFIG_NROS_ZENOH_LINK_UDP_MULTICAST=n

# Board-scale trim (re-added; an earlier DOTALL regex truncated this block).
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_NROS_EXECUTOR_ARENA_SIZE=8192
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=49152
CONFIG_NROS_GET_REPLY_BUF_SIZE=1024
CONFIG_NROS_FRAG_MAX_SIZE=512
CONFIG_NROS_SUBSCRIPTION_BUFFER_SIZE=256

# Serial send and receive each z_malloc 1507+1516 B per call, so the two paths
# want ~6 KiB of heap live at once. Give the arena room and take it back from
# places a one-publisher talker does not need.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=61440
CONFIG_NROS_EXECUTOR_ARENA_SIZE=4096
CONFIG_NROS_GET_REPLY_BUF_SIZE=512
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_NROS_MAX_PARAMETERS=4
CONFIG_NROS_MAX_PENDING_GETS=1
CONFIG_NROS_MAX_LARGE_SUBSCRIBERS=0

# zenoh-pico's z_malloc is k_malloc on Zephyr (src/system/zephyr/system.c), so
# its buffers come from the KERNEL heap, not the libc arena. Serial send and
# receive each take 1507+1516 B per call and both paths can be live at once, so
# HEAP_MEM_POOL_SIZE is the number that matters here -- the malloc arena is
# irrelevant to it.
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=8192

# Stack: the declare path is stack-heavy (_z_declare_resource alone reserves
# 340 B) and 4096 overflowed -- confirmed with CONFIG_MPU_STACK_GUARD, which
# reported "ZEPHYR FATAL ERROR 2: Stack overflow" where the unguarded build only
# showed a garbage PC. 8192 is the smallest that has not overflowed here.
CONFIG_MAIN_STACK_SIZE=8192

# ROS domain. The default is 0; this project runs on 10 (the demo moved off
# domain 0 because the box is shared). The domain is the FIRST element of every
# zenoh key rmw_zenoh builds -- '@ros2_lv/<domain>/...' and '<domain>/chatter/...'
# -- so a mismatch is invisible at the transport layer: the session opens, the
# board publishes, the router forwards, and `ros2 topic list` simply never
# matches. Both sides must agree.
CONFIG_NROS_DOMAIN_ID=10

# ── issue 0821: main needs 16 KiB, not 8 ─────────────────────────────────────
#
# At 8192 this image faults at exactly 2 x Z_TRANSPORT_LEASE -- 20 s at the
# 10000 default -- with a USAGE FAULT whose exception frame is ENTIRELY zero
# (pc, lr, xpsr, every FPU register). xpsr=0 is impossible for a real frame, so
# the CPU unstacked one out of dead memory: a blown stack, not a bad pointer.
#
# Bisected on hardware, one variable at a time. Raising ONLY this, with task
# stacks pinned at the old 8192, is what fixes it: 237 publishes across 3 full
# expiry/reconnect cycles, zero faults, where the baseline dies at 40 publishes.
# Ruled out on the way: more task stack slots (4 -> 12, still faults), smaller
# task stacks, disabling Z_FEATURE_AUTO_RECONNECT, and the MPU guard (clean
# without it too).
#
# NOTE this must come AFTER the earlier CONFIG_MAIN_STACK_SIZE lines in this
# file -- last assignment wins, and there are three of them above.
CONFIG_MAIN_STACK_SIZE=16384

# Keep nano-ros's task stacks at the old size rather than letting them inherit
# the larger main. Without this, `NROS_ZEPHYR_STACK_SIZE` derives from
# CONFIG_MAIN_STACK_SIZE and every task grows with it, which on this part is a
# link failure rather than a tuning nuisance.
CONFIG_NROS_ZEPHYR_TASK_STACK_SIZE=8192

# ── issue 0852: the transport reader must OUTRANK the executor ──────────────
#
# Zephyr's POSIX layer maps SCHED_RR as `zephyr_prio = NUM_PREEMPT - posix - 1`
# (zephyr/lib/posix/options/pthread.c), so with CONFIG_NUM_PREEMPT_PRIORITIES=15
# the most urgent preemptible slot a pthread can hold is Zephyr priority 0 --
# which is exactly where CONFIG_MAIN_THREAD_PRIORITY puts main by default.
#
# The zenoh read task is spawned BY the executor, so at the default the two sit
# at the same priority, and `k_yield()` in zenoh-pico's polled serial read loop
# hands the executor a full CONFIG_TIMESLICE_SIZE (20 ms) instead of returning
# promptly. 20 ms at 115200 is ~230 bytes against a few-entry LPUART FIFO: the
# UART overruns, and the frames it drops are the router's keepalives.
#
# Honouring CONFIG_NROS_ZENOH_READ_PRIORITY (the port now does; before issue
# 0852 it was discarded) is necessary but NOT sufficient on its own -- the
# reader cannot be placed above a main thread that already holds the top slot.
# Dropping main by five leaves the transport strictly above the executor with
# room underneath for application tiers.
CONFIG_MAIN_THREAD_PRIORITY=5

# issue 0852 — take the bytes in the ISR, not in a polling thread.
#
# The priority fix above narrows the window in which the reader is descheduled;
# it cannot close it, because a polling reader still has to be RUNNING to catch
# a byte that arrives every 87 us. With the ISR the capture depends on interrupt
# latency instead of on the scheduler, which is bounded and does not grow with
# load. zenoh-pico's Zephyr port uses it when this is set and falls back to the
# poll loop when it is not.
#
# OFF pending a trustworthy measurement. The port implements it and the board
# side is clean under it -- full bring-up, zero `uart_err_check` overruns, zero
# ring overflows -- but the A/B against the polled path cannot be trusted while
# the board presents the SAME zenoh id on every boot (see the entropy issue),
# because then every result depends on what the router remembers about the
# previous run. Turn this on once the zid is unique per boot.
CONFIG_UART_INTERRUPT_DRIVEN=n

# issue 0852 follow-on — name the fault instead of guessing at it.
#
# A goal arriving at the action server faulted in
# `_z_network_message_elem_copy` with USAGE FAULT "Illegal load of EXC_RETURN
# into PC", attributed to the idle thread. That signature is a corrupted return
# address, and with CONFIG_ARM_MPU=y but no stack guard a thread that overruns
# its stack silently damages its neighbour and surfaces exactly like this.
#
# CONFIG_HW_STACK_PROTECTION would be the stronger check, but its MPU guard
# pads every thread stack and overflows RAM by ~25 KiB on this image. The
# software sentinel costs 4 bytes per stack and catches the same condition at
# context switch, which is enough to turn the mystery into a named thread.
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_NAME=y
