# Zephyr base config for the native_sim entry (4 ported nodes). The RMW and
# its sizing come from the prj-cyclonedds.conf overlay. Same base as
# src/zephyr_entry/prj.conf, the board entry; the two diverge only in how the
# RMW is selected (an overlay here, a `-S nros-zenoh` snippet there).

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_MAX_CONTEXTS=32
# phase8-W18: the island's wall clock. Its MRM commands are read by Autoware's
# vehicle_cmd_gate, which keeps its previous hazard/turn/gear command when the
# new one is stamped EARLIER -- and a boot-relative stamp always is, so the
# hazard lights never came on in an MRM. nano-ros acquires the UNIX epoch once
# at boot, before any component is constructed (issue 0758), from
# scripts/sntp-server.py, which the island recipes start beside zephyr.exe.
# NSOS offloads the socket to the host, hence 127.0.0.1 and an unprivileged
# port. No answer is not fatal: the stamps stay boot-relative, as before.
# NROS_SNTP_EPOCH selects DNS_RESOLVER (it was =n here); the server is a
# numeric address, so no query is ever sent.
CONFIG_NROS_SNTP_EPOCH=y
CONFIG_NROS_SNTP_SERVER="127.0.0.1:12323"
CONFIG_NROS_SNTP_TIMEOUT_MS=3000

CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

CONFIG_NROS=y
CONFIG_NROS_C_API=y
CONFIG_NROS_CPP_API=y
CONFIG_STD_CPP17=y # class headers use nested namespaces (RFC-0057)

# == phase7-W1 tracing (docs/tracing.md) =====================================
# Synchronous CTF into a RAM buffer, dumped to a file at exit
# (`zephyr.exe --trace-out=<file>`, `just trace-native`). The same design as
# the board block at the end of src/zephyr_entry/boards/mr_canhubk3_s32k344.conf,
# so the image under emulation writes through the same backend code path.
#
# WHY SYNC + RAM. TRACING_LOCK() is irq_lock() around the WHOLE backend write,
# so a synchronous event costs whatever the backend costs, paid with
# interrupts off. UART (the default backend) is a byte-at-a-time poll loop,
# semihost traps to a debugger and faults without one, and ASYNC drops whole
# events into a counter nothing reads. RAM is a bounds check and a memcpy.
# The POSIX backend (native_sim only) is not used: it would be a host fwrite
# under the lock, a code path the board never runs.
CONFIG_TRACING=y
CONFIG_TRACING_CTF=y
CONFIG_TRACING_SYNC=y
CONFIG_TRACING_BACKEND_RAM=y
# One-shot, not a ring: when full the backend latches and drops everything
# after. 64 MiB is host RAM (native_sim) and covers a full demo run; the
# check reports a buffer that filled before the run ended.
CONFIG_RAM_TRACING_BUFFER_SIZE=67108864
# The CUT event set: application markers (island_trace.h) + thread switches.
# TRACING_THREAD is the only Kconfig that carries switched_in/out, and it also
# brings thread create/start/wakeup/name/priority/info events (rare). On this
# 3.7 line isr_enter/isr_exit and idle are emitted by the native_sim board and
# arch unconditionally (no TRACING_ISR / TRACING_IDLE gate); they are 5 bytes
# each and are counted by `just trace-decode`.
CONFIG_TRACING_THREAD=y
CONFIG_TRACING_SYSCALL=n
CONFIG_TRACING_WORK=n
CONFIG_TRACING_ISR=n
CONFIG_TRACING_SEMAPHORE=n
CONFIG_TRACING_MUTEX=n
CONFIG_TRACING_CONDVAR=n
CONFIG_TRACING_QUEUE=n
CONFIG_TRACING_FIFO=n
CONFIG_TRACING_LIFO=n
CONFIG_TRACING_STACK=n
CONFIG_TRACING_MESSAGE_QUEUE=n
CONFIG_TRACING_MAILBOX=n
CONFIG_TRACING_PIPE=n
CONFIG_TRACING_HEAP=n
CONFIG_TRACING_MEMORY_SLAB=n
CONFIG_TRACING_TIMER=n
CONFIG_TRACING_EVENT=n
CONFIG_TRACING_POLLING=n
CONFIG_TRACING_PM=n
CONFIG_TRACING_NETWORKING=n
# == end phase7-W1 tracing ====================================================

# == phase9-W4: runtime contract violations (docs/takeover-trace.md s. 12) ====
# As the board conf (mr_canhubk3_s32k344.conf, the phase9-W4 block): monitors
# armed by the handler's nros::arm_monitors() on the first tick with every
# input established, and the executor's violation markers forwarded into the
# trace at island ids 277-280. Unlike the board, this console is read, so the
# drain-and-report hook is ON: each stored verdict is a "contract violation
# #N: <rule> <fqn> measured=.. declared=.. (total=.. dropped=..)" line in
# the island's log. No SWD record here (no CONFIG_NROS_BOOT_REPORT).
CONFIG_NROS_MONITOR_ARM_ON_CALL=y
CONFIG_NROS_TRACE_CALLBACKS=y
# phase9-W4 rerun (phase-474 I3), as the board conf: takes traced so the
# island binds its three F4 inputs (forwarded at 281-283), one timer tick in
# ten keeps nano-ros's start/end pair (the emergency operator's every tick).
CONFIG_NROS_TRACE_TAKES=y
CONFIG_NROS_TRACE_TIMER_EVERY=10
CONFIG_NROS_EXECUTOR_MAX_VIOLATIONS=8
CONFIG_NROS_VIOLATION_DRAIN_REPORT=y
# == end phase9-W4 ============================================================
