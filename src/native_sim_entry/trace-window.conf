# phase8-W17: the native_sim island with the board's TRACE WINDOW (docs/tracing.md
# section 8). An extra conf fragment over prj.conf, not a default: the phase-7
# `trace-demo` check wants every marker from boot, which the window does not
# keep. Build with `just trace-window-native-build` (build-zephyr-window).
#
# The buffer stays prj.conf's 64 MiB: this line's native_sim board emits
# isr/idle events unconditionally and TRACING_THREAD is on, so the stream is
# not the board's. What this image verifies is the island's own half: the
# ring, the trigger, the record policy, and the island's record rate after the
# trigger, which `island_trace.py check` converts to the board's bytes.
CONFIG_ISLAND_TRACE_WINDOW=y
CONFIG_ISLAND_TRACE_PRE_MS=1500
CONFIG_ISLAND_TRACE_PRE_BYTES=2048
CONFIG_ISLAND_TRACE_SPIN_KEEP=10
