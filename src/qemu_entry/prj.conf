# Zephyr base config for the QEMU entry (4 ported nodes on mps2/an385).
# The RMW comes from the `-S nros-zenoh` snippet `just qemu-build` passes; the
# transport and the sizing come from boards/mps2_an385.conf, which Zephyr
# auto-applies because the build uses the snippet form (not -DCONF_FILE,
# which would suppress it). Same shape as src/zephyr_entry/prj.conf.

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_MAX_CONTEXTS=32
CONFIG_DNS_RESOLVER=n

CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

CONFIG_NROS=y
CONFIG_NROS_C_API=y
CONFIG_NROS_CPP_API=y
CONFIG_STD_CPP17=y # class headers use nested namespaces (RFC-0057)
