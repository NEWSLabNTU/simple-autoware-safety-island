# Serial transport for the QEMU entry -- the board's island-serial, on an385.
#
#   just qemu-build            (NROS_QEMU_LINK defaults to qemu-serial)
#
# Applied via EXTRA_CONF_FILE, merged AFTER prj.conf and boards/mps2_an385.conf,
# so the `=n` lines win over both. Same content as src/zephyr_entry/snippets/
# island-serial/serial.conf except for the device: UART1 of the CMSDK UARTs
# (QEMU wires it to the second `-serial`, a host PTY in `just qemu-run`), where
# the board uses LPUART2. The IP stack is off here for the same reason it is
# off there, and the image's heap is then comparable with the board's.

# -- zenoh over SERIAL ----------------------------------------------------------
CONFIG_NROS_TRANSPORT_SERIAL=y
CONFIG_NROS_ZENOH_LOCATOR="serial/uart@40005000#baudrate=115200"
# Stated here for the reason island-serial states it: nothing else delivers
# system.toml's domain_id to the image, and the Kconfig default is 0.
CONFIG_NROS_DOMAIN_ID=10

# -- The IP stack, off -------------------------------------------------------------
CONFIG_NETWORKING=n
CONFIG_NET_IPV4=n
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=n
CONFIG_NET_UDP=n
CONFIG_NET_SOCKETS=n
CONFIG_NET_L2_ETHERNET=n
CONFIG_NET_CONFIG_SETTINGS=n
CONFIG_NET_STATISTICS=n
CONFIG_NET_SHELL=n
CONFIG_DNS_RESOLVER=n
# The LAN9118 driver is `default y` on the enabled eth node, as the board's
# GMAC is on its; off by name.
CONFIG_ETH_SMSC911X=n
CONFIG_ETH_DRIVER=n

# -- zenoh's own socket links, off ---------------------------------------------------
CONFIG_NROS_ZENOH_LINK_TCP=n
CONFIG_NROS_ZENOH_LINK_UDP_UNICAST=n
CONFIG_NROS_ZENOH_LINK_UDP_MULTICAST=n

# The UART, POSIX for the zenoh tasks, and the ring buffer zenoh-pico's serial
# link needs (nano-ros cmake/zephyr/mps2-an385-serial.conf found it by linking:
# `ring_buf_get` from zenoh-pico src/system/zephyr/network.c).
CONFIG_SERIAL=y
CONFIG_POSIX_API=y
CONFIG_RING_BUFFER=y
