# Transport: zenoh over TCP, the LAN9118 via QEMU SLIRP, to a router on the
# host (always 10.0.2.2 under SLIRP).
#
#   NROS_QEMU_LINK=qemu-ethernet just qemu-build
#
# Taken from nano-ros's own an385 witness bundle, third-party/nano-ros/
# cmake/zephyr/mps2-an385.conf (phase-337 W2.b, phase-441 W1), whose reasoning
# is not repeated here -- read it there. In-kernel IP stack (NOT native_sim's
# host-socket offload) over eth_smsc911x, so unlike native_sim a real RTOS
# network stack is in the path.
#
# NOT the board's transport (the board runs island-serial), and it costs heap
# the serial link does not: measured 2026-09-25, this image with the board's
# 94,208 B NROS_ZEPHYR_HEAP_SIZE exhausts the heap in mrm_handler's
# subscriptions once the transient-local pool is large enough to get that far
# (docs/emulation.md). Use it for what only it can show: the IP stack.
# In-kernel IP stack (NOT native_sim's host-socket offload) over the
# eth_smsc911x driver against QEMU's lan9118 -- so, unlike native_sim, a real
# RTOS network stack is in the path. The router is the HOST's, which SLIRP
# always presents as 10.0.2.2. The port is the zenohd default the island's
# board Ethernet snippet also dials (7447).
CONFIG_NET_SOCKETS_OFFLOAD=n
CONFIG_NET_NATIVE=y
CONFIG_NET_DRIVERS=y
CONFIG_ETH_SMSC911X=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="10.0.2.15"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="10.0.2.2"
CONFIG_NET_DHCPV4=n
# SLIRP, not Zephyr's default SLIP arm (which needs a host daemon on
# /tmp/slip.sock or QEMU refuses to start).
CONFIG_NET_QEMU_USER=y
# NOT 10.0.2.2 (SLIRP's alias for the host, which reaches host 127.0.0.1:7447
# -- whatever happens to listen there; on 2026-09-25 that was another unit's
# board peer). 10.0.2.100 is a private address `just qemu-run` maps with
# guestfwd to its OWN router on QEMU_ROUTER_PORT, so a run cannot join a
# stranger's zenoh graph.
CONFIG_NROS_ZENOH_LOCATOR="tcp/10.0.2.100:7447"
# ROS domain, stated in Kconfig because nothing else delivers it. system.toml
# says `domain_id = 10`, but the image's key prefix comes from
# CONFIG_NROS_DOMAIN_ID (Kconfig default 0), and without this line the first
# boot declared `@ros2_lv/0/...` -- invisible to a domain-10 `ros2 node list`.
# The board's island-serial snippet sets the same line for the same reason
# (and island-ethernet does not, so that image would join domain 0).
CONFIG_NROS_DOMAIN_ID=10

# Graph discovery OFF, stated (phase8-W14; nano-ros phase-473 W1). A serial
# image derives it off; a TCP image derives it ON, and then keeps a cache of
# the whole domain's liveliness tokens: against a full Autoware host graph that
# cache alone exhausted a 1 MiB QEMU heap in 2.5 s (G3, phase-473 W1). The
# island makes no graph query of its own, a service call is a z_get on the
# service key whatever the cache holds, and the image still declares its own
# node and entity tokens, so `ros2 node list` on the host still lists it.
CONFIG_NROS_ZENOH_GRAPH_DISCOVERY=n

# Session lease 60 s, stated (phase8-W15). The island is a zenoh CLIENT of
# the router (nano-ros's only session mode on Zephyr; the router logs
# `whatami: client`), so gossip and peer autoconnect never reach it. What
# dropped it is the lease: zenoh-pico measures router silence against
# min(router lease, its own), rmw_zenohd announces 60 s with keep_alive 2 (a
# keepalive every 30 s on an idle link), and at the Zephyr default of 10 s the
# island decides the router is gone 2 x 10 s after the open. The CLOSE (reason
# 5, EXPIRED) and the reconnect's InitSyn then go out on the next byte the
# router sends: its 30 s keepalive, or a host peer's liveliness tokens when
# one joins (W8a's "0.15 s after `ros2 node list`"). Measured under QEMU with
# a TCP tap (phase8-W15): 10 s closes every run, 60 s holds with host peers
# joining; the same 10 s image holds against a router with keep_alive 6, and
# still drops with gossip off or on rmw_zenohd 0.1.10. Under QEMU it never
# comes back because guestfwd is one host connection for QEMU's lifetime.
# nano-ros issue 1574 moves the Zephyr default to 60000 (the cargo lane's
# value since issue 0906); this line states it until the pin carries it.
CONFIG_NROS_ZENOH_LEASE_MS=60000
# Packet pools: the island's own Ethernet snippet values
# (src/zephyr_entry/snippets/island-ethernet/ethernet.conf), which happen to be
# nano-ros's an385 values too.
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32

