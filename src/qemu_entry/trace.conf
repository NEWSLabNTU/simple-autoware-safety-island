# phase8-W17: the QEMU island with the BOARD's tracing block, trace window
# included (the end of src/zephyr_entry/boards/mr_canhubk3_s32k344.conf is the
# source of these values, except the buffer size, below; docs/tracing.md
# section 8). An extra conf fragment:
#   just trace-qemu-build        (EXTRA_CONF_FILE=<this> just qemu-build)
# The QEMU island is then read out over QEMU's monitor, as the board is over
# SWD (tools/timeline/readout.py --target qemu). Same Zephyr line (4.4), same
# event set, same window: what differs is the CPU (Cortex-M3, no DWT, so no
# marker self-cost), the clock (25 MHz SysTick), the link and so the buffer.
CONFIG_TRACING=y
CONFIG_TRACING_CTF=y
CONFIG_TRACING_SYNC=y
CONFIG_TRACING_BACKEND_RAM=y
# NOT the board's 32 KiB. This image's link is Ethernet (qemu-ethernet, the
# form just l3-island-qemu boots), and Zephyr 4.4's IP core emits CTF
# net_send_data/net_recv_data events through SYS_PORT_TRACING_FUNC, which
# no Kconfig masks (CONFIG_TRACING_NETWORKING=n does not stop them: the
# type masks apply to the OBJ_ macros only). They enter the stream from boot,
# 22 B each, and filled 32 KiB in 14.5 s with no Autoware attached (W17
# smoke run), before any trigger. The board's link is the UART, with no IP
# stack, so it has none of them. 1 MiB of QEMU's 4 MiB holds the whole run;
# `island_trace.py check` reports the island's own bytes after the trigger
# in the board's format, which is what the board's 32 KiB must hold.
CONFIG_RAM_TRACING_BUFFER_SIZE=1048576
CONFIG_ISLAND_TRACE_WINDOW=y
CONFIG_ISLAND_TRACE_PRE_MS=1500
CONFIG_ISLAND_TRACE_PRE_BYTES=2048
CONFIG_ISLAND_TRACE_SPIN_KEEP=10
# The board's SysTick runs at 160 MHz and so has the 64-bit cycle counter by
# default; at 25 MHz this one would not, and the island's stamps would take
# the 32-bit path the board no longer does (include/island_trace.h).
CONFIG_CORTEX_M_SYSTICK_64BIT_CYCLE_COUNTER=y
# Markers and heartbeats only, as on the board.
CONFIG_TRACING_THREAD=n
CONFIG_TRACING_SYSCALL=n
CONFIG_TRACING_WORK=n
CONFIG_TRACING_ISR=n
CONFIG_TRACING_IDLE=n
CONFIG_TRACING_SEMAPHORE=n
CONFIG_TRACING_MUTEX=n
CONFIG_TRACING_CONDVAR=n
CONFIG_TRACING_QUEUE=n
CONFIG_TRACING_FIFO=n
CONFIG_TRACING_LIFO=n
CONFIG_TRACING_STACK=n
CONFIG_TRACING_MESSAGE_QUEUE=n
CONFIG_TRACING_MAILBOX=n
CONFIG_TRACING_PIPE=n
CONFIG_TRACING_HEAP=n
CONFIG_TRACING_MEMORY_SLAB=n
CONFIG_TRACING_TIMER=n
CONFIG_TRACING_EVENT=n
CONFIG_TRACING_POLLING=n
CONFIG_TRACING_PM=n
CONFIG_TRACING_NETWORKING=n
CONFIG_TRACING_GPIO=n

# phase9-W4: as the board (mr_canhubk3_s32k344.conf, the phase9-W4 block):
# monitors armed by the handler, violation markers in the trace at 277-280.
CONFIG_NROS_MONITOR_ARM_ON_CALL=y
CONFIG_NROS_TRACE_CALLBACKS=y
# phase9-W4 rerun (phase-474 I3), as the board conf: takes traced so the
# island binds its three F4 inputs (forwarded at 281-283), one timer tick in
# ten keeps nano-ros's start/end pair (the emergency operator's every tick,
# forwarded at 274/275 with CONFIG_ISLAND_TRACE_TIMER_TICKS, off here).
CONFIG_NROS_TRACE_TAKES=y
CONFIG_NROS_TRACE_TIMER_EVERY=10
CONFIG_NROS_EXECUTOR_MAX_VIOLATIONS=8
