# Board delta -- QEMU `mps2/an385` (ARM MPS2 FPGA image AN385, Cortex-M3), on
# Zephyr 4.4, for the island's emulation rung (phase7-W2, docs/emulation.md).
#
# Auto-applied by Zephyr for board target `mps2/an385` (`/` -> `_`) because
# `just qemu-build` uses the snippet form (`-S nros-zenoh`); a -DCONF_FILE
# build would suppress this file, as src/zephyr_entry's board conf explains.
#
# TWO KINDS OF LINE, KEPT APART, AND ONE KIND ABSENT:
#
#   0. THE TRANSPORT is not here. As on the board entry it is a snippet the
#      recipe names: snippets/qemu-serial (zenoh over UART1 to a host PTY, the
#      board's own island-serial transport; the default) or
#      snippets/qemu-ethernet (zenoh over TCP, LAN9118 via QEMU SLIRP).
#   1. THE GUEST CLOCK, which is QEMU's and not the S32K344's.
#   2. THE BOARD FACTS, copied from src/zephyr_entry/boards/
#      mr_canhubk3_s32k344.conf VALUE FOR VALUE, so that this image runs the
#      S32K344's sizing and a stack or heap too small for the board fails HERE
#      first. Where a value had to differ, the line says so and why.
#
# NOTHING THE CONTRACT DETERMINES IS STATED HERE, by the rule the board conf
# closes with: a stated knob wins over the derivation and then drifts. Every
# NROS count this image uses is derived from safety_island.contract.yaml by the
# same resolver the board build runs; `just qemu-build` prints them.
#
# MEMORY. an385 has 4 MiB of SRAM at 0x20000000 and 4 MiB of flash at 0
# (zephyr boards/arm/mps2/mps2_base.dtsi sram0/flash0), against the S32K344's
# 320 KiB SRAM + 64 KiB ITCM + 128 KiB DTCM and 4 MiB flash. So this image is
# NOT a fit test for the board: the region report here shows what the island
# USES, and `just board-size` remains the only statement of whether it FITS.

# -- 1. Guest clock ----------------------------------------------------------------
# The an385 defconfig sets CONFIG_QEMU_ICOUNT_SHIFT=7 (icount: a guest clock
# decoupled from wall time, deterministic in instruction count). nano-ros
# turns it off for this board (cmake/zephyr/mps2-an385.conf, "QEMU timing")
# because host I/O -- SLIRP there, the UART1 PTY here as well -- runs in host
# real time, and zenoh's session lease then expires against a guest clock
# that is not moving with the link. Off here for the same reason.
# Consequence, stated in docs/emulation.md: durations on this rung are
# host-paced, not the part's.
CONFIG_QEMU_ICOUNT=n

# -- 2. Board facts, from the S32K344 board conf --------------------------------
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=0
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0
CONFIG_NROS_ZEPHYR_HEAP_SIZE=94208
CONFIG_NROS_GRAPH_CACHE_SIZE=4096
CONFIG_NROS_ZEPHYR_TASK_STACK_SIZE=8192
CONFIG_NROS_ZEPHYR_TASK_SLOTS=5
# The two POSIX pools zenoh-pico's sync groups draw from: one mutex and one
# cond per declared subscriber AND queryable, plus zenoh-pico's own. Stated
# because Kconfig cannot take a derived default; CHECKED because nano-ros
# (zephyr/cmake/nros_cargo_build.cmake, phase7-W8's floor) refuses the
# configure below 11 subs + 31 queryables + 24 + 4 = 70 mutexes and
# 11 + 31 + 2 + 4 = 48 conds, naming the number. At 64/16 the image failed
# at boot: the 8th subscriber on the cond pool, then the 30th queryable on the
# mutex pool (docs/boot-through.md). Same values as the board conf.
CONFIG_MAX_PTHREAD_MUTEX_COUNT=70
CONFIG_MAX_PTHREAD_COND_COUNT=48
CONFIG_NROS_BOOT_REPORT=y
# nano-ros nros/node.hpp includes <map> under __STDC_HOSTED__; same workaround
# and same reason as the board conf's REQUIRES_FULL_LIBCPP block.
CONFIG_REQUIRES_FULL_LIBCPP=y
# an385 has no entropy device either (nano-ros mps2-an385.conf, "Randomness").
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_TIMER_RANDOM_GENERATOR=y

# Diagnostics, as the board's.
CONFIG_LOG_MODE_IMMEDIATE=y
# DIFFERS from the board: asserts OFF. Measured 2026-09-25, first boot with
# them on:
#
#   ASSERTION FAIL [0] @ WEST_TOPDIR/zephyr/include/zephyr/kernel.h:2237
#       64-bit cycle counter not enabled on this platform. See
#       CONFIG_TIMER_HAS_64BIT_CYCLE_COUNTER
#   >>> ZEPHYR FATAL ERROR 4: Kernel panic on CPU 0 / Current thread: main
#
# The caller is zpico_init_with_config -> the session-id seed at nano-ros
# packages/rmw/zenoh/zpico-sys/c/zpico/zpico.c:894, `k_cycle_get_64()` with
# no CONFIG_TIMER_HAS_64BIT_CYCLE_COUNTER guard. The SysTick driver only
# provides that counter above 60 MHz; an385 runs at 25 MHz, the S32K344 at
# 160 MHz, so the board is not affected and this image is. nano-ros guards the
# same call in nros-platform-zephyr/src/platform.c:52-58 (issue #531) and not
# here; its own an385 lanes build without CONFIG_ASSERT, where the assert
# compiles out and the call returns 0 (a weaker seed, not a crash). A gap to
# file upstream, not to patch from here. Re-enable once zpico.c guards it.
CONFIG_ASSERT=n
CONFIG_THREAD_NAME=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=n

# DIFFERS from the board: the MPU stack guard, ON. nano-ros issue 0552 found
# that on this board a main-stack overflow without the guard walks into the
# idle thread's saved context and reports as a USAGE FAULT with every register
# zero. With the guard it reads "Stack overflow on CPU 0 / Current thread:
# main". The point of running the board's 16384 main stack here is to learn
# whether it overflows, so the overflow has to be legible.
CONFIG_HW_STACK_PROTECTION=y

# DIFFERS from the board: no shell. The board enables CONFIG_SHELL for bench
# bring-up; here the console is a captured file, and a shell prompt on it adds
# nothing a bounded run can use.
