# Safety-island system descriptor (nano-ros bringup pkg, schema v0.1).
#
# This file is AUTHORED, alongside launch/safety_island.launch.xml and that
# launch file's one sidecar, safety_island.contract.yaml, which states each
# node's endpoints, paths, services and parameters. Those three are the whole
# of what a human edits here. (A safety_island.system.posix.yaml once sat
# beside them on the belief that the contract channel needed it; it did not,
# and commit 2535dd7 deleted it.)
#
# `just sync` resolves them into build/nros/models/safety_island_bringup/
# system_model.yaml -- a BUILD ARTIFACT, gitignored, never hand-edited. The
# entries name this PACKAGE (`BRINGUP ../safety_island_bringup`) and let
# `nros model-path` find the artifact, so no CMakeLists spells a model path.

[system]
name = "safety_island"
rmw = "cyclonedds"
# The demo domain. The Zephyr image bakes CONFIG_NROS_CYCLONE_DOMAIN_ID=10 in
# src/native_sim_entry/prj-cyclonedds.conf (the rationale is there: the island
# talks to Autoware directly, no bridge, on a domain the shared host does not
# use), and the justfile defaults ROS_DOMAIN_ID to the same 10 for the host
# side. This value names the same choice for the readers that see system.toml
# before Kconfig runs; the three must agree, and nothing checks it yet.
domain_id = 10
default_launch = "safety_island.launch.xml"
# param_services: the six parameter services per node (get, set, list, ...)
# that make `ros2 param` work against the image. OFF since phase8-W1: they
# cost 24 of the image's 31 queryables and ~95 KB of heap at the first spin,
# and the S32K344 image does not fit with them (docs/boot-through.md,
# "Parameter store, minimal form"). What stays is the parameter STORE:
# nano-ros issue 1529 builds every Zephyr C++ image with it (nros-cpp
# `param-store`), so the launch file's `<param from>` values are seeded at
# boot and each component's declare_parameter reads them, or its source
# default, with no queryable behind it. What goes: `ros2 param get/set/list/
# describe/dump` and the parameter services, and the `use_sim_time` runtime
# switch. nano-ros phase-461 W6 (the `params` axis) replaces the interim:
# `params` declares the store without the services, for every image. Zephyr
# C++ images carried it already; the posix workspace build compiled nros-cpp
# without it while its generated entry seeds the launch parameters through
# `nros_cpp_declare_param`, and failed to link (at the pin 43fc1c2f too).
# P4 adds the E2E integrity layer (nano-ros RFC-0028): "safety".
features = ["params"]

# ── Components — uncommented as ports land ─────────────────────────────────
[[component]]
pkg = "autoware_mrm_emergency_stop_operator"
class = "autoware::mrm_emergency_stop_operator::MrmEmergencyStopOperator"
name = "mrm_emergency_stop_operator"

[[component]]
pkg = "autoware_mrm_comfortable_stop_operator"
class = "autoware::mrm_comfortable_stop_operator::MrmComfortableStopOperator"
name = "mrm_comfortable_stop_operator"

# stop_mode_operator left the image in phase8-W8a (phase-8 doc D4): Autoware
# 1.5.0 launches it only with the control-command gate, the demo runs
# vehicle_cmd_gate, and nothing reads /system/stop_mode/*. The package stays
# in src/ as a port; no entry builds it.

[[component]]
pkg = "autoware_mrm_handler"
class = "autoware::mrm_handler::MrmHandler"
name = "mrm_handler"

# ── The executor's levels (phase 13, nano-ros phase-509) ──────────────────
# No `[tasks.*]` table and no `group_tasks`: the levels are DERIVED by
# nano-ros (RFC-0108) from the contract's ranks (launch/
# safety_island.contract.yaml: the timer rates, the path deadlines, the
# reaction chains), one preemption level per band of ranks, inside the
# priority plan of the image being built (its .config: the transport band,
# pool.app). Each level is a worker thread over the core's ONE executor
# (nano-ros P9b), at its own kernel priority with a derived stack; a more
# urgent level preempts a running callback of a less urgent one. The
# contract supervises mrm_handler/call_mrm (`supervise:`), so a priority
# above the transport band is reserved for the supervisor's reaction thread
# (RFC-0079 section 6). `nros codegen entry` records the plan, the levels
# and each node's level beside the generated entry (nros_priority_plan.json,
# .h; NROS_ENTRY_LEVEL_OF_<node>); the supervisor's route 1 belongs to
# mrm_handler's level.
#
# Each level's spin period is derived from its fastest release (RFC-0079); it
# bounds only an idle park: an arrival in the level's band, the band's next
# timer or a supervised route's due ends it.

# No [deploy.*] target blocks: nodes stay UNPLACED in the model, i.e.
# board-agnostic (#236 semantics) — the SAME model bakes into the native
# entry (fast dev loop) and the zephyr entry. An explicit
# `target = "x86_64-unknown-linux-gnu"` would pin every node to linux and
# empty the zephyr slice ("places no nodes on board zephyr").

# ── The images (nano-ros RFC-0121 D2) ─────────────────────────────────────
# Each image's deployment lives HERE, in the bringup: nano-ros keeps a
# `system.toml` only in a bringup package and refuses one beside a package's
# code. Until the pin of 2026-11-10 each entry package (src/zephyr_entry,
# src/native_sim_entry, src/qemu_entry) carried its own `system.toml` with one
# `[image.*]` block; the blocks moved here unchanged, each naming its `entry`
# package and stating the `rmw` and `domain_id` its old `[system]` table did.
# The west builds name this bringup and the image
# (`-DNROS_IMAGE_SYSTEM_DIR=src/safety_island_bringup -DNROS_IMAGE=<id>`), so
# nano-ros configures the island workspace, not the entry directory.
#
# `rmw` is CHECKED against Kconfig (cmake/NanoRosImageAgreement.cmake): the
# `-S nros-zenoh` snippet the board and QEMU recipes pass satisfies `zenoh`;
# native_sim passes prj-cyclonedds.conf. An image is resolved by its `entry`,
# so board-only policy (the S32K344's TCM relocation, its snippets, its board
# conf) stays in src/zephyr_entry and never reaches the QEMU or native_sim
# image.

# The Zephyr family. The concrete board (the MR-CANHUBK344 the board-* recipes
# pass) is west's `-b` argument, resolved through nano-ros's board catalog.
[image.zephyr]
rmw = "zenoh"
domain_id = 10
board = "zephyr"
# RFC-0085 D4: a Zephyr image NAMES its entry package. Derivation from the
# image id gives the same answer; naming it keeps src/native_sim_entry from
# ever being a candidate for this block.
entry = "zephyr_entry"
# nano-ros knobs (RFC-0103 D2a, phase-484 W5b): these three were Kconfig lines
# in boards/mr_canhubk3_s32k344.conf, which states why each has its value; the
# pin of 2026-10-13 refuses them there. They were `env` rows of this block
# until the pin of phase10-B3, which refuses an env row naming a knob
# (nano-ros phase-484 W8) and takes them as knob tables. The values are
# unchanged.

[image.zephyr.knobs.zephyr]
# 2026-10-25 memory trim: the boot record of p2618-pb (nano-ros 4f545011ff)
# read peak 67,624 B and named 91,688 as the floor-keeping minimum
# (peak + 24,576 floor - 512 slab); rounded up to 1 KiB.
# 2026-11-06: the scenario-world-bridge CARLA acts (demo dc48871) read peak
# 68,456 B (act b), which left 24,216 B spare at 92,160 and refused the
# floor; 94,208 (+2 KiB) leaves 26,264 B, about 1.7 KB above it.
heap_size = 94208

[image.zephyr.knobs.zenoh]
graph_cache_size = 4096
# Off, as snippets/island-ethernet stated it until the same pin refused the
# Kconfig line there (its reason is beside the old line). The serial image
# derives off already, so the gate image's value does not change.
graph_discovery = false

[image.zephyr.knobs.executor]
max_violations = 8

# Parameter descriptions: none. No island node sets one, and the store pays
# the capacity per slot whether a description is set or not (nano-ros Kconfig
# NROS_MAX_PARAM_DESCRIPTION_LEN, default 256): 22 slots x 256 B = 5,632 B,
# all of it in DTCM, because the parameter store is part of the executor
# storage the entry relocates there (src/zephyr_entry/CMakeLists.txt).
# `ros2 param describe` answers with an empty description.
[image.zephyr.knobs.params]
max_param_description_len = 0

# The Zephyr family; the concrete board is west's `-b mps2/an385`
# (`just qemu-build`), resolved through nano-ros's board catalog.
[image.qemu]
rmw = "zenoh"
domain_id = 10
board = "zephyr"
# RFC-0085 D4: a Zephyr image NAMES its entry package, which keeps the two
# other entries from ever being a candidate for this block.
entry = "qemu_entry"

# nano-ros knobs (RFC-0103 D2a, phase-484 W8): Kconfig lines in
# boards/mps2_an385.conf (heap, graph cache), trace.conf (ring depth) and
# snippets/qemu-ethernet (graph discovery) until the nano-ros pin of
# phase10-B3 refused them there. Values unchanged; the reasons stay beside
# the old lines. `just trace-qemu-build` still raises the heap to 1 MiB for
# one build (-DNROS_OVERRIDE_ZEPHYR_HEAP_SIZE, just/emulation.just).
[image.qemu.knobs.zephyr]
heap_size = 106496

[image.qemu.knobs.zenoh]
graph_cache_size = 4096
graph_discovery = false

[image.qemu.knobs.executor]
max_violations = 8

# The Zephyr family; the concrete board is west's `-b native_sim/native/64`
# (`just zephyr-build`), resolved through nano-ros's board catalog.
[image.native_sim]
rmw = "cyclonedds"
domain_id = 10
board = "zephyr"
conf = ["prj-cyclonedds.conf"]
# RFC-0085 D4: a Zephyr image NAMES its entry package. Derivation from the
# image id gives the same answer; naming it keeps src/zephyr_entry from ever
# being a candidate for this block.
entry = "native_sim_entry"

# phase10-B3: the violation ring depth, a Kconfig line in prj.conf until the
# nano-ros pin of phase10-B3 refused it there (RFC-0103 D2a). Value unchanged.
[image.native_sim.knobs.executor]
max_violations = 8
