# Safety-island system descriptor (nano-ros bringup pkg, schema v0.1).
#
# This file is AUTHORED, alongside launch/safety_island.launch.xml and that
# launch file's one sidecar, safety_island.contract.yaml, which states each
# node's endpoints, paths, services and parameters. Those three are the whole
# of what a human edits here. (A safety_island.system.posix.yaml once sat
# beside them on the belief that the contract channel needed it; it did not,
# and commit 2535dd7 deleted it.)
#
# `just sync` resolves them into build/nros/models/safety_island_bringup/
# system_model.yaml -- a BUILD ARTIFACT, gitignored, never hand-edited. The
# entries name this PACKAGE (`BRINGUP ../safety_island_bringup`) and let
# `nros model-path` find the artifact, so no CMakeLists spells a model path.

[system]
name = "safety_island"
rmw = "cyclonedds"
# The demo domain. The Zephyr image bakes CONFIG_NROS_CYCLONE_DOMAIN_ID=10 in
# src/native_sim_entry/prj-cyclonedds.conf (the rationale is there: the island
# talks to Autoware directly, no bridge, on a domain the shared host does not
# use), and the justfile defaults ROS_DOMAIN_ID to the same 10 for the host
# side. This value names the same choice for the readers that see system.toml
# before Kconfig runs; the three must agree, and nothing checks it yet.
domain_id = 10
default_launch = "safety_island.launch.xml"
# param_services: the six parameter services per node (get, set, list, ...)
# that make `ros2 param` work against the image. OFF since phase8-W1: they
# cost 24 of the image's 31 queryables and ~95 KB of heap at the first spin,
# and the S32K344 image does not fit with them (docs/boot-through.md,
# "Parameter store, minimal form"). What stays is the parameter STORE:
# nano-ros issue 1529 builds every Zephyr C++ image with it (nros-cpp
# `param-store`), so the launch file's `<param from>` values are seeded at
# boot and each component's declare_parameter reads them, or its source
# default, with no queryable behind it. What goes: `ros2 param get/set/list/
# describe/dump` and the parameter services, and the `use_sim_time` runtime
# switch. nano-ros phase-461 W6 (the `params` axis) replaces the interim:
# `params` declares the store without the services, for every image. Zephyr
# C++ images carried it already; the posix workspace build compiled nros-cpp
# without it while its generated entry seeds the launch parameters through
# `nros_cpp_declare_param`, and failed to link (at the pin 43fc1c2f too).
# P4 adds the E2E integrity layer (nano-ros RFC-0028): "safety".
features = ["params"]

# ── Components — uncommented as ports land ─────────────────────────────────
[[component]]
pkg = "autoware_mrm_emergency_stop_operator"
class = "autoware::mrm_emergency_stop_operator::MrmEmergencyStopOperator"
name = "mrm_emergency_stop_operator"
group_tiers = { main = "mrm" }

[[component]]
pkg = "autoware_mrm_comfortable_stop_operator"
class = "autoware::mrm_comfortable_stop_operator::MrmComfortableStopOperator"
name = "mrm_comfortable_stop_operator"
group_tiers = { main = "mrm" }

# stop_mode_operator left the image in phase8-W8a (phase-8 doc D4): Autoware
# 1.5.0 launches it only with the control-command gate, the demo runs
# vehicle_cmd_gate, and nothing reads /system/stop_mode/*. The package stays
# in src/ as a port; no entry builds it.

[[component]]
pkg = "autoware_mrm_handler"
class = "autoware::mrm_handler::MrmHandler"
name = "mrm_handler"
group_tiers = { main = "mrm" }

# ── The executor's tier (phase 13) ─────────────────────────────────────────
# One tier, `mrm`, and every component's node-level group `main` bound to it
# (`group_tiers` above). It states NO priority and no platform sub-table: the
# priority is ALLOCATED by nano-ros (RFC-0079, issue 1426 rule 2) from the
# contract's ranks (launch/safety_island.contract.yaml: the timer rates, the
# path deadlines, the reaction chains), inside the priority plan of the image
# being built (its .config: the transport band, pool.app). A tier is one
# thread, so it takes the most urgent of its members' ranks, and the build
# prints the split it loses as a degradation. The contract supervises
# mrm_handler/call_mrm (`supervise:`), so a priority above the transport band
# is reserved for the supervisor's reaction thread (RFC-0079 section 6). The
# tier crosses the transport only if this table says `above = "transport"`
# (nano-ros #1967); it does not, so on the board image the tier runs at 5 in
# pool.app, below the transport's 4, and the reaction thread at 3. `nros
# codegen entry` records the plan and the tier beside the generated entry
# (nros_priority_plan.json, .h).
#
# One tier, not one per rate: each tier is an executor of its own, 53,776 B of
# storage on the board image, which does not fit (phase-13 doc).
#
# `spin_period` is the spin loop's park timeout, not a priority: 10 ms is what
# `run_components` used (spin_once(10)), so moving to the tier runner changes
# the priority and nothing else. Unset, the C tier runner would spin with a
# 1 ms timeout (nano-ros derives no spin period yet).
[tiers.mrm]
spin_period = "10ms"

# No [deploy.*] target blocks: nodes stay UNPLACED in the model, i.e.
# board-agnostic (#236 semantics) — the SAME model bakes into the native
# entry (fast dev loop) and the zephyr entry. An explicit
# `target = "x86_64-unknown-linux-gnu"` would pin every node to linux and
# empty the zephyr slice ("places no nodes on board zephyr").
