# Scheduling platform file for safety_island.launch.xml.
#
# WHY THIS FILE IS HERE AT ALL
#
# The node interface contract beside it (safety_island.contract.yaml) is what
# states each node's sub/pub sets, and the resolver only consults the contract
# channel when a scheduling platform file is present for the target -- the
# provider sidecar pair is `<stem>.contract.yaml` + `<stem>.system.<target>.yaml`.
# Without this file the island resolved to "4 nodes, 0 topics" and the contract
# was never read, which is why the topic wiring could not reach the SystemModel.
#
# `posix` is the resolver's default `--target`, and `nros sync` does not pass
# `--target`, so this is the name the sidecar channel looks for.
#
# WHAT IS DELIBERATELY NOT CLAIMED
#
# No reservations, no budgets, no priority bands. This system's timing has not
# been measured, and every field here is something a scheduler would act on: a
# budget_us invented to populate the file is a claim that the analysis then
# treats as fact. `reservations: none` and a best-effort mapper say honestly
# that the island is not yet scheduled, while still opening the channel the
# contract needs.
#
# When the timing IS measured -- the four components each run one timer, and
# their periods are in their param files -- this is where the budgets belong,
# alongside the per-path max_latency entries the contract can then carry.

target: posix

# rate_monotonic derives priority from the rates the contract states, and those
# rates are each node's own `update_rate`/`rate` parameter rather than a number
# invented to satisfy the mapper. `manual` is not usable here: it requires the
# legacy tiers+assign spec, reachable only through the `.toml` bridge.
mapper: rate_monotonic

# rate_monotonic assigns real-time priorities inside this band. The range is
# the mapper's own requirement, not a claim about what the island needs -- the
# island runs its four components on ONE Zephyr thread through the nano-ros
# executor, so no POSIX priority derived here is applied to anything today.
# It exists so the contract channel resolves; revisit it when the island
# actually runs tiers.
resources:
  rt_priority_band: { min: 10, max: 40 }

