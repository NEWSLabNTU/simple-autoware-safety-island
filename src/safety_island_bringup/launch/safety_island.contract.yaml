# Node interface contract for safety_island.launch.xml.
#
# WHY THIS FILE EXISTS
#
# A ROS 2 launch file names nodes, namespaces, parameters and remaps. It cannot
# say that a node creates seven subscriptions -- that is a property of the
# node's code, and `<remap>` only renames a topic the node already has. So the
# launch tree alone cannot size the image's pools.
#
# play_launch's contract channel is where that belongs. It is read through the
# PROVIDER SIDECAR channel -- `<stem>.contract.yaml` beside `<stem>.launch.xml`,
# on by default -- and folded into the SystemModel, whose `structure.topics`
# is what `nros_orchestration_ir::executor_sizing::count_callbacks` counts.
#
# THE CONTRACT ALONE IS ENOUGH. A `<stem>.system.<target>.yaml` scheduling
# platform file sat beside this one for a while, on the belief that the channel
# only opened when a platform file was present for the target. That was wrong,
# and it was measured wrong: resolving with and without it produced BYTE-
# IDENTICAL models. The symptom that produced the belief ("4 nodes, 0 topics")
# had a different cause -- this file had no `topics:` section at all -- and the
# platform file arrived at the same time as the fix. It is deleted.
#
# It replaces the `ENTITIES` lists duplicated across the four components'
# CMakeLists.txt. Those were hand-maintained with nothing comparing them to the
# code, and on 2026-09-04 that cost several days: mrm_handler declared six
# subscriptions and creates seven, so every pool derived from the list was short
# by one and the eleventh subscription failed at boot with an opaque transport
# error.
#
# THE TWO SECTIONS DO DIFFERENT JOBS
#
# `nodes:` names each node's endpoints and their rates. The keys are LOCAL
# endpoint names, not topic paths -- an absolute path here is concatenated onto
# the node FQN and produces a malformed `/node//abs/path` endpoint that matches
# no topic.
#
# `topics:` is the wiring: absolute topic name -> message type plus the endpoint
# refs on each side. `external: pub` means the publisher lives outside this
# image (the vehicle, Autoware proper); `external: sub` means the consumer does.
# Only two topics here are internal to the island, both MRM status reports.
#
# Rates are each node's own `update_rate`/`rate` parameter -- 10 Hz for
# mrm_comfortable_stop_operator and mrm_handler, 30 Hz for
# mrm_emergency_stop_operator and stop_mode_operator -- not numbers invented to
# satisfy the mapper.
#
# TIMERS ARE HERE, under each node's `paths:`. This file once said they could
# not be expressed and that `ENTITIES` had to survive to carry them. That was
# wrong. A node path is a `take -> publish` causal path, and a path whose
# trigger is `{ timer: { rate_hz: N } }` resolves into the model as a
# `contracts.node_paths` entry with an EMPTY `input` -- which the model's own
# definition of that field calls "periodic (timer-driven)". Each node here runs
# exactly one, and its `output` is what that tick actually publishes, read from
# the callback body rather than assumed to be every publisher the node has.
#
# SERVICES ARE HERE TOO, since 2026-09-06. They were omitted on the grounds
# that "nothing is claimed about them", which sounded conservative and was not:
# the image creates two service SERVERS, and a contract that omits them makes
# the derivation predict MAX_QUERYABLES 1 for an image that needs at least two.
# An omission is not neutral when something downstream sizes a pool from it.
#
# What settled it was the running board. With a router attached, the liveliness
# tokens it declares are the image describing itself:
#
#   SS mrm_comfortable_stop_operator /system/mrm/comfortable_stop/operate
#   SS mrm_emergency_stop_operator   /system/mrm/emergency_stop/operate
#   SC mrm_handler                   /system/mrm/comfortable_stop/operate
#   SC mrm_handler                   /system/mrm/emergency_stop/operate
#
# Both pairs are INTERNAL -- server and client are both on this board -- so
# neither needs the `external:` mark that a split pair does.

# PARAMETERS ARE DECLARED HERE, name and type, one entry per
# `declare_parameter<T>` call in the node's code (phase 446 in nano-ros). The
# sizes of the image's parameter store follow from this list: 21 parameters
# plus one `use_sim_time` per node gives 25 slots, and since every one is a
# scalar the string and array capacities are zero. Values stay in each
# package's `config/*.param.yaml`, loaded by the launch file. Capacities for a
# string or array parameter would be a board fact, never stated here.

version: 1

# ---------------------------------------------------------------------------
# WHAT HAPPENS WHEN THE INPUT STOPS
#
# Everything above this line is structure and rate: how many endpoints, how
# fast each one runs, how big the pools have to be. None of it says what the
# island is FOR. The island is a minimum-risk-manoeuvre controller. It exists
# because /system/operation_mode/availability can stop arriving, and when it
# does the vehicle has to be brought to a stop before the absence of that
# stream becomes a hazardous event. Until now that sentence lived in the
# README and in nobody's tooling.
#
# ISO 26262 gives the sentence a number. The fault-tolerant time interval is
# the time from the fault to the hazardous event when nothing reacts, and it
# has to cover detection plus reaction:
#
#   FTTI >= FDTI (fault -> detected) + FRTI (detected -> safe state reached)
#
# FDTI and FRTI are NOT authored here. They are derived from numbers this
# repository already ships in its own parameter files. `ftti` is the one
# genuinely new requirement, because it comes from physics and a hazard
# analysis rather than from code.
#
# THE ISLAND'S THREE TERMS, AND WHERE EACH ONE COMES FROM
#
#   FDTI = 500 ms.
#     mrm_handler's `timeout_operation_mode_availability: 0.5`, in
#     src/autoware_mrm_handler/config/mrm_handler.param.yaml. That parameter
#     IS the detector: the handler treats the availability stream as lost
#     once it has been silent for half a second. It is restated below as
#     `lease_duration: 500ms` on the subscriber, which is the same fact in
#     the vocabulary FDTI is derived from. Note what does NOT count: the
#     `min_rate_hz: 10` already declared on that subscriber is a requirement,
#     not a mechanism -- nothing fires when a period passes -- so the 10 Hz
#     floor buys no detection on its own.
#
#   reaction route = 110 ms.
#     `update_rate: 10` gives a 100 ms tick and `timeout_call_mrm_behavior:
#     0.01` gives 10 ms to get the behaviour called. 100 + 10 = 110. Both
#     numbers come from the same parameter file. The handler notices the
#     stale stamp on a tick, so the tick period is genuinely the first term
#     and not a padding allowance.
#
#   settle = 2034 ms.
#     The plant's share: how long the vehicle takes to actually stop once the
#     emergency stop has been commanded. From
#     src/autoware_mrm_emergency_stop_operator/config/mrm_emergency_stop_operator.param.yaml,
#     target_jerk -1.5 m/s^3 and target_acceleration -2.5 m/s^2, with an
#     ASSUMED entry speed of 3.0 m/s. No parameter in this repository states
#     an entry speed; 3.0 m/s is the single invented input in this whole
#     block, and it is named here rather than buried so that anyone reading
#     the budget knows which term is a reading and which is an assumption.
#       ramp to full braking:   t1 = 2.5 / 1.5              = 1.667 s
#       speed lost in the ramp: 0.5 * 1.5 * 1.667^2         = 2.083 m/s
#       the rest at -2.5:       (3.000 - 2.083) / 2.5       = 0.367 s
#       settle = 1.667 + 0.367                              = 2.034 s
#
#   500 + 110 + 2034 = 2644 ms, against `ftti: 3s`. 356 ms of slack.
#
# WHY THE FTTI IS 3 s
#
# It is the one number here that is a judgement rather than a reading, and it
# is deliberately round. What matters is that it is now written down and
# checked: set it to 2.5s and the checker rejects the contract and names the
# terms that no longer fit inside it. The arithmetic above is implied by the
# parameter files today and performed by nothing.
#
# WHERE THE CHAIN OUTRUNS THE CHECKER
#
# The island's real reaction crosses a SERVICE. mrm_handler calls
# /system/mrm/emergency_stop/operate, and it is mrm_emergency_stop_operator
# that publishes /system/emergency/control_cmd. The reaction walk follows
# TOPIC edges only, so it cannot step across that service call: a reaction
# declared as ending at /system/emergency/control_cmd comes back as
# unreachable, because no chain of topic hops leads there. So the declared
# reaction ends where mrm_handler's own output ends -- /system/fail_safe/
# mrm_state, the island announcing that the manoeuvre is running -- and the
# operator's contribution is carried in the settle term instead of as a route
# hop. That is a real limitation, stated rather than papered over. The 30 Hz
# operator tick is 33 ms, which is well inside the 356 ms of slack, so the
# verdict does not turn on it; but this budget is a model of the chain and
# not a trace of it, and the two internal status topics are the only place
# the island's own wiring closes a loop the walk can see.
#
# WHY THERE IS NO comfortable_stop RUNG
#
# The graded ladder -- comfortable stop first, emergency stop as the floor --
# is Autoware's shape, and the island does ship both operators. It is not the
# island's CONFIGURED ladder: mrm_handler.param.yaml sets
# `use_comfortable_stop: false` and `use_pull_over: false`, so the handler as
# configured here has exactly one rung. Declaring `modes:` with a graded
# reaction that the parameters disable would be writing down a promise the
# image does not keep, so the ladder stays out and the hazard's reaction is
# the single scope path below. If those parameters are ever turned on, the
# rung belongs here and `ladder-rung-budget` will check it in its own right.

# WHAT THE CHECKER STILL COMPLAINS ABOUT, AND WHY IT IS LEFT ALONE
#
# Two diagnostics survive this block on purpose. Neither is an error and both
# are true.
#
#   warning[reaction-unguarded]: the reaction ends at /system/fail_safe/
#     mrm_state and nothing subscribes to it with an `on_violation`. Correct,
#     and not fixable from inside the island: that topic is `external: sub`,
#     so the only thing that could notice a STALLED manoeuvre is Autoware
#     proper. Who watches the watcher is a real open question here, and the
#     honest answer is "something outside this image, and it is not declared
#     anywhere yet". Silencing it would be worse than carrying it.
#
#   info[path-exclusion]: `on_timer` may wait up to 110 ms for `call_mrm`,
#     because every path of a node is assumed to serialise unless the node
#     declares otherwise. For mrm_handler that assumption is exactly right --
#     the two paths ARE the same callback body -- so there is nothing to
#     declare and nothing to fix.
#
# One more thing worth knowing, because it is invisible in the output: the
# hazard makes the checker DERIVE mrm_handler's criticality (ASIL_D, role
# `detects`), which is what carries the safety requirement into scheduling.
# It derives it for mrm_handler and for no other node on the island -- and
# the reason is the same service boundary as above. mrm_emergency_stop_
# operator, the node that actually performs the stop, is reached over
# /system/mrm/emergency_stop/operate, so the `reacts` walk never gets to it
# and the hazard's severity never lands on it.

# ISO 26262's scale, stated rather than assumed. It happens to be the
# checker's default; writing it out is what makes `severity: ASIL_D` below a
# reference to a named scale rather than a string nobody validates.
severity_levels: [QM, ASIL_A, ASIL_B, ASIL_C, ASIL_D]

hazards:
  operation_mode_unavailable:
    severity: ASIL_D
    description: >-
      the operation-mode availability stream stops, so nothing upstream is
      still deciding whether the vehicle may drive; the island has to bring
      it to a stop before the silence becomes a hazardous event
    guards: [/system/operation_mode/availability]
    on: omission
    ftti: 3s
    reaction: island.emergency_stop

nodes:
  mrm_comfortable_stop_operator:
    params:
      update_rate: { type: integer }
      min_acceleration: { type: double }
      max_jerk: { type: double }
      min_jerk: { type: double }
    srv:
      operate: {}
    paths:
      # `onTimer` -> `publishStatus()`. The velocity-limit publishers are not
      # here: they fire on an operate/cancel service transition, not on the
      # tick, so listing them would claim a periodic output the node does not
      # produce.
      on_timer:
        trigger: { timer: { rate_hz: 10 } }
        output: [status]
    pub:
      max_velocity_candidates: { min_rate_hz: 10 }
      clear_velocity_limit: { min_rate_hz: 10 }
      status: { min_rate_hz: 10 }

  mrm_emergency_stop_operator:
    params:
      update_rate: { type: integer }
      target_acceleration: { type: double }
      target_jerk: { type: double }
    srv:
      operate: {}
    paths:
      # `onTimer` -> `publishControlCommand()` + `publishStatus()`.
      on_timer:
        trigger: { timer: { rate_hz: 30 } }
        output: [emergency_control_cmd, status]
        # One tick of `update_rate: 30`. This node IS the second half of the
        # island's reaction, and its 33 ms is the hop the fault-reaction walk
        # cannot see, because mrm_handler reaches it over the
        # /system/mrm/emergency_stop/operate SERVICE and the walk follows
        # topic edges. Declared anyway: the number is a fact about the node
        # whether or not a rule consumes it today, and it is what makes the
        # claim "the missing hop is 33 ms, inside the slack" checkable by a
        # human reading this file.
        max_latency: 33ms
    sub:
      # Cached in onControlCommand and read on the timer as the ramp seed: a
      # read-latest input, not a trigger. `state: true` says so; without it
      # the checker's state-consistency rule warns that the subscriber is
      # neither a path trigger nor state.
      control_cmd: { min_rate_hz: 30, qos: { depth: 1 }, state: true }
    pub:
      emergency_control_cmd: { min_rate_hz: 30 }
      status: { min_rate_hz: 30 }

  # The arbiter. Seven subscriptions -- `operation_mode_state` is the one the
  # CMakeLists list omitted.
  mrm_handler:
    params:
      update_rate: { type: integer }
      timeout_operation_mode_availability: { type: double }
      timeout_call_mrm_behavior: { type: double }
      timeout_cancel_mrm_behavior: { type: double }
      use_emergency_holding: { type: bool }
      timeout_emergency_recovery: { type: double }
      use_parking_after_stopped: { type: bool }
      use_pull_over: { type: bool }
      use_comfortable_stop: { type: bool }
      turning_hazard_on.emergency: { type: bool }
      turning_indicator_on.emergency: { type: bool }
    cli:
      comfortable_stop_operate: {}
      emergency_stop_operate: {}
    paths:
      # `onTimer` -> publishMrmState / TurnIndicatorCmd / HazardCmd / GearCmd /
      # EmergencyHolding, in that order.
      on_timer:
        trigger: { timer: { rate_hz: 10 } }
        output:
          - mrm_state
          - turn_indicators_cmd
          - hazard_lights_cmd
          - gear_cmd_out
          - emergency_holding
        # One tick of `update_rate: 10`. A timer callback that has not
        # finished when the next tick is due is late by any definition, so
        # the period is the budget; it is not a new number.
        max_latency: 100ms
      # THE REACTION. This is the same callback body as `on_timer` -- the
      # handler notices the stale availability stamp on a tick and calls the
      # MRM behaviour from there; there is no separate subscription callback
      # in the code. It is declared as an input-triggered path because that
      # is the shape a detector reaction has: it is caused by the fault on
      # `operation_mode_availability`, not by the clock. The 110 ms is the
      # tick it waits for (100 ms) plus `timeout_call_mrm_behavior` (10 ms),
      # so the periodic implementation is accounted for inside the number
      # rather than hidden by the declaration.
      call_mrm:
        trigger: { input: [operation_mode_availability] }
        output: [mrm_state]
        max_latency: 110ms
        # The safe state: the island has commanded the manoeuvre, and the
        # plant needs `settle` on top of that to actually be stopped. The
        # settle is the one term software cannot derive; its arithmetic is at
        # the top of this file, and its one assumed input (3.0 m/s entry
        # speed) is named there.
        safe_state: { emits: mrm_state, settle: 2034ms }
    sub:
      # `lease_duration` is `timeout_operation_mode_availability: 0.5` from
      # this node's own parameter file, restated as the middleware fact it
      # is. `on_violation` is what makes this subscriber a DETECTOR rather
      # than a consumer that happens to have a rate wish: without it the
      # hazard above has nothing watching its guard, and the checker says so.
      operation_mode_availability:
        min_rate_hz: 10
        qos: { depth: 1, liveliness: manual_by_topic, lease_duration: 500ms }
        on_violation:
          on: [omission]
          reaction: call_mrm
          within: 110ms
      kinematic_state: { min_rate_hz: 10, qos: { depth: 1 } }
      control_mode: { min_rate_hz: 10, qos: { depth: 1 } }
      comfortable_stop_status: { min_rate_hz: 10, qos: { depth: 1 } }
      emergency_stop_status: { min_rate_hz: 10, qos: { depth: 1 } }
      gear_cmd_in: { min_rate_hz: 10, qos: { depth: 1 } }
      operation_mode_state: { min_rate_hz: 10, qos: { depth: 1 } }
    pub:
      mrm_state: { min_rate_hz: 10 }
      gear_cmd_out: { min_rate_hz: 10 }
      hazard_lights_cmd: { min_rate_hz: 10 }
      turn_indicators_cmd: { min_rate_hz: 10 }
      emergency_holding: { min_rate_hz: 10 }

  stop_mode_operator:
    params:
      rate: { type: double }
      stop_hold_acceleration: { type: double }
      enable_auto_parking: { type: bool }
    paths:
      # `on_timer` -> publish_control_command / gear_command /
      # turn_indicators_command / hazard_lights_command.
      on_timer:
        trigger: { timer: { rate_hz: 30 } }
        output: [control, gear, turn_indicators, hazard_lights]
    sub:
      steering_status: { min_rate_hz: 30, qos: { depth: 1 } }
      velocity_status: { min_rate_hz: 30, qos: { depth: 1 } }
      route_state: { min_rate_hz: 30, qos: { depth: 1 } }
    pub:
      control: { min_rate_hz: 30 }
      gear: { min_rate_hz: 30 }
      hazard_lights: { min_rate_hz: 30 }
      turn_indicators: { min_rate_hz: 30 }

# The reaction, as a scope path: from the guarded input to the island's own
# announcement that the manoeuvre is running. mrm_handler is the only hop the
# topic graph can see -- see WHERE THE CHAIN OUTRUNS THE CHECKER at the top of
# this file.
#
# 210 ms, not the 110 ms of the reaction route, and the difference is not
# slack. A scope path's budget is checked against the NOMINAL traversal, and
# the nominal traversal of a 10 Hz node is one sampling wait (100 ms, because
# an arriving message waits for the next tick) plus the tick's own budget
# (100 ms). The fault route is shorter than the nominal route here, which is
# the right way round and worth saying out loud: the handler does not have to
# wait for fresh data to react to its absence. Declaring 110 ms here instead
# makes `scope-budget` reject the file against a 200 ms critical path, which
# is the checker being correct about a different question.
paths:
  island.emergency_stop:
    trigger: { input: [/system/operation_mode/availability] }
    output: [/system/fail_safe/mrm_state]
    max_latency: 210ms

topics:
  # --- internal to the island: both sides are components in this image -------
  /system/mrm/comfortable_stop/status:
    type: tier4_system_msgs/msg/MrmBehaviorStatus
    pub: [mrm_comfortable_stop_operator/status]
    sub: [mrm_handler/comfortable_stop_status]
    rate_hz: 10
  /system/mrm/emergency_stop/status:
    type: tier4_system_msgs/msg/MrmBehaviorStatus
    pub: [mrm_emergency_stop_operator/status]
    sub: [mrm_handler/emergency_stop_status]
    rate_hz: 30

  # --- consumed by the island, produced by the vehicle or Autoware ----------
  /control/command/control_cmd:
    type: autoware_control_msgs/msg/Control
    external: pub
    sub: [mrm_emergency_stop_operator/control_cmd]
    rate_hz: 30
  /system/operation_mode/availability:
    type: tier4_system_msgs/msg/OperationModeAvailability
    external: pub
    sub: [mrm_handler/operation_mode_availability]
    rate_hz: 10
  /localization/kinematic_state:
    type: nav_msgs/msg/Odometry
    external: pub
    sub: [mrm_handler/kinematic_state]
    rate_hz: 10
  /vehicle/status/control_mode:
    type: autoware_vehicle_msgs/msg/ControlModeReport
    external: pub
    sub: [mrm_handler/control_mode]
    rate_hz: 10
  /control/command/gear_cmd:
    type: autoware_vehicle_msgs/msg/GearCommand
    external: pub
    sub: [mrm_handler/gear_cmd_in]
    rate_hz: 10
  /api/operation_mode/state:
    type: autoware_adapi_v1_msgs/msg/OperationModeState
    external: pub
    sub: [mrm_handler/operation_mode_state]
    rate_hz: 10
  /vehicle/status/steering_status:
    type: autoware_vehicle_msgs/msg/SteeringReport
    external: pub
    sub: [stop_mode_operator/steering_status]
    rate_hz: 30
  /vehicle/status/velocity_status:
    type: autoware_vehicle_msgs/msg/VelocityReport
    external: pub
    sub: [stop_mode_operator/velocity_status]
    rate_hz: 30
  /planning/route_state:
    type: autoware_planning_msgs/msg/RouteState
    external: pub
    sub: [stop_mode_operator/route_state]
    rate_hz: 30

  # --- produced by the island, consumed outside it --------------------------
  /planning/scenario_planning/max_velocity_candidates:
    type: autoware_internal_planning_msgs/msg/VelocityLimit
    external: sub
    pub: [mrm_comfortable_stop_operator/max_velocity_candidates]
    rate_hz: 10
  /planning/scenario_planning/clear_velocity_limit:
    type: autoware_internal_planning_msgs/msg/VelocityLimitClearCommand
    external: sub
    pub: [mrm_comfortable_stop_operator/clear_velocity_limit]
    rate_hz: 10
  /system/emergency/control_cmd:
    type: autoware_control_msgs/msg/Control
    external: sub
    pub: [mrm_emergency_stop_operator/emergency_control_cmd]
    rate_hz: 30
  /system/fail_safe/mrm_state:
    type: autoware_adapi_v1_msgs/msg/MrmState
    external: sub
    pub: [mrm_handler/mrm_state]
    rate_hz: 10
  /system/emergency/gear_cmd:
    type: autoware_vehicle_msgs/msg/GearCommand
    external: sub
    pub: [mrm_handler/gear_cmd_out]
    rate_hz: 10
  /system/emergency/hazard_lights_cmd:
    type: autoware_vehicle_msgs/msg/HazardLightsCommand
    external: sub
    pub: [mrm_handler/hazard_lights_cmd]
    rate_hz: 10
  /system/emergency/turn_indicators_cmd:
    type: autoware_vehicle_msgs/msg/TurnIndicatorsCommand
    external: sub
    pub: [mrm_handler/turn_indicators_cmd]
    rate_hz: 10
  /system/fail_safe/emergency_holding:
    type: tier4_system_msgs/msg/EmergencyHoldingState
    external: sub
    pub: [mrm_handler/emergency_holding]
    rate_hz: 10
  /system/stop_mode/control:
    type: autoware_control_msgs/msg/Control
    external: sub
    pub: [stop_mode_operator/control]
    rate_hz: 30
  /system/stop_mode/gear:
    type: autoware_vehicle_msgs/msg/GearCommand
    external: sub
    pub: [stop_mode_operator/gear]
    rate_hz: 30
  /system/stop_mode/hazard_lights:
    type: autoware_vehicle_msgs/msg/HazardLightsCommand
    external: sub
    pub: [stop_mode_operator/hazard_lights]
    rate_hz: 30
  /system/stop_mode/turn_indicators:
    type: autoware_vehicle_msgs/msg/TurnIndicatorsCommand
    external: sub
    pub: [stop_mode_operator/turn_indicators]
    rate_hz: 30

# The two MRM operate services. `mrm_handler` is the arbiter: it decides which
# behaviour to run and calls the operator that runs it. Both sides are on this
# board, so both are stated and neither is external.
services:
  /system/mrm/comfortable_stop/operate:
    type: tier4_system_msgs/srv/OperateMrm
    server: [mrm_comfortable_stop_operator/operate]
    client: [mrm_handler/comfortable_stop_operate]
  /system/mrm/emergency_stop/operate:
    type: tier4_system_msgs/srv/OperateMrm
    server: [mrm_emergency_stop_operator/operate]
    client: [mrm_handler/emergency_stop_operate]
