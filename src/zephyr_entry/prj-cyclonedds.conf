# RMW overlay: Cyclone DDS backend (Phase 117 / 169.5).
#
# Cyclone DDS is C++-only (depends on NROS_CPP_API). The C side
# can't select it.

CONFIG_NROS_RMW_CYCLONEDDS=y

# RTPS uses UDP multicast for SPDP discovery.
CONFIG_NET_IPV4_IGMP=y
CONFIG_POSIX_API=y
CONFIG_MAX_PTHREAD_MUTEX_COUNT=256
CONFIG_MAX_PTHREAD_COND_COUNT=256
CONFIG_POSIX_THREAD_THREADS_MAX=16

# Resource sizing — Cyclone is heavy.
CONFIG_MAIN_STACK_SIZE=524288
CONFIG_HEAP_MEM_POOL_SIZE=4194304
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192

CONFIG_NET_PKT_RX_COUNT=64
CONFIG_NET_PKT_TX_COUNT=64
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=128

# Phase 11W.12 — runtime parity with the Rust cyclonedds overlay.
# The universal bool configs (THREAD_LOCAL_STORAGE / THREAD_CUSTOM_DATA
# / DYNAMIC_THREAD(+ALLOC) / THREAD_STACK_INFO / THREAD_MONITOR) come
# from CONFIG_NROS_RMW_CYCLONEDDS in zephyr/Kconfig. The int knobs +
# native_sim NSOS offload are example-local:
#   COMMON_LIBC_MALLOC_ARENA_SIZE — Cyclone's participant init does
#     many small mallocs; the ARCH_POSIX default (16 KiB) trips
#     ddsrt_malloc → CODE_UNREACHABLE in picolibc libc-hooks. 16 MiB
#     gives ample headroom.
#   DYNAMIC_THREAD_STACK_SIZE — per-worker-thread stack.
# 16 MiB sufficed while the domain bridges scoped the island to ~8 topics;
# the direct connection (island on Autoware's domain 1) makes cyclone build
# proxies for the ENTIRE sim graph (~68 composables, thousands of remote
# endpoints) and the arena blows at participant discovery (ddsrt_malloc ->
# abort at t=0 when joining a running stack). native_sim can afford RAM.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=268435456
CONFIG_DYNAMIC_THREAD_STACK_SIZE=32768

# NET_TCP — sockwaitset self-pipe (loopback TCP socket pair). Kept
# here because selecting it from NROS_RMW_CYCLONEDDS forms a Kconfig
# dependency loop through NET_SOCKETS.
CONFIG_NET_TCP=y

# Diagnostics — verbose asserts + immediate logging keep Cyclone init
# failures legible (picolibc drops fprintf(stderr)).
CONFIG_ASSERT=y
CONFIG_ASSERT_VERBOSE=y
CONFIG_PICOLIBC_ASSERT_VERBOSE=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Phase 11W.8 — force NSOS (board overlay not auto-applied under
# explicit CONF_FILE). Host BSD sockets instead of zeth/TAP.
# native_sim-only; real hardware uses its actual net stack.
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y

# ── safety-island additions ─────────────────────────────────────────────────
# Compile-time domain id (embedded rule — never runtime env). Domain 1 =
# Autoware's own domain: the island talks to the stack DIRECTLY (the
# domain-bridge middle-man is gone since the direct-connection restructure).
CONFIG_NROS_CYCLONE_DOMAIN_ID=1
# 4 ported nodes ≈ 30+ DDS entities, each with mutex+cond — the example
# default (256) exhausted mid-boot (ddsrt_mutex_init abort in the LAST
# node's ctor; the documented MAX_PTHREAD_MUTEX_COUNT pitfall, scaled).
#
# 16384 was in turn exhausted by the FULL Autoware graph: cyclone took one
# pool mutex per proxy entity AND one per addrset, so the count scaled with the
# remote endpoint count, not with our own. It hit exactly 16384/16384 ~19 s
# into SEDP ingestion and the next ddsrt_mutex_init silently failed — nano-ros
# issue 0371, which needed 131072 slots (~4.1 MiB of static RAM) to clear.
#
# ...and then the whole term went away. Cyclone's ddsrt now uses a Zephyr-NATIVE
# sync backend (issue 0496): ddsrt_mutex_t is an embedded `struct k_mutex` and
# ddsrt_cond_t an embedded `struct k_condvar`, so neither takes a slot from
# Zephyr's fixed pthread pools at all. The pool no longer scales with anything
# cyclone does, which is why these are back to the example defaults after having
# been walked up 256 -> 16384 -> 131072 chasing the graph size.
#
# They are not zero because Zephyr's POSIX layer is still used for THREADS
# (cyclone calls pthread_create) and for the single rwlock in ddsrt/src/log.c,
# neither of which scales with the graph.
CONFIG_MAX_PTHREAD_MUTEX_COUNT=256
CONFIG_MAX_PTHREAD_COND_COUNT=256

# Compile-time cyclone config (nano-ros issue 0367 wired the knob; env
# CYCLONEDDS_URI is invisible to native_sim). Direct-connection profile:
# multicast OFF (NSOS breaks cyclone's multicast waitset — phase 180) +
# unicast 127.0.0.1 peer scan WIDENED to 250 indices so the island can
# discover every participant of the Autoware stack on domain 1 (cyclone's
# default range of 9/baked 20 overflows on ~40 processes; overflowed
# participants take random ports and stay invisible to unicast scan
# forever). Sizing/Threads carried over from the nano-ros baked profile.
# Single-quoted XML attributes — Kconfig strings can't escape doubles.
CONFIG_NROS_CYCLONE_CONFIG_XML="<CycloneDDS><Domain Id='any'><General><AllowMulticast>false</AllowMulticast></General><Discovery><ParticipantIndex>auto</ParticipantIndex><MaxAutoParticipantIndex>120</MaxAutoParticipantIndex><Peers><Peer Address='127.0.0.1'/></Peers></Discovery><Sizing><ReceiveBufferSize>64 KiB</ReceiveBufferSize><ReceiveBufferChunkSize>16 KiB</ReceiveBufferChunkSize></Sizing><Threads><Thread Name='dq.builtins'><StackSize>64 KiB</StackSize></Thread></Threads><Tracing><Verbosity>warning</Verbosity><OutputFile>stdout</OutputFile></Tracing></Domain></CycloneDDS>"
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MAX_NAME_LEN=32
