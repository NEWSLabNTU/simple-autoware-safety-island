# Serial transport for the island entry — no IP stack at all.
#
# Applied via EXTRA_CONF_FILE, which Zephyr merges AFTER prj.conf, after
# boards/mr_canhubk3_s32k344.conf and after the `-S nros-zenoh` snippet, so the
# `=n` lines here win over all three. Check the generated `.config`, never the
# fragment sources.
#
# WHY: the T1 link needs a media converter we do not have, so the only wire that
# reaches the router today is the DCD-LZ UART. The Ethernet build is kept as the
# Z1 target; this is what can actually be exercised on the bench.
#
# The IP stack is not merely unused in that configuration, it is unreachable
# code holding RAM on a part that has 320 KiB in total. Everything below is off
# rather than left to default.

# ── zenoh over SERIAL ───────────────────────────────────────────────────────
# lpuart2 = DCD-LZ P6 = /dev/ttyUSB0 on the bench host. The console is moved to
# unwired lpuart0 by serial.overlay so console bytes cannot corrupt the COBS
# frame stream — the overlay is REQUIRED, not optional.
CONFIG_NROS_TRANSPORT_SERIAL=y
CONFIG_NROS_ZENOH_LOCATOR="serial/uart@40330000#baudrate=115200"

# ROS domain. The domain is the FIRST element of every key rmw_zenoh builds
# (`@ros2_lv/<domain>/...`), so a mismatch is invisible at the transport layer:
# the session opens, the router forwards, and `ros2 topic list` simply never
# matches. Both sides must agree.
CONFIG_NROS_DOMAIN_ID=10

# ── The IP stack, off ───────────────────────────────────────────────────────
CONFIG_NETWORKING=n
CONFIG_NET_IPV4=n
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=n
CONFIG_NET_UDP=n
CONFIG_NET_SOCKETS=n
CONFIG_NET_L2_ETHERNET=n
CONFIG_NET_CONFIG_SETTINGS=n
CONFIG_NET_STATISTICS=n
CONFIG_NET_SHELL=n
CONFIG_DNS_RESOLVER=n

# ── The MAC and PHY drivers, off ────────────────────────────────────────────
# These are `default y` + `depends on DT_HAS_<compat>_ENABLED`, and the board
# DTS has emac0/mdio0/ethernet-phy@12 `status = "okay"` — so they arrive by
# themselves and must be turned off by name. The board conf explains at length
# why it does NOT set them; that reasoning holds for the Ethernet build and is
# exactly inverted here.
CONFIG_ETH_NXP_S32_GMAC=n
CONFIG_PHY_TJA1103=n
CONFIG_MDIO=n
CONFIG_ETH_DRIVER=n

# ── zenoh's own socket links, off ───────────────────────────────────────────
# Turning off Zephyr's networking is not enough on its own: zenoh-pico compiles
# its TCP/UDP link implementations from these feature flags, and they reach for
# AF_INET / socklen_t / struct sockaddr, none of which exist without the stack.
CONFIG_NROS_ZENOH_LINK_TCP=n
CONFIG_NROS_ZENOH_LINK_UDP_UNICAST=n
CONFIG_NROS_ZENOH_LINK_UDP_MULTICAST=n

# The UART itself, and POSIX for the zenoh tasks.
CONFIG_SERIAL=y
CONFIG_UART_MCUX_LPUART=y
CONFIG_POSIX_API=y
