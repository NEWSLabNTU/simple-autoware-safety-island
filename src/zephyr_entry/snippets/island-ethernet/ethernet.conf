# Transport overlay: zenoh over TCP on the 100BASE-T1 link.
#
# Selected by `-S island-ethernet`. These settings used to live in
# boards/mr_canhubk3_s32k344.conf, which made Ethernet the silent default and
# left serial as an override you had to remember. The board file now carries
# only what is true of the BOARD regardless of transport -- console, watchdog,
# sizing, entity limits, randomness -- and each transport brings its own.
#
# The text below is moved verbatim from that file; its reasoning is unchanged.

# ── Networking: the REAL stack ──────────────────────────────────────────────
# prj.conf already enables NETWORKING / IPV4 / UDP / SOCKETS / L2_ETHERNET.
# What is board-specific is that we use an actual MAC+PHY rather than
# native_sim's NSOS host-socket offload. NSOS is selected only by
# prj-cyclonedds.conf, which is not applied on this path — asserted here so a
# stray offload symbol cannot silently take over the socket layer.
CONFIG_NET_SOCKETS_OFFLOAD=n

CONFIG_NET_L2_ETHERNET=y

# The MAC, MDIO and PHY drivers are NOT enabled here, deliberately. All three
# are `default y` + `depends on DT_HAS_<compat>_ENABLED`, and the board DTS
# already has `status = "okay"` on &emac0, &mdio0 and ethernet-phy@12:
#
#   ETH_NXP_S32_GMAC  default y, depends on DT_HAS_NXP_S32_GMAC_ENABLED
#   PHY_TJA1103       default y, depends on DT_HAS_NXP_TJA1103_ENABLED,
#                     and `select MDIO` — so MDIO arrives with it
#   ETH_DRIVER        default y if NET_L2_ETHERNET
#
# Setting them by hand would be redundant on 4.4 and, worse, would read as
# though this file controls whether they are present. It does not; the
# devicetree does. If the drivers are ever missing, the fault is a DT node
# being disabled, not a missing symbol here — check `west build -t menuconfig`
# or the generated .config rather than adding lines.

# Static addressing. DHCP would add a server dependency to a safety island;
# the host side of the demo is a fixed lab network. Keep in step with the
# Autoware host's address plan.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.10.20"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.10.1"
CONFIG_NET_CONFIG_INIT_TIMEOUT=30

# Where the zenoh session connects. WITHOUT this the image inherits the nano-ros
# default `tcp/127.0.0.1:7456` and dials ITSELF: the IP stack comes up, the link
# is fine, ping works, and the ROS graph never appears. That is a Z3 failure with
# a Z1-shaped symptom, so set it explicitly rather than relying on a default that
# is correct only for a host-side loopback demo.
#
# The address is the machine running `ros2 run rmw_zenoh_cpp rmw_zenohd` -- the
# Orin in the vehicle, this workstation on the bench (192.168.10.77, already on
# the board's subnet). Port 7447, confirmed by `ss -ltnp` against a live router;
# the Kconfig default of 7456 is NOT what rmw_zenoh binds.
CONFIG_NROS_ZENOH_LOCATOR="tcp/192.168.10.77:7447"


# One TCP link to the zenoh router. Stock is host-scale: 8 connections, 32
# socket contexts.
CONFIG_NET_MAX_CONN=4
CONFIG_NET_MAX_CONTEXTS=8

# Packet and buffer pools. Moved here from the board conf with the rest of the
# networking settings: they cost nothing in a serial image because the pools do
# not exist there, and on a 100 Mbit link feeding a 320 KiB part they are the
# first thing to cut if RAM runs out.
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32

# `net` shell commands (iface, ping) -- only meaningful with a stack.
CONFIG_NET_SHELL=y
