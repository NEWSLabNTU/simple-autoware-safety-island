# The booth image (snippet island-booth; rtss-work-2026-demo:docs/design/carla-island-demo.md
# section 3, unit C5).
#
# The user RGB LED shows the MRM handler's state (section 3.2's mapping) and
# CAN LED0 blinks at 1 Hz from the handler's own tick (src/island_led.c).
# The driver writes a pin only when its level changes: Zephyr 4.4's CTF
# backend traces every GPIO API call, and setting the pins on every tick
# filled the 52 KiB trace buffer before the act (led-e2). Cost against the
# gate image: FLASH +744 B, DTCM +88 B, ITCM +32 B, SRAM 0.
CONFIG_ISLAND_LED=y

# The visitor's buttons (section 3.4, unit C6): SW1 the driver's takeover, SW2
# the encore's HPC loss, read by the GPIO driver's port read in the handler's
# tick (no CTF record) and recorded in island_button_record for the act on the
# host (src/island_buttons.c, tools/board/board_buttons.py).
CONFIG_ISLAND_BUTTONS=y
