# P4 zephyr entry — native_sim first (fastest loop), QEMU board after.
# Values seeded from nano-ros examples/zephyr/cpp + the ASI fork overlay;
# trimmed during bring-up.
CONFIG_CPP=y
CONFIG_STD_CPP14=y
CONFIG_RUST=y
CONFIG_NROS=y
CONFIG_NROS_RMW_CYCLONEDDS=y
CONFIG_NROS_CYCLONE_DOMAIN_ID=2
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_POSIX_API=y
CONFIG_MAX_PTHREAD_MUTEX_COUNT=16
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=262144
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=262144
