# DERIVED, not stated here (phase-403 W8/W9). These four were hand-set and a
# board .conf WINS over the derivation, so stating them suppressed it:
#   NROS_SUBSCRIPTION_BUFFER_SIZE  NROS_EXECUTOR_MAX_CBS
#   NROS_MAX_LARGE_SUBSCRIBERS     NROS_SUBSCRIBER_LARGE_SIZE
# They now come from this image's own bound + entity inventories. Read the
# values in build/nros_derived_knobs.cmake; do not restate one here without
# saying what the derivation got wrong.

# Board delta — NXP MR-CANHUBK344 (S32K344, Cortex-M7) on Zephyr 4.4.
#
# Auto-applied by Zephyr for board target `mr_canhubk3/s32k344` (the `/` is
# normalised to `_` for the filename). Phase 3, docs/roadmap/phase-3-canhubk344-real-silicon.md.
#
# ── HOW THIS FILE IS (AND IS NOT) APPLIED ───────────────────────────────────
# Zephyr merges fragments in the order: CONF_FILE (default prj.conf) ->
# boards/<board>.conf -> EXTRA_CONF_FILE. Snippets append to EXTRA_CONF_FILE,
# so `-S nros-cyclonedds` lands AFTER this file and WINS any conflict.
#
# Two consequences, both load-bearing:
#   1. This file cannot shrink a value the RMW snippet sets. Where the snippet's
#      host-scale sizing has to come down (it must — see below), the override
#      has to come after it, not here. Check the generated `.config`, never the
#      fragment sources.
#   2. Passing `-DCONF_FILE="prj.conf;prj-<rmw>.conf"` SUPPRESSES this file
#      entirely (prj-cyclonedds.conf documents that behaviour for native_sim).
#      Hardware builds must use the snippet form:
#          west build -b mr_canhubk3/s32k344 -S nros-<rmw> src/zephyr_entry
#
# ── THE CONSTRAINT ──────────────────────────────────────────────────────────
# 320 KiB SRAM, total, for .data + .bss + heap + every stack.
# (DTS: sram0_1@20400000 = 320K; plus ITCM 64K @0 and DTCM 128K @0x20000000.)
# For comparison, nano-ros's Cyclone snippet asks for a 512 KiB main stack, a
# 4 MiB heap pool and a 16 MiB malloc arena — sized for native_sim, where the
# comment in our own prj-cyclonedds.conf says outright "native_sim can afford
# RAM". This board cannot. Every number below is a FIRST ESTIMATE to be
# measured on hardware, not a known-good value.

# Every CONFIG_ symbol below was checked to exist in Zephyr v4.4.0 before being
# written. Zephyr WARNS on an unknown symbol in a fragment but does not fail, so
# a typo is silently inert — the same dead-config trap that removed the driver
# lines below.
#
# ── Console ─────────────────────────────────────────────────────────────────
# The board DTS puts zephyr,console + zephyr,shell-uart on lpuart2, which is
# what reaches the DCD-LZ adapter's FTDI header.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# ── FS26 PMIC watchdog ──────────────────────────────────────────────────────
# The FS26 challenger watchdog resets the MCU ~256 ms after power-on unless it
# is serviced. Zephyr ships a driver and the board's own defconfig already sets
# CONFIG_WATCHDOG=y; this is here to make the dependency explicit and to fail
# loudly if a future prj.conf turns watchdog support off.
#
# If the board resets in a loop anyway, fall back to FS26 debug mode on the
# bench: JP1 off -> exactly 12.0 V on P27/P28 -> JP1 on -> LED D24 dark.
CONFIG_WATCHDOG=y

# ── Sizing, measured ────────────────────────────────────────────────────────
# Deliberately an order of magnitude under the RMW snippet's host-scale values.
# The snippet DOES win the merge, as this file's earlier draft predicted it
# might: measured directly, the board-file values for MAIN_STACK/HEAP had no
# effect on .config at all. That override now lives in the `board-build` recipe.
#
# The snippet no longer wins. nano-ros supplies its RMW sizing as `configdefault`
# entries (zephyr/Kconfig, "RMW resource sizing"), which land in each symbol's
# DEFAULT list rather than as an assignment, so this file beats them and the
# values below take effect from here. They used to be -D flags in the
# `board-build` recipe because that was the only hook merging later than
# EXTRA_CONF_FILE; that column is gone, and the env vars survive there only as a
# per-build triage lever.
#
# UNVALIDATED AT RUNTIME. The snippets picked host-scale numbers deliberately --
# zenoh 16 KiB stack / 64 KiB heap, Cyclone 512 KiB / 4 MiB / 16 MiB arena --
# against 320 KiB of SRAM in total. A stack overflow, or a NULL out of
# nros_platform_alloc (printk "nros: HEAP EXHAUSTED"), is the expected symptom
# if these are too small. Note WHICH knob: the allocation one is
# CONFIG_NROS_ZEPHYR_HEAP_SIZE, not CONFIG_HEAP_MEM_POOL_SIZE.
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# -- The Zephyr KERNEL heap, which is not the application heap --------------
# Application allocation goes through nros_platform_alloc into the unified
# rlsf arena sized by CONFIG_NROS_ZEPHYR_HEAP_SIZE below (nano-ros phase-391
# W3). CONFIG_HEAP_MEM_POOL_SIZE feeds a SECOND, separate heap -- Zephyr's
# `_system_heap`, behind k_malloc/k_free -- and at 8192 this image carried
# both. Measured in build-board/zephyr/zephyr_pre0.map:
#
#   kheap_buf__system_heap   0x204c = 8,268 B  (.noinit, not .bss)
#
# on an image that overruns its RAM region by 61,608 B
# (_image_ram_end 0x2045f0a8 - __kernel_ram_end 0x20450000 = 0xf0a8).
#
# 0 here does NOT mean "no kernel heap", and the link does NOT lose k_malloc.
# Zephyr sums every enabled subsystem's CONFIG_HEAP_MEM_POOL_ADD_SIZE_* and
# rounds the pool up to that sum when it exceeds this symbol
# (zephyr/kernel/Kconfig:779-794). This image enables two:
#
#   CONFIG_HEAP_MEM_POOL_ADD_SIZE_POSIX_THREADS     256
#   CONFIG_HEAP_MEM_POOL_ADD_SIZE_POSIX_SEMAPHORES  256
#
# so K_HEAP_MEM_POOL_SIZE settles at 512 (read it back in build-board's
# build.ninja) and the pool costs 572 B instead of 8,268 B.
#
# MEASURED, rebuilt with 0 in place: kheap_buf__system_heap 0x23c = 572 B, and
# the RAM region overflow fell from 61,608 B to 53,912 B -- 7,696 B recovered,
# which is the heap delta exactly. The image still does NOT link: `region RAM
# overflowed by 53912 bytes` is the remaining, separate problem (the zenoh RMW
# is linked twice; see the note at the end of this file).
#
# Driving it to literally zero would need CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y,
# and that is NOT safe here -- three callers still reference the k_malloc
# family in this image, verified with `nm --undefined-only` over the build's
# archives:
#
#   modules/nros/libnros.a(nros_platform_zephyr_shims.c.obj)  k_malloc, k_free
#       (the timer bridge, nano-ros zephyr/nros_platform_zephyr_shims.c:222-255)
#   zephyr/lib/posix/.../liblib__posix__options.a(semaphore.c.obj) k_calloc, k_free
#   zephyr/lib/posix/.../liblib__posix__options.a(key.c.obj)       k_malloc, k_free
#
# POSIX is not optional here: zenoh-pico runs on pthreads and this file sets
# CONFIG_MAX_PTHREAD_MUTEX_COUNT=64 for it. So the kernel heap stays, small.
# Raise this only if a k_malloc failure is actually observed; the application
# allocator is CONFIG_NROS_ZEPHYR_HEAP_SIZE and raising this instead does
# nothing for it.
CONFIG_HEAP_MEM_POOL_SIZE=0
# ── Memory placement ────────────────────────────────────────────────────────
# Enables zephyr_code_relocate() in the entry CMakeLists, which moves the app
# library's .bss into the otherwise-idle DTCM. See that file for why the net
# stack must NOT follow it there, and for the required Zephyr patch.
CONFIG_CODE_DATA_RELOCATION=y

# ── nano-ros sizing (Kconfig-backed since nano-ros #749) ────────────────────
# Set here rather than as a justfile environment export because these have
# `_nros_resolve_knob` rows, so their values are BAKED into the cargo command in
# build.ninja. Knobs without a row are only inherited from the shell that runs
# ninja, and revert to crate defaults for anyone who rebuilds a configured tree
# directly -- see the warning in the `board-build` recipe.
#
# 1024 is deliberate, not inherited. The largest subscribed type is
# nav_msgs/Odometry; nano-ros serializes its fixed-capacity strings by actual
# length (`write_string(fixed_str(..))`), so the wire size is
#   8 (stamp) + 344 (pose+cov) + 336 (twist+cov) + two length-prefixed strings
#   = ~718 B with Autoware's "map" / "base_link", not the 1208 B a 255-char
#   frame_id would cost.
# ~40% headroom. Raising this ALSO requires recomputing
# NROS_EXECUTOR_ARENA_SIZE in the recipe: the arena is
# max_cbs * (3 * rx_buf + 512) + 2048, so the two move together.
#
# The failure mode if it is ever too small is SILENT on the C++ arena dispatch
# path -- the sample is dropped at try_recv with BUFFER_TOO_SMALL and the
# subscription simply looks like it never fires.

# ── Entity limits and pools, measured ───────────────────────────────────────
# All Kconfig-backed and NOT set by the nros-zenoh snippet, so unlike
# MAIN_STACK_SIZE and the NET_PKT/NET_BUF counts they take effect from here.
# The five formerly env-only knobs became Kconfig rows in nano-ros #0752; before
# that they reached cargo only from the shell that ran ninja, so a bare `ninja`
# silently rebuilt at crate defaults.
#
# Measured across the four MRM nodes: 4 nodes, 11 subscriptions, 14 publishers,
# 2 service servers, 2 poll-model clients, 13 callbacks, 29 liveliness tokens.
#
# Stock defaults were WRONG here, not merely generous: MAX_SUBSCRIBERS and
# MAX_PUBLISHERS are 8, which fails at runtime past the eighth; RMW_SUBSCRIBER_SLOTS
# is 8 against 11 subscriptions.
#
# NROS_MAX_LIVELINESS is NOT stated here any more (phase6-W7). It derives from
# the contract -- see "WHAT IS STILL HAND-SET HERE" at the end of this file for
# why the 32 that sat on this line was wrong and why it must not come back.

# 13 callbacks measured (11 subs + 2 service servers; clients are poll-model).
# The arena is derived in nros-node/build.rs at ACTION-CLIENT size per slot
# (~18 KiB); this island instantiates no action entity, so it is set explicitly
# from the pub/sub-only figure build.rs documents:
#   max_cbs * (3 * NROS_SUBSCRIPTION_BUFFER_SIZE + 512) + 2048
#   = 14 * (3 * 1024 + 512) + 2048 = 52224
# Raising the subscription buffer means recomputing this.
# 4 nodes measured. The stock default is also 4, i.e. exactly the need and no
# headroom -- adding a fifth node would fail to attach at boot, which is a poor
# way to discover a limit. 6 costs a NodeRecord + DispatchSlot + a 32-byte group
# string per spare slot.
# EXECUTOR_ARENA_SIZE: PINNED (2026-09-04). Not the arena's fault, and pinned
# anyway -- read this before unpinning a third time.
#
# The arena has now been exonerated TWICE by direct experiment: flashing a
# 40960 image reproduced a silent board exactly, and later a 33824 image and a
# 40960 image both failed to register nodes identically. It is not the variable
# in either failure.
#
# What is pinned here is the WHOLE derived configuration's readiness, not this
# knob. Measured on the board, same router and procedure:
#
#   Z4 image, every knob hand-set     4 MRM nodes on the graph
#   derived, MAX_QUERYABLES=0         board silent (nano-ros issue 1015, FIXED)
#   derived, 1015 fixed, arena 33824  board transmits, ZERO nodes
#
# So a second defect remains somewhere in the derived knobs, independent of the
# queryables floor and of the arena. Until it is found, the arena rides with
# the rest of the derived set rather than being the one derived value in an
# otherwise-unverified configuration.
#
# UNPINNED 2026-09-06, on exactly the condition this line named: a fully
# derived image observed serving four MRM nodes. See the counts block below for
# why the earlier observation said otherwise (the node count was read on the
# wrong ROS domain).
#
# 0 means DERIVE. Watch the linked size when this changes: the derivation
# budgets every callback slot generously, and too small fails at RUNTIME rather
# than at link, which is the direction the boot report exists to catch.
# The old hardcoded 52224 was hand-derived from a wrong handle count AND
# charged every publisher three receive buffers it never uses.

# The arena above is ONE allocation out of the nano-ros platform heap, so the
# heap must hold it plus the allocator's own overhead. The default is 65536
# against 52224 + ~24576 = 76800 needed: short by 11264 B. Left at the default
# this image links clean and then stops mid-boot on a NULL -- nano-ros prints
# "nros: HEAP EXHAUSTED" from nros_platform_alloc, but this board's console is
# not wired, so nothing is seen; nano-ros's build-time check is what surfaced
# it (see 4c). 80 KiB rounds the requirement up and leaves 3328 B of slack.
#
# 94208 IS A GUESS. It is listed under "not derived" at the end of this file
# and nothing in this tree measured it. DO NOT replace it with another guess.
#
# HOW TO GET THE REAL NUMBER. It is a runtime high-water figure, so it needs a
# run. There is no static model and no way to derive it from the contract.
#
#   Field:   "platform heap PEAK" in the boot self-report
#            (nros_zephyr_heap_peak(), the rlsf arena's own counter)
#   Enabled: CONFIG_NROS_BOOT_REPORT=y, already set below.
#
#   1. just board-build && just board-flash
#   2. let the image reach FirstSpin (the report's own `stage` field says so)
#   3. read $(python3 third-party/nano-ros/scripts/read-boot-report.py \
#          --addr-only build-board/zephyr/zephyr.elf)
#      # prints "<addr> <len>" for the savemem line; the address is resolved
#      # from the ELF, so a relinked image cannot be read at a stale one
#   4. pyocd commander -t s32k344 -c halt -c "savemem <addr> <len> report.bin"
#   5. python3 third-party/nano-ros/scripts/read-boot-report.py \
#          build-board/zephyr/zephyr.elf report.bin
#
#   Then read three lines of its output:
#
#     platform heap used      <- live bytes
#     platform heap PEAK      <- THE NUMBER, plus % of the arena
#     platform heap capacity  <- echoes this knob, to confirm what ran
#
# THREE THINGS THAT INVALIDATE THE READING, in the order you will hit them:
#
#   a. "platform heap  not instrumented (nros-platform/heap-stats off)" means
#      capacity came back 0 and the build has no counters. Nothing to read;
#      fix the build first.
#   b. If PEAK is GREATER than capacity, the counter is not a high-water mark
#      at all and the script says so: zpico-alloc decrements used_bytes only on
#      the SLAB free path, never on the rlsf path, so `used` is
#      cumulative-allocated and `peak` tracks that. DO NOT SIZE FROM IT.
#      Upstream needs the block size at free (rlsf 0.2.3 exposes
#      allocation_usable_size only under its `unstable` feature).
#   c. The peak is taken at the LAST SUBSCRIPTION, not at steady state. Any
#      allocation the application makes after entity creation is not in it.
#      Add headroom deliberately and write down how much.
#
# NOT OBTAINABLE WITHOUT SILICON, and the native_sim image is not a substitute:
# it is Zephyr 3.7 LTS over CycloneDDS (`just zephyr-build`), a different RMW
# with a different allocation profile, and -DCONF_FILE= there suppresses this
# file entirely. The number has to come off this board.
CONFIG_NROS_ZEPHYR_HEAP_SIZE=94208

# zenoh payload classes. LARGE defaults to 2 x 4 x 16384 = 128 KiB, provisioned
# for image-scale messages; the largest subscribed type here is nav_msgs/Odometry
# at ~718 B on the wire. Ring depth is left at the nano-ros default of 4 -- it is
# the receive queue, so cutting it is a QoS reduction, not slack.

# Graph liveliness cache. Defaults to 65536, sized for a HOST domain: upstream
# measured a box running one talker plus the ROS 2 daemon carrying 222 tokens.
# On this part that is 20% of total SRAM sitting in .bss whether or not the graph
# is ever queried, and it is what put this image 54,312 bytes over the RAM region
# -- `g_sessions` measured 85,584 B, of which 64 KiB is this buffer.
#
# The island declares 29 liveliness tokens of its own (see the entity counts
# above). 8192 holds ~58 at the ~140 bytes per keyexpr upstream measured, so it
# covers the island with headroom but NOT a full Autoware host domain. That is
# the right trade here: these four nodes do not enumerate the ROS graph, and an
# overflow is COUNTED and reported by zpico_graph_cache_copy rather than silently
# truncated -- if this is ever too small it shows up as a drop count, not a wrong
# answer.
CONFIG_NROS_GRAPH_CACHE_SIZE=4096

# ── Randomness ──────────────────────────────────────────────────────────────
# SECURITY: this is a NON-CRYPTOGRAPHIC RNG, seeded from a timer.
#
# CONFIG_ENTROPY_GENERATOR=y only enables the entropy DRIVER CLASS. The S32K344
# has no entropy node in Zephyr 4.4 (dts/arm/nxp/s32/nxp_s32k344_m7.dtsi
# declares none, and drivers/entropy has no S32K3 backend -- entropy_nxp_ele.c
# and entropy_nxp_els_trng.c target other NXP families). With no
# ENTROPY_HAS_DRIVER, both ENTROPY_DEVICE_RANDOM_GENERATOR and
# XOSHIRO_RANDOM_GENERATOR are unselectable, so nothing implements
# sys_rand_get() and the image does not link.
#
# TEST_RANDOM_GENERATOR is the only remaining backend. Zephyr names it "TEST"
# deliberately: its output is predictable. It currently feeds TCP initial
# sequence numbers (CONFIG_NET_TCP_RANDOMIZED_RTO) and zenoh's session id.
# Predictable TCP ISNs permit off-path sequence-number guessing -- connection
# injection or reset by an attacker who can reach the network.
#
# Acceptable ONLY for bench bring-up on the isolated lab network. Before this
# board is put on a vehicle network it needs a real entropy source: an S32K3
# CSEc/HSE entropy driver, or an external TRNG. Do not treat this line as
# settled.
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_TIMER_RANDOM_GENERATOR=y

# The libc malloc arena, reclaimed. Measured on build-board: `malloc_arena` was
# 24,576 B of .bss, `malloc_prepare` ran at init to set it up -- and `malloc`
# itself was NOT in .text. The linker had garbage-collected it because nothing
# calls it: nano-ros allocates through `nros_platform_alloc` ->
# `nros_zephyr_heap_alloc` -> the rlsf arena in nros-platform's `zephyr_heap`
# (CONFIG_NROS_ZEPHYR_HEAP_SIZE), and zenoh-pico's `z_malloc` routes through
# that same funnel (RFC-0034 D6). So the arena was reserved, initialised, and
# unreachable -- 7.7% of the part's 320 KiB SRAM held by a heap with no
# allocator.
#
# CORRECTED phase-391 W3. This comment used to write the funnel as
# `nros_platform_alloc` -> `k_malloc` -> `_system_heap`
# (CONFIG_HEAP_MEM_POOL_SIZE). That was the pre-phase-391 shape. The conclusion
# about the libc arena is unchanged either way: nothing calls `malloc`.
#
# Set to 0 rather than deleted: the default is non-zero, so omitting the line
# brings the waste back. If a future component genuinely needs libc malloc the
# link fails with an undefined reference, which is the right way to find out.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0

# Packet/buffer pools: the snippet asks 64/64 and 128/128. On a 100 Mbit link
# feeding a 320 KiB part these are the first thing to cut if RAM runs out.
# NOT set here: the nros-zenoh snippet sets all four (zenoh.conf:24-27) and
# wins the merge, exactly as it does for MAIN_STACK/HEAP above. Passed as
# `-DCONFIG_*` from the `board-build` recipe instead.

# ── Diagnostics for bring-up ────────────────────────────────────────────────
# Immediate logging so an allocation abort or a PHY failure is legible rather
# than lost in a deferred buffer at reset. Cheap to turn down later.
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_ASSERT=y
CONFIG_ASSERT_VERBOSE=y
CONFIG_THREAD_NAME=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=n
CONFIG_SHELL=y

# -- RESOLVED: the zenoh RMW was linked twice; it is not any more ------------
# This file used to carry a note that `nros-rmw-zenoh` was compiled twice, once
# under `libnros_c.a` and once under `libnros_cpp.a`, with different
# `-C metadata` so the statics did not collide and the linker allocated both --
# ~195 KiB of a 320 KiB part, with SUBSCRIBER_BUFFERS, NEXT_BUFFER_INDEX and
# OVERFLOW_DROPS existing in two divergent copies.
#
# Re-measured on the current image (build-board/zephyr/zephyr_pre0.map): it is
# fixed. One copy only.
#
#   libnros_c.a occurrences in the map            0
#   nros_rmw_zenoh -C metadata hashes             1  (09a7e9acba4d5e2c)
#   SUBSCRIBER_BUFFERS  0x2044263c  0x974 = 2,420 B, libnros_cpp.a, single
#
# Kept as a record rather than deleted because the note outlived its defect and
# was still being read as the explanation for this image's RAM overflow. It is
# not. The overflow is the parameter-service inbox tables: 24 of the image's 26
# queryables are parameter services, 108,096 B measured, against an overflow of
# 53,912 B. See nano-ros issue 1352.

CONFIG_NROS_ZEPHYR_TASK_STACK_SIZE=8192

# No action entity on this island, so do not budget arena slots at
# ActionClient size (~18 KiB each). Issue 0900's knob.

# phase-403 W3/W5 landed, so the arena is claimed per type at registration
# instead of max_cbs * worst case. The derivation still provisions the old way,
# so pin it: 36 slots at the 512 default derive 75776 B, while the real claim is
# the 13 receiving entities' own bounds. Read the first-spin advisory (issue
# 0900 W1) and re-pin if this is wrong -- it reports what was actually used.

# zenoh needs read, lease and tx-flush tasks; the default 4 slots ran out
# and the runtime said so: "OUT OF THREAD SLOTS ... expect missing rx and
# session expiry". Each slot costs NROS_ZEPHYR_TASK_STACK_SIZE (8192 B
# here), which is why this is 5 and not a round number.
CONFIG_NROS_ZEPHYR_TASK_SLOTS=5




# All six derived knobs are PINNED to the Z4-verified values below. The
# derivation works and was measured; what is NOT established is whether a
# fully-derived image serves the ROS graph. See the note on
# EXECUTOR_ARENA_SIZE above -- and read this before unpinning any of them:
#
#   Z4 image, all hand-set          4 MRM nodes (reproduced)
#   fully derived                   0 nodes in several trials
#
# but the node-count signal is only ~60% reliable on this rig (one config gave
# 4, 0, 0, 4, 4 across five runs), so those trials do not identify a knob and
# do not prove a defect exists. RTT cannot discriminate either: the Z4 image
# that DOES serve four nodes prints only the Zephyr banner, exactly like the
# derived one, so application silence is not evidence of a halt.
#
# UNPINNED 2026-09-06. The condition above was "an instrument that answers
# reliably", and there are now two.
#
# The BOOT REPORT (nano-ros phase-412) is a fixed RAM record read with a
# debugger, so "did this image reach FirstSpin" no longer depends on a console
# this board does not have.
#
# And the node-count signal that produced "0 nodes in several trials" was being
# read WRONG, which is the more important half. The island runs on
# ROS_DOMAIN_ID 10; the readings were taken with the ros2 CLI on domain 0. The
# board's liveliness tokens are stamped `@ros2_lv/10/...`, so a domain-0 query
# returns an empty graph no matter what the image is doing -- and an empty
# graph is exactly what "0 nodes" recorded. The 4/0/0/4/4 flapping was a stale
# ros2 daemon over that same mistake, not a knob.
#
# So the evidence that pinned these was not evidence. Both instruments now
# agree on a derived image; the values below are what the contract derives,
# left here as a comment because a Kconfig default of -1 means DERIVE and
# writing the number back would re-pin it:
#
#   MAX_CBS 19   MAX_SUBSCRIBERS 11   RMW_SUBSCRIBER_SLOTS 11
#   MAX_PUBLISHERS 14   MAX_QUERYABLES 2   EXECUTOR_MAX_NODES 4
#
# Those come from safety_island.contract.yaml and they match the entities the
# running board declares over the wire, one for one.

# phase-412 -- zenoh-pico creates ONE pthread mutex per subscriber sync group,
# and Zephyr's POSIX mutex pool is static. At the default 32 the eleventh
# subscriber fails pthread_mutex_init, _z_sync_group_state_create returns -1,
# and z_declare_subscriber hands back a bare _Z_ERR_GENERIC. That crosses the
# C ABI as NROS_RMW_RET_ERROR and reaches the component as a -100
# "transport error" -- naming nothing, on a board whose console is not wired.
#
# MEASURED on silicon: 32 -> the image stops at ExecutorReady with ten of
# eleven subscriptions; 64 -> FirstSpin with all eleven. Raising
# CONFIG_MAX_PTHREAD_COND_COUNT alone does NOT help, so the mutex pool is the
# binding one.
#
# Budget it as one per subscriber plus the session's own, not as a round
# number: this is a count, and the image already states its subscriber count.
#
# phase7-W8 (docs/boot-through.md): that held while the image declared 2
# queryables. zenoh-pico takes a mutex AND a cond for every declared queryable
# too, and the image now declares 31 (24 parameter services, 2 app services,
# 5 transient-local caches). Under QEMU, at 64 mutexes the 30th queryable
# failed, and at the cond default of 16 the 8th subscriber did: the four
# mrm_handler subscriptions W7 reported with no token are those four
# declarations, refused by this pool. nano-ros now refuses the configure below
# its floor for a derived
# table and names it: 11 + 31 + 24 + 4 = 70 mutexes, 11 + 31 + 2 + 4 = 48
# conds (nano-ros issue 1498). At FirstSpin on QEMU the pools held 66 and 45.
CONFIG_MAX_PTHREAD_MUTEX_COUNT=70
CONFIG_MAX_PTHREAD_COND_COUNT=48

# The boot self-report: an 80-byte fixed record in RAM, read back by halting
# the core (scripts/read-boot-report.py resolves its address from the ELF).
#
# ON for this board specifically, and the reason is the board. lpuart0 is the
# console and is not wired; lpuart2 carries the zenoh serial transport and
# cannot take a second protocol. So every diagnostic nano-ros writes about a
# failed allocation or a refused entity goes to a sink that does not exist
# (issue 1036), and the failures being diagnosed halt before any stream could
# carry them anyway. A RAM record read with a debugger is the only channel
# there is.
#
# 80 bytes against 320 KiB, against a campaign that spent days on a -100 that
# named nothing. Issue 1036 also asks for a cell that exercises this on
# silicon; leaving it ON is the half of that which can be done from here.
CONFIG_NROS_BOOT_REPORT=y

# -- C++ standard library ------------------------------------------------------
# WORKAROUND (2026-09-21, nano-ros f0d191c98). `nros/node.hpp:18` includes
# `<map>` (phase-417 W4.a, for `rclcpp::Node::declare_parameters<T>`) under
#     #if defined(NROS_CPP_STD) || (__STDC_HOSTED__ + 0)
# Zephyr compiles C++ hosted (`__STDC_HOSTED__` is 1) but with `-nostdinc++`
# under the default MINIMAL_LIBCPP, so the include is attempted and the header
# is not there: "fatal error: map: No such file or directory" in every node
# TU, and the image never reaches the link. nano-ros's own std_detect.hpp
# names this exact misread (issue 0112: "`__STDC_HOSTED__` alone misreads
# Zephyr's `-fno-freestanding -nostdinc++` leaves") and routes every other
# header through `__has_include`; node.hpp's new line does not go through it.
# The island instantiates no `declare_parameters<T>(std::map)`, so nothing in
# the image needs the library -- only the header has to exist.
#
# Until upstream guards that include, the toolchain's libstdc++ headers go
# back on the include path the only way Zephyr offers: the full C++ library
# (REQUIRES_FULL_LIBCPP -> GLIBCXX_LIBCPP; picolibc already satisfies the
# full-libc requirement it selects). The cost is to be READ OFF THE REGION
# REPORT, not assumed: the link now pulls libstdc++ for whatever the four
# nodes and nros-cpp already reference, where minimal-libcpp linked nothing.
# `-fno-exceptions -fno-rtti` are unchanged. Remove this block and re-measure
# once upstream's include is guarded.
CONFIG_REQUIRES_FULL_LIBCPP=y

# =============================================================================
# WHAT IS STILL HAND-SET HERE, AND WHY EACH ONE IS
# =============================================================================
#
# phase-412 acceptance 3. Every NROS count this image could derive IS derived
# (see the unpin block above). What follows is the remainder, with the blocker
# rather than a shrug -- so the next person reads why a number is here instead
# of re-running the audit that produced this list.
#
#   CONFIG_MAIN_STACK_SIZE 16384
#       Needs FRAME ANALYSIS, not an entity inventory. phase-409 established
#       the method (objdump, summing every `sub`/`sub.w`/`subw sp` down a call
#       chain) and the numbers for one chain; nothing turns that into a knob.
#
#   CONFIG_NROS_ZEPHYR_HEAP_SIZE 94208
#       Runtime allocation. There is no static model, and the honest first step
#       is a high-water reporter rather than a derivation -- which now exists
#       (the rlsf arena reports used/peak/capacity). The exact procedure for
#       reading it, and the three ways the reading can be invalid, are written
#       out at the knob itself above. Still a GUESS until someone runs it.
#
#   CONFIG_NROS_GRAPH_CACHE_SIZE 4096
#       Sized by the PEER graph -- how many nodes the OTHER side of the link
#       runs. Not a property of this image, and not derivable from it. This is
#       the reason "derive everything" is the wrong goal: a contract states
#       what this image creates, and says nothing about who it talks to. So
#       this one stays stated, and it is a board fact in the sense below.
#
# The knob that WAS listed beside it and is not a peer count: MAX_LIVELINESS.
# This file used to pair it with GRAPH_CACHE_SIZE under "sized by the PEER
# graph ... probably never derivable". That was the pre-correction text of
# nano-ros phase-412's knob table. Row 192 of that table was corrected on
# 2026-09-08: liveliness tokens are declared by THIS image's own entities --
# one per session, node name, publisher, subscriber, service server, service
# client and parameter service -- not by remote peers, and it IS derivable.
# The Kconfig default has been -1 (= derive) since. The derivation here says
#
#     1 session + 4 names + 14 pubs + 11 subs + 2 servers + 2 clients
#       + 24 parameter services = 58
#
# and the stated 32 had been right at 29 tokens, then went 26 SHORT the day
# `params:` was declared, with nothing to say so: liveliness exhaustion is not
# a boot failure, the entity is simply missing from `ros2 node list`. So the
# line is deleted and the value derives (NROS_RESOLVED_NROS_MAX_LIVELINESS 58).
#
# THE RULE this file follows from here on: a board file states BOARD facts --
# memory, stacks, transports, the peer graph -- and never a count the contract
# determines. A stated knob WINS over the derivation, so the day the contract
# grows, a stated count does not fail; it drifts, silently.
#
# The parameter-service inbox is the same kind of count and is NOT stated
# here either. As of the 2026-09-25 pin it does not derive: with no line here
# the Kconfig default 0 reaches nros-node as a STATED zero and the const
# assert at nros-node/src/parameter_services.rs:1655 refuses the build
# ("NROS_PARAM_SERVICE_INBOX_BYTES is smaller than the largest parameter
# request ..."). That is nano-ros phase-467 W2, the sentinel; the fix belongs
# upstream, not in a hand-derived number in this file.
#
#   CONFIG_NROS_ZEPHYR_TASK_SLOTS 5
#   CONFIG_NROS_ZEPHYR_TASK_STACK_SIZE 8192
#       Transport tasks, not entities. Derivable in principle from the
#       transport's own declaration; nothing declares it today.
#
#   CONFIG_MAX_PTHREAD_MUTEX_COUNT 70, CONFIG_MAX_PTHREAD_COND_COUNT 48
#       Deliberately NOT derived -- see their own block above. The configure
#       FAILS with the number to write when the subscriber and queryable
#       counts outgrow them (nano-ros issue 1498 added the queryable term and
#       the cond pool), which is the check a derivation would have replaced
#       with a silent recomputation.
#
# The one knob that LEFT this list: NROS_EXECUTOR_ARENA_SIZE. phase-412's W2
# recorded it as blocked on QoS depth; `nros-node/build.rs` sums per kind when
# all five NROS_ENTITY_COUNT_* arrive, and they do. It derives 46272 here.
#
# phase6-W8b, 2026-09-25: nano-ros phase-467 W2 landed in the pin (issue
# 1485). The knob derives (-1) and the builtin inbox is sized from the
# declared parameter shapes; the hand-written 1016 that used to sit here
# is gone, and the build must produce the same 1016 without it.

# == phase7-W1 tracing (docs/tracing.md) =====================================
# Decided 2026-09-01, landed here by phase7-W1. Delete this block to build
# the image without tracing; nothing else depends on it (the components'
# ISLAND_TRACE markers compile to nothing without CONFIG_TRACING_CTF).
#
# SYNC + RAM, and why nothing else: TRACING_LOCK() is irq_lock() around the
# WHOLE backend write (subsys/tracing/include/tracing_core.h), so a
# synchronous event costs whatever the backend costs, with interrupts off.
#   UART (the default) is a byte-at-a-time uart_poll_out loop: at 115200 a
#     14-byte event is ~1.2 ms interrupts-off.
#   SEMIHOST traps (bkpt 0xab) and halts the core until a probe answers, and
#     faults when no probe is attached, so the image cannot run standalone.
#   ASYNC drops whole events into tracing_packet_drop_num, a counter nothing
#     in the tree reads: loss is invisible.
# RAM is a bounds check and a memcpy of the event (12 B for a marker).
# Its interrupts-off cost is estimated in docs/tracing.md and measured in
# phase7-W6; it is not assumed small.
CONFIG_TRACING=y
CONFIG_TRACING_CTF=y
CONFIG_TRACING_SYNC=y
CONFIG_TRACING_BACKEND_RAM=y
# One-shot, not a ring: `ram_tracing[]` fills from boot and latches full.
# 16 KiB of the 25,072 B of RAM the phase-6 image left spare; read it over
# SWD from the ELF symbol `ram_tracing` (`just trace-board`).
CONFIG_RAM_TRACING_BUFFER_SIZE=16384
# The CUT event set: application markers + thread switches. TRACING_THREAD
# is the only Kconfig carrying switched_in/out; on 4.4 it also brings the
# thread create/start/wakeup/sleep/yield/sched_lock events, which no Kconfig
# separates from the switches. Everything else is off, ISRs and idle
# included (both are gated on this line).
#
# OFF on the board since phase7-W7. With a serial peer the zenoh link wakes a
# thread once per received byte (pend/ready/switch out/in, about 180 B of
# trace per byte at 115200 baud), and the 16 KiB buffer filled 31 ms after
# boot, before the first heartbeat and before any node existed
# (experiments/serial-interop/w7/). Markers and heartbeats only, now.
CONFIG_TRACING_THREAD=n
CONFIG_TRACING_SYSCALL=n
CONFIG_TRACING_WORK=n
CONFIG_TRACING_ISR=n
CONFIG_TRACING_IDLE=n
CONFIG_TRACING_SEMAPHORE=n
CONFIG_TRACING_MUTEX=n
CONFIG_TRACING_CONDVAR=n
CONFIG_TRACING_QUEUE=n
CONFIG_TRACING_FIFO=n
CONFIG_TRACING_LIFO=n
CONFIG_TRACING_STACK=n
CONFIG_TRACING_MESSAGE_QUEUE=n
CONFIG_TRACING_MAILBOX=n
CONFIG_TRACING_PIPE=n
CONFIG_TRACING_HEAP=n
CONFIG_TRACING_MEMORY_SLAB=n
CONFIG_TRACING_TIMER=n
CONFIG_TRACING_EVENT=n
CONFIG_TRACING_POLLING=n
CONFIG_TRACING_PM=n
CONFIG_TRACING_NETWORKING=n
CONFIG_TRACING_GPIO=n
# == end phase7-W1 tracing ====================================================
