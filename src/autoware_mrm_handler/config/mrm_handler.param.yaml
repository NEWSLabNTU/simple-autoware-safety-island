# Default configuration for mrm handler
---
/**:
  ros__parameters:
    update_rate: 10
    timeout_operation_mode_availability: 0.5
    timeout_call_mrm_behavior: 0.01
    timeout_cancel_mrm_behavior: 0.01
    use_emergency_holding: false
    timeout_emergency_recovery: 5.0
    use_pull_over: false
    # true for the phase-8 demo (phase8-W7): the takeover request falls to
    # the comfortable stop, with the emergency stop as the floor. It is also
    # the source default.
    use_comfortable_stop: true
    # phase8-W7, a demo extension (not upstream): on availability.autonomous
    # == false while AUTONOMOUS, ask the driver to take over and wait this
    # long before the MRM. The contract's takeover_request window is bound to
    # it (`window-param`).
    use_takeover_request: true
    takeover_request_timeout: 10.0
    # phase8-W27, not upstream: the start-up budget, seconds from the node's
    # construction. Until every required input (the availability, the
    # operation mode state, and each operator status in use) is established
    # the handler is in INIT and publishes nothing; if that lasts longer than
    # this it raises an init failure and takes the emergency stop, as for a
    # lost availability stream, until the inputs are established.
    # phase8-W28, established: two consecutive samples at most
    # timeout_operation_mode_availability apart for the availability and the
    # operator statuses; one sample for the operation mode state (latched,
    # published on change).
    init_timeout: 3.0

    # setting whether to turn hazard lamp on for each situation
    turning_hazard_on:
      emergency: true
