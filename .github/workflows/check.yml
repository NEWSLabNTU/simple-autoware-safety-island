# phase8-W3: `play_launch check` on every contract in the repository, each
# against the verdict it is meant to give (.github/check-contracts.sh), in
# two lists: core (the island) and evaluation (phase14-P1.4).
# Builds nothing: `check` reads launch files and their contract sidecars.
# play_launch is installed the way the runbook installs it (pip), pinned to
# the version the demo host runs.
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    # ROS 2 Humble userland: the launch parser resolves $(find-pkg-share) and
    # friends through it, and the wheel is built for jammy (manylinux_2_35).
    container: ros:humble-ros-base-jammy
    env:
      PLAY_LAUNCH_VERSION: "0.20.2"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install play_launch ${{ env.PLAY_LAUNCH_VERSION }}
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends python3-pip >/dev/null
          # One PyPI package since 0.18.2 (play_launch phase 92): the wheel
          # carries every distribution its Python serves and picks Humble here.
          pip3 install --no-cache-dir "play_launch==${PLAY_LAUNCH_VERSION}"
          play_launch --version
      # Two lists (.github/check-contracts.sh, phase14-P1.4): the island's
      # own contracts (src/) and the evaluation's (demo/l3, docs/demo-l4,
      # docs/island-variants), which leave in phase 14 P2.
      - name: play_launch check, core contracts
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          CONTRACTS=core .github/check-contracts.sh
      - name: play_launch check, evaluation contracts (moves out in phase 14 P2)
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          CONTRACTS=evaluation .github/check-contracts.sh
      # phase8-W7: the timeline draws its declared bars from the checker's
      # `--explain` table and its stop curve from the same braking-profile
      # arithmetic. The board half's selftest parses a captured table
      # (tools/board/testdata/explain.txt) and checks every row's terms; the
      # evaluation half's (tools/eval, phase 14: leaves with the evaluation in
      # P2) recomputes every settle and checks merge and the run summary.
      - name: board tools read the checker's table
        shell: bash
        run: |
          python3 -m py_compile tools/board/*.py
          python3 tools/board/tlcommon.py selftest
      - name: evaluation tools (tools/eval; moves out in phase 14 P2)
        shell: bash
        run: |
          python3 -m py_compile tools/eval/*.py
          for s in tools/eval/*.sh; do bash -n "$s"; done
          python3 tools/eval/selftest.py
