# phase8-W3: `play_launch check` on every contract in the repository, each
# against the verdict it is meant to give (.github/check-contracts.sh). The
# evaluation's contracts are checked by NEWSLabNTU/rtss-work-2026-demo.
# Builds nothing: `check` reads launch files and their contract sidecars.
# play_launch is installed the way the runbook installs it (pip), pinned to
# the version the demo host runs.
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-22.04
    # 5 minutes before island #16; the msg pkgs' colcon build is most of the
    # rest.
    timeout-minutes: 15
    # ROS 2 Humble userland: the launch parser resolves $(find-pkg-share) and
    # friends through it, and the wheel is built for jammy (manylinux_2_35).
    container: ros:humble-ros-base-jammy
    env:
      PLAY_LAUNCH_VERSION: "0.33.1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install play_launch ${{ env.PLAY_LAUNCH_VERSION }}
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends python3-pip >/dev/null
          # One PyPI package since 0.18.2 (play_launch phase 92): the wheel
          # carries every distribution its Python serves and picks Humble here.
          pip3 install --no-cache-dir "play_launch==${PLAY_LAUNCH_VERSION}"
          play_launch --version
      # island #16: safety_island_msgs and the vendored Autoware subsets,
      # built as a ROS 2 overlay. It proves they build under rosidl, and it
      # puts their .msg files on the ament index, where the check below
      # resolves every contract field (it fails a field it cannot resolve).
      - name: build the island's message packages (colcon)
        shell: bash
        run: |
          command -v colcon >/dev/null || apt-get install -y -qq --no-install-recommends python3-colcon-common-extensions >/dev/null
          source /opt/ros/humble/setup.bash
          scripts/build-host-msgs.sh build/msgs_ws
      - name: play_launch check, the island's contracts
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source build/msgs_ws/install/setup.bash
          .github/check-contracts.sh
      # phase8-W7: the timeline draws its declared bars from the checker's
      # `--explain` table and its stop curve from the same braking-profile
      # arithmetic. The board half's selftest parses a captured table
      # (tools/board/testdata/explain.txt) and checks every row's terms. The
      # evaluation half (rtss-work-2026-demo, tools/eval) runs it again in
      # that repo's CI before its own.
      - name: board tools read the checker's table
        shell: bash
        run: |
          python3 -m py_compile tools/board/*.py
          python3 tools/board/tlcommon.py selftest
      # phase15-S3: the supervisor's standstill verdicts (routes 2 and 3) on
      # the host, and its SWD record decoder against the record's layout.
      - name: supervisor verdicts and record layout
        shell: bash
        run: |
          command -v cc >/dev/null || { apt-get install -y -qq --no-install-recommends gcc libc6-dev >/dev/null; }
          mkdir -p build/tests
          cc -std=c11 -Wall -Wextra -Werror -o build/tests/supervisor_judge tests/supervisor/test_judge.c
          build/tests/supervisor_judge
          python3 tools/board/violations.py selftest
          # island #14: the spin diag's per-level lateness (recorder on the
          # host, its decoder against the blob it writes).
          cc -std=c11 -Wall -Wextra -Werror -Itests/spin_diag -o build/tests/spin_diag tests/spin_diag/test_spin_diag.c
          build/tests/spin_diag build/tests/spin_diag.bin
          python3 tools/board/spin_diag.py selftest build/tests/spin_diag.bin
