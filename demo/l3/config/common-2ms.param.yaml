# autoware_launch 1.5.0's config/planning/scenario_planning/common/
# common.param.yaml with max_vel set to 2.0 m/s (7.2 km/h), for phase11-S6's
# speed sweep of the settle (decision 5: the settle is judged as one sum at
# the entry speed bound, so every speed below it must fit settle + response
# at 8.33 m/s). Everything else is the stock file. Mounted read-only into the
# Autoware container (L3_PLANNING_COMMON, demo/l3/container/run.sh).
/**:
  ros__parameters:
    max_vel: 2.0            # max velocity limit [m/s]

    # constraints param for normal driving
    normal:
      min_acc: -1.0         # min deceleration [m/ss]
      max_acc: 1.0          # max acceleration [m/ss]
      min_jerk: -1.0        # min jerk [m/sss]
      max_jerk: 1.0         # max jerk [m/sss]

    # constraints to be observed
    limit:
      min_acc: -2.5         # min deceleration limit [m/ss]
      max_acc: 1.0          # max acceleration limit [m/ss]
      min_jerk: -1.5        # min jerk limit [m/sss]
      max_jerk: 1.5         # max jerk limit [m/sss]
