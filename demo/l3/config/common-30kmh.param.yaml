# autoware_launch 1.5.0's config/planning/scenario_planning/common/
# common.param.yaml with max_vel raised from 4.17 m/s to 8.3 m/s, just under
# the island contract's entry_speed (8.33 m/s, the 30 km/h ODD bound) and the
# sample map's 30 km/h lanelet limit. Everything else is the stock file.
# Used per run, mounted read-only into the Autoware container
# (L3_PLANNING_COMMON, demo/l3/container/run.sh); phase10-B6.
/**:
  ros__parameters:
    max_vel: 8.3            # max velocity limit [m/s]

    # constraints param for normal driving
    normal:
      min_acc: -1.0         # min deceleration [m/ss]
      max_acc: 1.0          # max acceleration [m/ss]
      min_jerk: -1.0        # min jerk [m/sss]
      max_jerk: 1.0         # max jerk [m/sss]

    # constraints to be observed
    limit:
      min_acc: -2.5         # min deceleration limit [m/ss]
      max_acc: 1.0          # max acceleration limit [m/ss]
      min_jerk: -1.5        # min jerk limit [m/sss]
      max_jerk: 1.5         # max jerk limit [m/sss]
