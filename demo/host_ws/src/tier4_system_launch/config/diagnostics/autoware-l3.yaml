# phase9-C8: the L3 demo's diagnostic graph. The stock
# autoware_launch/config/system/diagnostics/autoware-main.yaml, with
# localization.yaml, planning.yaml and control.yaml taken from this directory
# (copies of the stock files with a `timeout` on their 1 Hz diag units) and
# the other files from autoware_launch as they are. The one change in this
# file: /adapi/mrm_request/delegate gets `timeout: 1.5`.
#
# Why: a diag unit without `timeout` goes STALE 1.0 s after its last
# sample (levels.cpp, TimeoutLevel, `timeout_duration_ <= duration`, checked
# on the aggregator's 10 Hz timer). The units below are published by a
# diagnostic_updater at its default 1.0 s period (measured 1000.00 ms,
# about half the gaps at or just over 1000.0 ms, max 1008.6 ms, c8-b2), so
# whenever the aggregator's tick falls a few ms after a sample's 1.0 s
# anniversary and before the next sample, the unit reads STALE for one tick
# and every mode above it (autonomous, comfortable_stop) is withdrawn for
# one sample. Whether a run hits it depends only on the tick's phase against
# the 1 Hz samples, fixed at start: u6-b2 hit it eight times, all at the
# same phase. 1.5 s keeps a missed sample a fault (2.0 s gap) and lets a
# late one through.
files:
  - { path: $(dirname)/control.yaml }
  - { path: $(dirname)/localization.yaml }
  - { path: $(find-pkg-share autoware_launch)/config/system/diagnostics/map.yaml }
  - { path: $(find-pkg-share autoware_launch)/config/system/diagnostics/perception.yaml }
  - { path: $(dirname)/planning.yaml }
  - { path: $(find-pkg-share autoware_launch)/config/system/diagnostics/system.yaml }
  - { path: $(find-pkg-share autoware_launch)/config/system/diagnostics/vehicle.yaml }

units:
  - path: /autoware/modes/local
    type: and
    list:
      - { type: link, link: /autoware/vehicle }
      - { type: link, link: /autoware/system }
      - { type: link, link: /autoware/control/local }
      - { type: link, link: /adapi/mrm_request/delegate }

  - path: /autoware/modes/remote
    type: and
    list:
      - { type: link, link: /autoware/vehicle }
      - { type: link, link: /autoware/system }
      - { type: link, link: /autoware/control/remote }
      - { type: link, link: /adapi/mrm_request/delegate }

  - path: /autoware/modes/stop
    type: and
    list:
      - { type: link, link: /adapi/mrm_request/delegate }

  - path: /autoware/modes/autonomous
    type: and
    list:
      - { type: link, link: /autoware/map }
      - { type: link, link: /autoware/localization }
      - { type: link, link: /autoware/planning }
      - { type: link, link: /autoware/perception }
      - { type: link, link: /autoware/control }
      - { type: link, link: /autoware/vehicle }
      - { type: link, link: /autoware/system }
      - { type: link, link: /adapi/mrm_request/delegate }

  - path: /autoware/modes/pull_over
    type: and
    list:
      - { type: link, link: /autoware/map }
      - { type: link, link: /autoware/localization }
      - { type: link, link: /autoware/planning }
      - { type: link, link: /autoware/perception }
      - { type: link, link: /autoware/control }
      - { type: link, link: /autoware/vehicle }
      - { type: link, link: /autoware/system }

  - path: /autoware/modes/comfortable_stop
    type: and
    list:
      - { type: link, link: /autoware/map }
      - { type: link, link: /autoware/localization }
      - { type: link, link: /autoware/planning }
      - { type: link, link: /autoware/perception }
      - { type: link, link: /autoware/control }
      - { type: link, link: /autoware/vehicle }
      - { type: link, link: /autoware/system }

  - path: /autoware/modes/emergency_stop
    type: and
    list:
      - { type: link, link: /autoware/vehicle }
      - { type: link, link: /autoware/system }

  - path: /autoware/debug/tools
    type: and
    list:
      - { type: link, link: /autoware/system/service_log_checker }

  - path: /adapi/mrm_request/delegate
    type: diag
    node: /adapi/node/mrm_request
    name: delegate
    timeout: 1.5
