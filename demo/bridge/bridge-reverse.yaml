# AUTO-SPLIT from bridge-config.yaml — the demo faults ONLY the forward
# (heartbeat) leg, so the island's 2->1 commands keep flowing and the stop is
# attributable to the ISLAND, not to sim-side staleness reactions.
name: si_bridge_reverse
topics:
  # /system/emergency/control_cmd DROPPED until nano-ros #267: the island's
  # Control corrupts through the serialized rebroadcast (observed 2.6e9 accel
  # -> the sim gate accelerated to the 50 m/s cap). MrmState/gear/hazards
  # cross clean; the sim-side stop is the gate's staleness reaction.
  /system/emergency/gear_cmd:
    type: autoware_vehicle_msgs/msg/GearCommand
    from_domain: 2
    to_domain: 1
  /system/emergency/turn_indicators_cmd:
    type: autoware_vehicle_msgs/msg/TurnIndicatorsCommand
    from_domain: 2
    to_domain: 1
  /system/emergency/hazard_lights_cmd:
    type: autoware_vehicle_msgs/msg/HazardLightsCommand
    from_domain: 2
    to_domain: 1
  /system/fail_safe/mrm_state:
    type: autoware_adapi_v1_msgs/msg/MrmState
    from_domain: 2
    to_domain: 1
  # velocity-limit rows: live again under the HOST Autoware 1.5.0 env
  # (phase-2) — the containerized 20250207 image lacks the renamed
  # typesupport (keep dropped there).
  /planning/scenario_planning/max_velocity_candidates:
    type: autoware_internal_planning_msgs/msg/VelocityLimit
    from_domain: 2
    to_domain: 1
  /planning/scenario_planning/clear_velocity_limit:
    type: autoware_internal_planning_msgs/msg/VelocityLimitClearCommand
    from_domain: 2
    to_domain: 1
