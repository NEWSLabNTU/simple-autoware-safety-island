# P5 co-sim demo — Autoware planning_simulator (domain 1) + domain_bridge
# (1↔2) + the island on the HOST (domain 2: `just run` native, or
# `just zephyr-run`). Shape lifted from the ASI fork's proven demo/.
#
#   just demo-up
#   just run                      # island (host, domain 2)
#   just demo-kill-heartbeat
#
# Stock MRM nodes are disabled by mounting the patched system.launch.xml
# over tier4_system_launch's (autoware-overrides/) — the island is the only
# MRM path.
services:
  autoware:
    image: ghcr.io/autowarefoundation/autoware:universe-20250207
    network_mode: host
    ipc: host
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=1
      - CYCLONEDDS_URI=file:///autoware/cyclonedds.xml
    volumes:
      - ./map/sample-map-planning:/root/autoware_map:ro
      - ./cyclonedds.xml:/autoware/cyclonedds.xml:ro
      - ./autoware-overrides/system.launch.xml:/opt/autoware/share/tier4_system_launch/launch/system.launch.xml:ro
    command: ["bash", "-c", "source /opt/ros/humble/setup.bash && source /opt/autoware/setup.bash && ros2 launch autoware_launch planning_simulator.launch.xml map_path:=/root/autoware_map vehicle_model:=sample_vehicle sensor_model:=sample_sensor_kit rviz:=false"]

  bridge:
    build:
      context: bridge-image
      args:
        ROS_DISTRO: humble
    network_mode: host
    ipc: host
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///autoware/cyclonedds.xml
      - ROS_DISTRO=humble
    volumes:
      - ./cyclonedds.xml:/autoware/cyclonedds.xml:ro
      - ./bridge/bridge-config.yaml:/autoware/bridge-config.yaml:ro
