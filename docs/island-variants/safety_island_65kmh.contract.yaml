# VARIANT of src/safety_island_bringup/launch/safety_island.contract.yaml
# (phase10-B5): the ODD entry speed is 65 km/h (18.06 m/s), one line below
# (`entry_speed:`); the parameters are the island's own. Expected: `play_launch
# check` rejects it with ladder-rung-budget on the comfortable-stop rung only
# (exit 1). Kept in step with the island contract by hand: regenerate with
# one sed from it.

# Node interface contract for safety_island.launch.xml.
#
# WHY THIS FILE EXISTS
#
# A ROS 2 launch file names nodes, namespaces, parameters and remaps. It cannot
# say that a node creates seven subscriptions -- that is a property of the
# node's code, and `<remap>` only renames a topic the node already has. So the
# launch tree alone cannot size the image's pools.
#
# play_launch's contract channel is where that belongs. It is read through the
# PROVIDER SIDECAR channel -- `<stem>.contract.yaml` beside `<stem>.launch.xml`,
# on by default -- and folded into the SystemModel, whose `structure.topics`
# is what `nros_orchestration_ir::executor_sizing::count_callbacks` counts.
#
# THE CONTRACT ALONE IS ENOUGH. A `<stem>.system.<target>.yaml` scheduling
# platform file sat beside this one for a while, on the belief that the channel
# only opened when a platform file was present for the target. That was wrong,
# and it was measured wrong: resolving with and without it produced BYTE-
# IDENTICAL models. The symptom that produced the belief ("4 nodes, 0 topics")
# had a different cause -- this file had no `topics:` section at all -- and the
# platform file arrived at the same time as the fix. It is deleted.
#
# It replaces the `ENTITIES` lists duplicated across the four components'
# CMakeLists.txt. Those were hand-maintained with nothing comparing them to the
# code, and on 2026-09-04 that cost several days: mrm_handler declared six
# subscriptions and creates seven, so every pool derived from the list was short
# by one and the eleventh subscription failed at boot with an opaque transport
# error.
#
# THE TWO SECTIONS DO DIFFERENT JOBS
#
# `nodes:` names each node's endpoints and their rates. The keys are LOCAL
# endpoint names, not topic paths -- an absolute path here is concatenated onto
# the node FQN and produces a malformed `/node//abs/path` endpoint that matches
# no topic.
#
# `topics:` is the wiring: absolute topic name -> message type plus the endpoint
# refs on each side. `external: pub` means the publisher lives outside this
# image (the vehicle, Autoware proper); `external: sub` means the consumer does.
# Only two topics here are internal to the island, both MRM status reports.
#
# Rates are each node's own `update_rate` parameter -- 10 Hz for
# mrm_comfortable_stop_operator and mrm_handler, 30 Hz for
# mrm_emergency_stop_operator -- not numbers invented to satisfy the mapper.
#
# WHAT THE IMAGE LEAVES OUT (phase8-W8a). The island is sized for the RTSS@Work
# demo, not as a complete safety island: every endpoint below has a reader in
# the demo or a place in a hazard's walk. Out, with the reader checked in the
# Autoware 1.5.0 source first (docs/roadmap/phase-8-rtss-work-demo.md, W8a):
#   stop_mode_operator, whole (decision D4): launched in 1.5.0 only with the
#     control-command gate; the demo runs vehicle_cmd_gate; nothing reads
#     /system/stop_mode/*; its three 30 Hz inputs crossed the link for nothing.
#   mrm_handler /system/emergency/gear_cmd and its /control/command/gear_cmd
#     pass-through input, /system/emergency/turn_indicators_cmd: read only by
#     vehicle_cmd_gate, and only while mrm_state says EMERGENCY_STOP; with no
#     sample the gate holds the gear and indicator it last sent
#     (getContinuousTopic), which is DRIVE and the planner's indicator, the
#     same values the island sent (use_parking_after_stopped: false).
#   mrm_handler /system/fail_safe/emergency_holding: read only by the host's
#     hazard_status_converter (demo/host_ws remap, gap G10), which reads a
#     missing sample as false, the only value the island could send with
#     use_emergency_holding: false.
# Kept although the simulator never shows it: /system/emergency/hazard_lights_cmd,
# read by the demo's hazard_relay (branch B), by vehicle_cmd_gate in the
# encore, and by the timeline probe.
#
# TIMERS ARE HERE, under each node's `paths:`. This file once said they could
# not be expressed and that `ENTITIES` had to survive to carry them. That was
# wrong. A node path is a `take -> publish` causal path, and a path whose
# trigger is `{ timer: { rate_hz: N } }` resolves into the model as a
# `contracts.node_paths` entry with an EMPTY `input` -- which the model's own
# definition of that field calls "periodic (timer-driven)". Each node here runs
# exactly one, and its `output` is what that tick actually publishes, read from
# the callback body rather than assumed to be every publisher the node has.
#
# SERVICES ARE HERE TOO, since 2026-09-06. They were omitted on the grounds
# that "nothing is claimed about them", which sounded conservative and was not:
# the image creates two service SERVERS, and a contract that omits them makes
# the derivation predict MAX_QUERYABLES 1 for an image that needs at least two.
# An omission is not neutral when something downstream sizes a pool from it.
#
# What settled it was the running board. With a router attached, the liveliness
# tokens it declares are the image describing itself:
#
#   SS mrm_comfortable_stop_operator /system/mrm/comfortable_stop/operate
#   SS mrm_emergency_stop_operator   /system/mrm/emergency_stop/operate
#   SC mrm_handler                   /system/mrm/comfortable_stop/operate
#   SC mrm_handler                   /system/mrm/emergency_stop/operate
#
# Both pairs are INTERNAL -- server and client are both on this board -- so
# neither needs the `external:` mark that a split pair does.

# PARAMETERS ARE DECLARED HERE, name and type, one entry per
# `declare_parameter<T>` call in the node's code (phase 446 in nano-ros). The
# sizes of the image's parameter store follow from this list: 24 parameters
# (21 until phase8-W7 added mrm_handler's two takeover parameters, 23 until
# phase8-W27 added `init_timeout`) plus one `use_sim_time` per node gives 28
# slots, and since every one is a scalar the
# string and array capacities are zero. Values stay in each package's
# `config/*.param.yaml`, loaded by the launch file. Capacities for a string or
# array parameter would be a board fact, never stated here.

version: 1

# ---------------------------------------------------------------------------
# WHAT HAPPENS WHEN THE INPUT STOPS, AND WHEN IT SAYS "NOT HERE"
#
# Everything above this line is structure and rate: how many endpoints, how
# fast each one runs, how big the pools have to be. None of it says what the
# island is FOR. The island is a minimum-risk-manoeuvre controller. It exists
# because /system/operation_mode/availability can stop arriving, and when it
# does the vehicle has to be brought to a stop before the absence of that
# stream becomes a hazardous event. Since phase 8 it exists for a second
# reason on the same stream: the stream can keep arriving and say that the
# vehicle has left the domain it may drive itself in, and then the driver has
# to be asked to take over, and the vehicle stopped if nobody does.
#
# ISO 26262 gives both sentences a number. The fault-tolerant time interval is
# the time from the fault to the hazardous event when nothing reacts, and it
# has to cover detection plus reaction:
#
#   FTTI >= FDTI (fault -> detected) + FRTI (detected -> safe state reached)
#
# FDTI and FRTI are NOT authored here. They are derived from numbers this
# repository already ships in its own parameter files. `ftti` and
# `entry_speed` are the genuinely new requirements, because they come from
# physics and a hazard analysis rather than from code.
#
# THE TWO HAZARDS (phase8-W7, from the phase-8 demo contract of W6,
# demo/l3/contracts/l3_takeover.contract.yaml, and the user's decisions in
# docs/roadmap/phase-8-rtss-work-demo.md section 7)
#
#   hpc_loss   the HPC stops: the availability stream goes SILENT. ASIL_D,
#              10 s. This is the hazard this file called
#              `operation_mode_unavailable` with a 3 s interval until
#              phase8-W7; the guard, the detector and the reaction are the
#              same, the name says which fault it is now that there are two,
#              and the interval moved for the reason under "WHY THE
#              INTERVALS" below.
#   odd_exit   the vehicle leaves its operating domain (ODD): the stream keeps
#              arriving with `autonomous: false`. A VALUE fault, ASIL_B, 30 s.
#
# One ladder serves both (`modes:` below):
#
#   l3_engaged -> takeover_request (10 s window; the driver's MANUAL ends it)
#              -> comfortable_stop (the HPC's planner brakes, in lane)
#              -> emergency_stop   (the island brakes, the floor)
#
# odd_exit removes only `hpc_in_odd`, so it lands on the takeover request,
# waits the window out and takes the comfortable stop. hpc_loss removes both
# functions (silence also means "not known to be in the domain"), so the
# checker skips the two rungs that need the HPC and charges neither: the floor
# is reached straight away, which is what mrm_handler does (an availability
# timeout forces EMERGENCY_STOP at any rung, getCurrentMrmBehavior()).
#
# WHERE EACH NUMBER COMES FROM
#
#   FDTI, hpc_loss = 500 ms.
#     mrm_handler's `timeout_operation_mode_availability: 0.5`, in
#     src/autoware_mrm_handler/config/mrm_handler.param.yaml. That parameter
#     IS the detector: the handler treats the availability stream as lost
#     once it has been silent for half a second. It is restated below as
#     `max_age: 500ms` with `mechanism: application` on the subscriber: a
#     staleness bound the handler checks on its own tick, which is what the
#     code does. It is not a DDS lease (no `liveliness`/`lease_duration` on
#     either side since phase9-W6; see the subscriber). Note what does NOT count: the
#     `min_rate_hz: 10` already declared on that subscriber is a requirement,
#     not a mechanism -- nothing fires when a period passes -- so the 10 Hz
#     floor buys no detection on its own.
#
#   FDTI, odd_exit = 100 ms.
#     A reported fault is detected by whoever publishes the verdict: the
#     demo's availability gate on the HPC, which republishes Autoware's
#     availability with the ODD folded into `autonomous`. It is outside this
#     image, named on the guard topic below by its absolute FQN, so the
#     checker charges its 10 Hz period and none of its own latency (the demo
#     composition declares its 20 ms path and 6 ms timer jitter, and reads
#     126 ms). The value is read
#     on the handler's next tick, which is the first term of the route below.
#
#   reaction route = link 56 + call_mrm 149 = 205 ms ON THE BOARD (phase9-C7;
#     230 with link 81 from phase9-W5, 206 as one number from phase8-W30 to
#     W5, 110 before W30). Two keys:
#     the serial hop in is `max_transport: 56ms` on the guard subscriber,
#     which play_launch 0.14.0 charges once on the reaction route (its F1)
#     and not after the window's deadline; `call_mrm` holds the two
#     on-island terms, tick 118 + work 31. W30's story: `update_rate: 10` gives a
#     100 ms tick and `timeout_call_mrm_behavior: 0.01` gave 10 ms to get the
#     behaviour called. That was set on native_sim, where a callback takes
#     zero time and the link is the host's loopback. The island is an
#     S32K344 behind a gateway and a 921,600-baud UART, and there the hop
#     has three costs, each measured on board runs and sized as the
#     observed maximum plus 20 %, rounded up to the next ms (the 100 ms
#     period is the parameter and takes no margin):
#       link 56 = the serial hop in, max 46.42 ms over the 12 edges of the
#         phase9-C7 round on the current image (81 from phase8-W31's 67.02
#         on the pre-I14 image, from phase9-W5 to C7; 57 from W8 before);
#       tick 118 = the period 100 + jitter 18 (ticks up to 114.84 ms apart
#         on the W8 image; kept at C7, see `call_mrm` below);
#       work 31 = the tick's start to the reaction's last publish, max 25.04
#         (W8; kept at C7).
#     118 + 31 = 149 in `call_mrm`, 56 on the subscriber: 205. The
#     derivation, term by term, with the runs, is at `call_mrm` below. The handler notices the stale stamp, or the
#     cleared `autonomous`, on a tick, so the tick is genuinely a term and
#     not a padding allowance. The emergency operator adds its 30 Hz tick as
#     a sampling hop across the operate service (33.33 ms, play_launch phase
#     82); the comfortable operator publishes its velocity limit inside the
#     operate callback, served right after the handler's tick returns
#     (inside the work term).
#
#   window = 10 s.
#     Decision 3 of the phase-8 doc (Drive Pilot's figure), bound to
#     mrm_handler's `takeover_request_timeout: 10.0` in its parameter file;
#     `window-param` refuses the file if the two ever differ.
#     WHAT IT MEANS (phase8-W12, rlm v0.1.47): a LEAST time. The driver is
#     guaranteed the whole 10 s: the request is never withdrawn, and no MRM
#     starts, before 10 s after it went on (the handler compares against the
#     stamp it took when the request went on, `now - stamp < timeout`, on
#     one clock). How LATE the MRM may start is not a second number: the
#     checker charges the window up to its deadline (request on + 10 s) and
#     the rung below its own route from there, and that route's first hop is
#     this handler's `call_mrm`, 149 ms on the board (above; 206 from
#     phase8-W30 to phase9-W5, 110 until W30). `window-expiry` (play_launch
#     phase 84) checks that the hop holds the tick of the timer that
#     publishes the request (`on_timer`, 10 Hz, released up to `jitter:
#     18ms` late), so the request ends within 10 000 to 10 149 ms of going
#     on and the late notice is charged exactly once. After the deadline no
#     message crosses the link (the handler reads its own clock): since
#     play_launch 0.14.0 the link is charged on the guard edge only, which
#     is why it left `call_mrm` (docs/takeover-trace.md section 10, F1,
#     done). The W7 runs cut
#     at the request-off edge instead of the deadline and so counted the
#     tick twice (docs/takeover-trace.md, finding 1 and section 6).
#
#   entry_speed = 8.33 m/s.
#     30 km/h, decision 2: the ODD speed bound. One YAML anchor, read by both
#     hazards: whichever fault occurs, the vehicle is at most here.
#
#   settle = the profile, DERIVED, + the vehicle's response, MEASURED.
#     `settle-derived` prints the profile's arithmetic from each operator's
#     own parameter file and the entry speed, and adds the written
#     `response` (phase10-B2):
#       emergency: target_acceleration -2.5, target_jerk -1.5 -> 4165.33 ms
#                  + response 319 ms                           = 4484.33 ms
#       comfortable: min_acceleration -1.0, min_jerk -0.3     -> 9996.67 ms
#                  + response 943 ms                           = 10939.67 ms
#     With a = |decel|, j = |jerk|: v_r = a^2/(2j); t = a/j + (v0 - v_r)/a
#     above v_r, sqrt(2 v0 / j) below it.
#
#     The response is what the profile does not cover: the vehicle stopped
#     later than the braking profile allows at the speed it actually had.
#     phase10-B6 measured it on the board at the declared entry speed
#     (8.30 m/s entry; island main 26558d4, runs b6-e1..3 and b6-b1..3) as
#     the observed settle minus the profile at the observed speed:
#     emergency stop 203.93 / 213.11 / 204.20 ms, comfortable stop 587.45 /
#     612.81 / 785.43 ms. The comfortable row starts at the velocity limit,
#     so its response includes the planner's hop to the first deceleration
#     (809-862 ms in those runs). Each is sized by the measurement rule:
#     785.43 x 1.2 = 942.52 -> 943. The emergency response was re-measured
#     on the image whose direct-path publishers are express (phase11 S6,
#     image 2b8a7985, island main 5aa6226's clock alignment): 16 stops from
#     8.30 m/s, 7 direct (the HPC loss at ~63 m along the straight: 181.15-
#     199.46 ms) and 9 escalations from an inert comfortable stop
#     (~251 m along it: 240.27-265.34 ms; runs s6-e8-c/d, s6-g8e1..5,
#     s6-in3..6, s6-g8i1..5). The command ramps are the same on both paths;
#     the escalations brake where the map falls, and the simulator's road
#     slope takes ~0.04 m/s2 of the 2.5. 265.34 x 1.2 = 318.41 -> 319. The runs
#     at the declared entry speed are the ones that size it, because that is
#     the speed the budget is computed at: lower-speed runs showed larger
#     lags (up to 1797 ms, the gate image's fr-b runs at about 3 m/s) on much
#     shorter settles, and their observed settles stay inside the budget.
#
#     This replaces the literal 2034 ms this file carried until phase8-W7,
#     derived by hand from an ASSUMED 3.0 m/s. MEASURED, phase7-W3
#     (docs/reaction-trace.md, native_sim, 4 runs with a velocity log): the
#     island met its own terms (last sample to first braking command at most
#     608 ms against 643.33), but the demo braked from 4.21-4.23 m/s, the same
#     formula at that speed gives 2517-2527 ms, and the vehicle missed the old
#     3 s interval in every run. The assumed input was the one that was wrong;
#     it is now the ODD bound, stated once, and the settle follows it.
#
# WHERE EACH BUDGET SAYS IT COMES FROM (phase10-B7)
#
# Every budget below is written in its map form, `{ duration, source }`, and
# the source is one of four. `requirement`: chosen (the intervals, the
# window, the detector's timeout, the 210 ms scope bound). `derived`:
# computed from other numbers here (the handler's 100 ms tick budget is its
# period; `within` is `call_mrm`; island.tor's 218 is 100 + 100 + 18).
# `measured`: an observed maximum plus 20 %, rounded up to the next ms,
# with the maximum, the sample count and the margin stated, so
# `budget-rule` reproduces the number (a timer's 100 ms period takes no
# margin: tick = period + lateness x 1.2). `analysed`: none yet. A measured
# budget is NOT an upper bound -- the serial hop was set to 57 ms from a
# 47.43 ms maximum and later reached 67.02 ms on a rebuilt image -- and
# `--explain` marks every total that contains one "measured, not a bound";
# today that is every hazard's total. `--explain` also lists, per budget,
# what checks it; `control_mode`'s 143 ms link is checked by nothing in the
# checker (the driver's answer is bounded by the window on the host) and is
# compared with its observations by the post-run trace check
# (tools/timeline, phase10-B8).
#
# EACH TIMER NAMES ITS PARAMETER (phase10-B1)
#
# `trigger: { timer: { rate_hz, param: update_rate } }` on every timer, and
# `max_age: { duration: 500ms, param: timeout_operation_mode_availability }`
# on the detector: `timer-param` and `max-age-param` resolve the parameter
# from the launch file's parameter files and refuse the file when the two
# disagree, as `window-param` does for the window. A rate typed here and
# not in the parameter file used to check clean.
#
# WHY THE INTERVALS ARE 10 s AND 30 s
#
# They are the numbers here that are judgements rather than readings. What
# matters is that they are written down and checked. The old 3 s cannot be
# met at the decided bound by any island: from 8.33 m/s the emergency stop
# alone takes 4165.33 ms to standstill; 3 s was chosen for the 3.0 m/s the
# old settle assumed. 10 s (brief D's figure) leaves the floor 4771.33 ms of
# slack with the board's 56 ms link, 149 ms handler hop and the vehicle's
# 319 ms response (phase11 S6; 4834.33 with phase10-B2's 256;
# 5090.33 without the response from phase9-C7;
# 5065.33 with the 81 ms link from phase9-W5; 5095.33
# with the 206 ms hop of phase8-W30, 5191.33 before it). odd_exit's 30 s is
# decision 3, a stated judgement like the old 3 s: the takeover window is 10 s
# of it, and the comfortable stop at the bound fits the rest with 8606.33 ms
# to spare with its 943 ms response (9549.33 without it; the demo composition, with its 10 Hz gate's 20 ms path and the
# 300 ms planner placeholder, reads 9223.33; 9198.33 with the 81 ms link
# and play_launch 0.16.0's 6 ms gate jitter; 9491.33 and 9171.33 with the
# 206 ms hop, 9683.33 and 9363.33 before phase8-W30).
# `play_launch check --explain` prints every term; docs/takeover-trace.md
# sets the observed runs against them.
#
# THE PLANNER HOP IS NOT IN THIS FILE
#
# The comfortable stop is executed by the HPC's planner: the operator
# publishes a velocity limit and Autoware's velocity smoother, planner and
# trajectory follower turn it into braking. This file describes the island
# image, so the comfortable rung's reaction ends at the island's own output,
# /planning/scenario_planning/max_velocity_candidates, and the planner's
# share is not charged here. The phase-8 demo contract
# (demo/l3/contracts/l3_takeover.contract.yaml) states it as a 300 ms
# PLACEHOLDER stand-in node; docs/takeover-trace.md reports the hop as
# observed, with no declared number beside it.
#
# WHERE THE CHAIN OUTRAN THE CHECKER (history: fixed by play_launch phase 82,
# and the hazard below now routes through the operator, phase6-W8a)
#
# The island's real reaction crosses a SERVICE. mrm_handler calls
# /system/mrm/emergency_stop/operate, and it is mrm_emergency_stop_operator
# that publishes /system/emergency/control_cmd. The reaction walk once
# followed TOPIC edges only, so a reaction declared as ending at
# /system/emergency/control_cmd came back unreachable, and the declared
# reaction ended at /system/fail_safe/mrm_state with the operator's share
# carried in the settle. Since phase 82 the walk crosses the service edge and
# charges the operator's tick as a sampling hop, and since phase 83 it also
# carries a settle declared upstream of the sink (the comfortable operator's
# velocity limit).
#
# THE LADDER, AND WHY IT IS HERE NOW
#
# The graded ladder -- comfortable stop first, emergency stop as the floor --
# is Autoware's shape, and the island ships both operators. Until phase8-W7
# it was not the island's CONFIGURED ladder: mrm_handler.param.yaml set
# `use_comfortable_stop: false`, and a graded reaction the parameters disable
# would have been a promise the image does not keep, so this file declared
# one rung. The demo turns it on (`use_comfortable_stop: true`, which is also
# the source default), so the rung is here and `ladder-rung-budget` checks it
# in its own right, as this paragraph used to say it would. `use_pull_over`
# stays false: there is no pull-over operator on the island.
#
# THE TAKEOVER REQUEST IS A DEMO EXTENSION, NOT UPSTREAM
#
# Autoware 1.5.0 has no takeover-request concept. mrm_handler gains one
# (brief D section 1.5; ~40 lines, docs/porting-notes): on the value fault
# while the vehicle is AUTONOMOUS it enters the request, publishes
# /system/takeover_request/state (tier4_system_msgs/MrmBehaviorStatus
# reused: AVAILABLE = idle, OPERATING = request on, NOT_AVAILABLE = the
# feature is off; no new message package on the island), and waits
# `takeover_request_timeout`. The driver's MANUAL on
# /vehicle/status/control_mode ends it (the `exit:`); expiry calls the MRM
# the existing selection picks; an availability timeout skips the wait.
#
# WHAT THE CHECKER STILL COMPLAINS ABOUT, AND WHY IT IS LEFT ALONE
#
# Diagnostics survive this block on purpose. None is an error and all are
# true.
#
#   warning[reaction-unguarded], once per hazard: each reaction ends at an
#     `external: sub` topic and nothing subscribes to it with an
#     `on_violation`. Not fixable from inside the island: the only thing that
#     could notice a STALLED manoeuvre is Autoware proper. Who watches the
#     watcher is a real open question here, and the honest answer is
#     "something outside this image, and it is not declared anywhere yet".
#     Silencing it would be worse than carrying it.
#
#   info[path-exclusion]: `on_timer` may wait up to 149 ms for `call_mrm`
#     and `driver_exit`, because every path of a node is assumed to
#     serialise unless the node declares otherwise; for mrm_handler that is
#     exactly right -- the three paths ARE the same callback body. From
#     phase8-W30 to phase9-W5 it was not printed: `call_mrm` was 206 ms (the
#     link inside it), so island.tor's nominal critical path ran through
#     `call_mrm` itself instead of the tick (206 > 100 sampling + 100).
#     Since W5 `call_mrm` is 149 (tick 118 + work 31) and the link is the
#     subscriber's `max_transport` (56 ms since phase9-C7), which this scope path does not
#     charge (the guarded topic's publisher is `external: pub`, outside this
#     tree), so the critical path is the tick again, 218 ms (100 sampling +
#     18 jitter + 100; play_launch 0.16.0 charges the handler's timer jitter
#     in the sampling cost), and the note is back, naming `on_timer`. The
#     demo compositions, with the gate in the tree, print their
#     own: `call_mrm` may wait for `driver_exit` and `on_timer`, up to 149
#     ms. Nothing was declared to make it go away.
#
# One more thing worth knowing, because it is invisible in the output: the
# hazards make the checker DERIVE criticality, which is what carries the
# safety requirement into scheduling: mrm_handler keeps ASIL_D (the max of
# the two hazards, never the sum), and the comfortable-stop operator, now on
# odd_exit's reaction walk, derives ASIL_B, the first time it derives
# anything.

# ISO 26262's scale, stated rather than assumed. It happens to be the
# checker's default; writing it out is what makes `severity: ASIL_D` below a
# reference to a named scale rather than a string nobody validates.
severity_levels: [QM, ASIL_A, ASIL_B, ASIL_C, ASIL_D]

# phase11-S6: the platform terms of a supervision's detection delay (rlm
# 0.1.61's `supervision:`). tick: the kernel tick the board's k_timer expires
# on (CONFIG_SYS_CLOCK_TICKS_PER_SEC 1000). switch: the expiry ISR plus the
# switch into the reaction thread (src/zephyr_entry/src/island_supervisor.c),
# measured on the board: SUPERVISOR_SAFE_STATE after the due, 0.04 ms at
# most (phase-11 S7), x 1.2 rounded up to the next ms.
# One pair for the whole contract, and it holds because every `supervise:`
# here is `mechanism: timer`. An `executor` supervision would be detected by
# the executor's own check, which runs between callbacks: its tick is the
# spin period plus the longest callback on that executor (the handler's
# 10 Hz tick, so 100 ms + its work, not 1 ms), and no budget here uses it.
supervision:
  tick: 1ms
  switch: 1ms

# What each rung needs from outside the island. A function is lost by
# silence on its topics, and, with `when:`, also by value: `when:` names the
# predicate that LOSES it (ros-launch-manifest v0.1.46).
functions:
  # Lost by silence: the HPC is alive while the stream arrives.
  hpc_alive: [/system/operation_mode/availability]
  # Lost by value OR by silence: the HPC says the vehicle is in its domain.
  # The handler's own predicate is isAvailableCurrentOperationMode(), which
  # in AUTONOMOUS reads exactly this field.
  hpc_in_odd:
    of: [/system/operation_mode/availability]
    when: { field: autonomous, equals: false }
  # The driver's answer. Lost while the control mode is anything but MANUAL
  # (or silent), so it HOLDS exactly when the vehicle reports MANUAL. The
  # constant is the message's own (ControlModeReport.MANUAL = 4), resolved
  # through the ament index.
  driver_took_over:
    of: [/vehicle/status/control_mode]
    when: { field: mode, not_equals: MANUAL }

hazards:
  hpc_loss:
    severity: ASIL_D
    description: >-
      the operation-mode availability stream stops (the HPC is lost), so
      nothing upstream is still deciding whether the vehicle may drive; the
      island alone has to bring it to a stop before the silence becomes a
      hazardous event
    guards: [/system/operation_mode/availability]
    on: omission
    entry_speed: &odd_speed_bound 18.06  # m/s = 65 km/h (VARIANT)
    ftti: { duration: 10s, source: requirement }
    enters: l3_engaged
  odd_exit:
    severity: ASIL_B        # illustrative; HARA-owned
    description: >-
      the vehicle leaves its operating domain (speed bound or weather) while
      the ADS drives; the driver must take over within the takeover window
      or the vehicle must be stopped in lane
    guards: [/system/operation_mode/availability]
    on: reported
    when: { field: autonomous, equals: false }
    entry_speed: *odd_speed_bound
    ftti: { duration: 30s, source: requirement }
    enters: l3_engaged

modes:
  l3_engaged:
    description: the ADS drives, inside its operating domain
    requires: [hpc_alive, hpc_in_odd]
    fallback: [takeover_request, comfortable_stop, emergency_stop]
  takeover_request:
    description: the driver is asked to take over; the ADS keeps driving
    requires: [hpc_alive]
    reaction: island.tor
    window: { duration: 10s, param: mrm_handler.takeover_request_timeout, source: requirement }
    exit: { holds: driver_took_over, to: manual }
  comfortable_stop:
    description: in-lane stop by the HPC's planner at the operator's request
    requires: [hpc_alive]   # the HPC's planner executes the stop
    reaction: island.comfortable_stop
  emergency_stop:
    description: the island brakes the vehicle itself
    requires: []
    reaction: island.emergency_stop
  manual:
    description: the driver drives; the ADS no longer commands the vehicle
    requires: []

nodes:
  mrm_comfortable_stop_operator:
    params:
      update_rate: { type: integer }
      min_acceleration: { type: double }
      max_jerk: { type: double }
      min_jerk: { type: double }
    srv:
      operate: {}
    paths:
      # `onTimer` -> `publishStatus()`. The velocity-limit publishers are not
      # here: they fire on an operate/cancel service transition, not on the
      # tick, so listing them would claim a periodic output the node does not
      # produce.
      on_timer:
        trigger: { timer: { rate_hz: 10, param: update_rate } }
        output: [status]
      # `onOperate` -> `publishVelocityLimit()` (phase8-W7): the service
      # callback publishes the limit itself, so the comfortable rung's walk
      # crosses the operate service edge and continues here (play_launch
      # phase 83, F3). The limit IS the stop the planner then executes, so
      # the braking profile is this node's: the settle is derived from its
      # own `min_acceleration` and `min_jerk` and the hazard's entry speed.
      # No `max_latency`, on purpose (phase8-W30). On the board the request
      # is served on the same executor right after the handler's tick
      # returns, and the limit leaves 0.02 ms after the take (0.85-1.18 ms
      # after the handler's `call_mrm` EXIT, runs w8-b1/r02/r05/r08). That
      # cost is inside `call_mrm`'s work term below, measured to this
      # publish. A number here would also become a node deadline and a
      # 2 ms runtime latency monitor on the limit in the image (nros
      # derives both from path latencies), which is not what is meant.
      operate:
        trigger: { input: [operate] }
        output: [max_velocity_candidates]
        safe_state:
          emits: max_velocity_candidates
          settle:
            decel: min_acceleration
            jerk: min_jerk
            response:
              duration: 943ms
              source: { measured: { max: 785.43ms, n: 3, margin: 0.2 } }
            # phase11-S6: the comfortable stop is supervised to standstill,
            # the whole settle (profile + response), by the island's route 2
            # (island_supervisor.c): armed at the comfortable operator's
            # serve with due = this settle at the entry speed (profile
            # 9996.67 + response 943 = 10939.67,
            # CONFIG_ISLAND_SUPERVISOR_COMFORTABLE_MS 10940) + how late the
            # island sees standstill (156: one kinematic_state period 100 +
            # its max_transport 56, CONFIG_ISLAND_SUPERVISOR_
            # STANDSTILL_OBSERVE_MS; play_launch derives it from `observes`).
            # At the due a vehicle not at standstill by the latest
            # kinematic_state escalates to the emergency stop: a k_timer and
            # a thread above the executor, which command it directly (the
            # direct path, as call_mrm's supervision). The overrun case
            # (`supervised-fit`, play_launch 0.18.1) is the comfortable
            # rung's total 21393.67 + observation 156 + detection 2 + the
            # emergency route 188.33 + its settle 4484.33 = 26224.33 ms of
            # the 30 s FTTI.
            supervise:
              enters: emergency_stop
              mechanism: timer
              observes: mrm_handler/kinematic_state
    pub:
      # Both are TRANSIENT_LOCAL in the source (QoS(1).transient_local()): a
      # velocity limit is latched so a late planner still sees it. Stated
      # here because the image's retention pool derives from this fact; left
      # unstated (until phase7-W2) it fell to a default of 2 for five such
      # publishers and the third one failed to construct at boot (code -100).
      # Both are published ON DEMAND (once when the comfortable stop starts,
      # once when it ends), so they promise no rate: a `min_rate_hz` here
      # became a `rate-hierarchy-runtime` monitor in the image that fired
      # at start-up on every boot (2 of the 8 ring entries read in phase8-W31)
      # before any stop was asked for. The topics below carry no `rate_hz`
      # for the same reason (phase9-W7).
      max_velocity_candidates: { qos: { depth: 1, durability: transient_local } }
      clear_velocity_limit: { qos: { depth: 1, durability: transient_local } }
      status: { min_rate_hz: 9, qos: { durability: volatile } }

  mrm_emergency_stop_operator:
    params:
      update_rate: { type: integer }
      target_acceleration: { type: double }
      target_jerk: { type: double }
    srv:
      operate: {}
    paths:
      # `onTimer` -> `publishControlCommand()` + `publishStatus()`.
      on_timer:
        trigger:
          timer:
            rate_hz: 30
            param: update_rate
            jitter:
              duration: 6ms
              source: { measured: { max: 4.34ms, n: 1073, margin: 0.2 } }
        output: [emergency_control_cmd, status]
        # This node IS the second half of the island's reaction: mrm_handler
        # reaches it over the /system/mrm/emergency_stop/operate SERVICE, the
        # service callback only latches `status_.state = OPERATING`, and the
        # braking command leaves on the next tick of `update_rate: 30`. Since
        # play_launch phase 82 the reaction walk crosses both: the service
        # edge, and the tick as a SAMPLING hop of one period (33.33 ms). So
        # no `max_latency` is declared here: the walk charges the period
        # itself, and a number here would be the callback's own execution
        # budget, which nobody has measured. The settle is DERIVED (phase8-W7)
        # from this node's braking profile and the hazard's entry speed; it
        # was a literal 2034ms computed by hand at an assumed 3.0 m/s.
        safe_state:
          emits: emergency_control_cmd
          settle:
            decel: target_acceleration
            jerk: target_jerk
            response:
              duration: 319ms
              source: { measured: { max: 265.34ms, n: 16, margin: 0.2 } }
    sub:
      # Cached in onControlCommand and read on the timer as the ramp seed: a
      # read-latest input, not a trigger. `state: true` says so; without it
      # the checker's state-consistency rule warns that the subscriber is
      # neither a path trigger nor state.
      control_cmd: { min_rate_hz: 30, qos: { depth: 1 }, state: true }
    pub:
      # VOLATILE, stated: the source uses the default profile. See the note
      # on mrm_handler's pub block for why an unstated durability is not read
      # as volatile.
      emergency_control_cmd: { min_rate_hz: 27, qos: { durability: volatile } }
      status: { min_rate_hz: 27, qos: { durability: volatile } }

  # The arbiter. Six subscriptions since phase8-W8a dropped the gear
  # pass-through (seven before; `operation_mode_state` is the one the old
  # CMakeLists list omitted).
  mrm_handler:
    params:
      update_rate: { type: integer }
      timeout_operation_mode_availability: { type: double }
      timeout_call_mrm_behavior: { type: double }
      timeout_cancel_mrm_behavior: { type: double }
      use_emergency_holding: { type: bool }
      timeout_emergency_recovery: { type: double }
      use_pull_over: { type: bool }
      use_comfortable_stop: { type: bool }
      turning_hazard_on.emergency: { type: bool }
      # phase8-W7, the takeover request (a demo extension, not upstream).
      use_takeover_request: { type: bool }
      takeover_request_timeout: { type: double }
      # phase8-W27, the start-up lifecycle (not upstream). The detection
      # budgets in this file (max_age, `within`, the hazards' FDTI) apply from
      # RUN, when every required input is established (phase8-W28: two
      # samples within the availability timeout for the periodic inputs, one
      # for the latched operation mode; porting-notes 20); before that the
      # handler is in INIT and publishes nothing, and the INIT budget is this
      # parameter (3.0 s from construction), after which an input not yet
      # established is an init failure answered like an availability loss. rlm has no key
      # for a start-up budget, so it is stated here and not checked.
      init_timeout: { type: double }
    cli:
      comfortable_stop_operate: {}
      emergency_stop_operate: {}
    paths:
      # `onTimer` -> publishMrmState / TakeoverRequestState / HazardCmd, in
      # that order (phase8-W8a dropped TurnIndicatorCmd, GearCmd and
      # EmergencyHolding; see the head of this file).
      on_timer:
        trigger:
          timer:
            rate_hz: 10
            param: update_rate
            jitter:
              duration: 18ms
              source: { measured: { max: 14.84ms, n: 1641, margin: 0.2 } }
        output:
          - mrm_state
          - takeover_request_state
          - hazard_lights_cmd
        # One tick of `update_rate: 10`. A timer callback that has not
        # finished when the next tick is due is late by any definition, so
        # the period is the budget; it is not a new number.
        max_latency: { duration: 100ms, source: derived }
      # THE REACTION. This is the same callback body as `on_timer` -- the
      # handler notices the stale availability stamp, or the cleared
      # `autonomous`, on a tick and reacts from there; there is no separate
      # subscription callback in the code. It is declared as an
      # input-triggered path because that is the shape a detector reaction
      # has: it is caused by the fault on `operation_mode_availability`, not
      # by the clock. The tick it waits for is inside the number, so the
      # periodic implementation is accounted for rather than hidden by the
      # declaration. Both faults start it; it enters the takeover request,
      # calls an operator, or both in turn, and the outputs name all three so
      # the walk can follow each rung (phase8-W7).
      #
      # THE BOARD BUDGET: 149 ms = tick 118 + work 31 (phase9-W5; 206 =
      # link 57 + tick 118 + work 31 from phase8-W30, when play_launch
      # 0.13.0 charged no transport on the walk and the link had to live
      # here; 0.14.0 charges `max_transport` on the guard subscriber below).
      # Until W30 it was 110 ms, the 100 ms tick plus the 10 ms of
      # `timeout_call_mrm_behavior`, set on native_sim. Each term below is
      # the maximum over the 13 W8 board runs (image 780195b0, main 88a336f;
      # w8-a1, b1, e1, r01..r10; docs/takeover-trace.md sections 9 and 10)
      # plus 20 %, rounded up to the next ms. The 100 ms period is
      # `update_rate: 10` and takes no margin.
      #   (link, NOT here since phase9-W5: the serial hop in is
      #     `max_transport: 56ms` on the subscriber below, charged by
      #     play_launch 0.14.0 on the reaction route; its derivation is
      #     there.)
      #   tick 118 ms: a take waits for the next tick. Consecutive ticks
      #     came 81.96-114.84 ms apart (1641 gaps; max w8-a1, whose ticks
      #     run on the 100 ms grid up to 14.84 ms late; 110.11 elsewhere).
      #     100 + 14.84 x 1.2 = 100 + 17.81.
      #   work 31 ms: from the tick's start to the reaction's last publish.
      #     The request goes on 5.41-9.66 ms in; the expiry tick calls
      #     comfortable_stop/operate 11.23-17.76 ms in, publishes the
      #     request off 17.44-23.97 ms in and returns at 17.64-24.16; the
      #     operator, served next on the same executor, publishes the
      #     velocity limit 18.48-25.04 ms after the tick began (max
      #     w8-b1). 25.04 x 1.2 = 30.05.
      # phase9-C7 re-derived both terms over a full round of the current
      # image (ELF sha256 df1bf38a1090bb46..., main 4cb670c, nano-ros
      # 43fc1c2f7; runs fr-e1..3, fr-a1..3, fr-b1..3, 2026-10-13): ticks
      # 99.00-101.01 ms apart (1121 gaps), so 100 + 1.01 x 1.2 = 101.21 ->
      # 102; tick start to the last publish 0.41-0.89 ms (call_mrm EXIT),
      # 1.29-1.32 ms to the comfortable operator's velocity limit on the
      # expiry tick, so 1.32 x 1.2 = 1.58 -> 2. The rule gives 104, and 104
      # is NOT taken: the b act's host-clock route row (deadline -> velocity
      # limit as received) read 103.50 in fr-b3 and 104.22 in phase9's d12-b3s
      # (I14 image), because the host row also carries the difference of two
      # out-link delays, which neither term charges. Lowering would fail a
      # measured run, so 118 + 31 stay.
      # 118 + 31 = 149: the on-island part of the takeover route, and the
      # first hop after the window's deadline (window-expiry), where no link
      # is crossed. Before W30 the board went over 110 in 6 of 13 runs (max
      # 145.35, w8-b1 = 42.18 link + 93.51 wait + 9.66 work; the link now
      # has its own term).
      call_mrm:
        trigger: { input: [operation_mode_availability] }
        output:
          - mrm_state
          - takeover_request_state
          - comfortable_stop_operate
          - emergency_stop_operate
        max_latency:
          duration: 149ms
          source:
            measured:
              margin: 0.2
              terms:
                tick: { period: 100ms, max: 14.84ms, n: 1641 }
                work: { max: 25.04ms, n: 13 }
          # phase11-S6: supervised by the board's timer rung
          # (CONFIG_ISLAND_SUPERVISOR), for both hazards: hpc_loss's due is
          # the last availability take + max_age 500 + 149 (route 0, armed
          # by the handler), odd_exit's the take + 149 (route 1, the
          # executor's supervised route row, nano-ros phase-503). At the due
          # a k_timer wakes a thread above the executor, which drives the
          # safe-state output (CAN LED1) and commands the emergency stop
          # directly: mrm_state MRM_OPERATING / EMERGENCY_STOP, the hazard
          # lights and the emergency operator's braking command, published
          # from messages and publishers the thread alone uses, every 33 ms
          # until the handler's and the operator's own ticks take over. So
          # the reaction runs even while the executor is stuck in this very
          # callback. A miss in odd_exit enters the emergency stop as well
          # (one `supervise:` per budget): a handler that overran once is
          # not trusted with the takeover request.
          supervise: { enters: emergency_stop, mechanism: timer }
        # The client calls to the operators are named in `output` so the
        # reaction walk can follow the service edges (phase 82). The safe
        # states are declared on the operators, whose outputs command the
        # plant.
      # THE EXIT (phase8-W7). The driver's MANUAL, taken on the handler's own
      # control_mode input and answered on the takeover-request state, again
      # on a tick. Declaring it is what makes the image trace the take
      # (TAKE_MRM_HANDLER_CONTROL_MODE) and what `mode-exit-unwired` checks.
      # 149 ms on the board (phase8-W30; 100 until then) = tick 118 + work
      # 31, the two on-island terms of `call_mrm` above: the path starts at
      # the island's take, so the link is not in it. Observed take of MANUAL
      # to request off 46.18-72.87 ms (a runs; request off 6.41-9.04 ms
      # into the exit tick).
      driver_exit:
        trigger: { input: [control_mode] }
        output: [takeover_request_state]
        max_latency:
          duration: 149ms
          source:
            measured:
              margin: 0.2
              terms:
                tick: { period: 100ms, max: 14.84ms, n: 1641 }
                work: { max: 25.04ms, n: 13 }
    sub:
      # `max_age` is `timeout_operation_mode_availability: 0.5` from this
      # node's own parameter file. `on_violation` is what makes this
      # subscriber a DETECTOR rather
      # than a consumer that happens to have a rate wish: without it the
      # hazards above have nothing watching their guard, and the checker
      # says so.
      operation_mode_availability:
        min_rate_hz: 10
        # `timeout_operation_mode_availability: 0.5` is a STALENESS bound the
        # handler evaluates itself on its 10 Hz tick, not a DDS lease: so the
        # mechanism is `application`, and `max_age` is the same 500 ms; the
        # 500 ms detection is this key's.
        #
        # NO LIVELINESS (phase9-W6). Until then the qos below also said
        # `liveliness: manual_by_topic, lease_duration: 500ms`, "the same
        # fact in QoS terms". It was not a fact about this image: the code
        # subscribes with `nros::QoS(1)` (no liveliness policy); nano-ros
        # reads only depth, reliability, durability and history from a
        # contract's qos (qos_agreement.rs: the contract "has no key for"
        # liveliness), so the knobs never saw it; play_launch did turn the
        # pair into two `qos_overrides.*` parameters on this node's model,
        # but the C++ component entry bakes no override table from them,
        # so the image never requested it. And the publisher, the gate on
        # the host, offers rclcpp's default AUTOMATIC liveliness, which a
        # MANUAL_BY_TOPIC request is RxO-incompatible with under DDS.
        # Dropping it moves no verdict, total or derived knob.
        max_age:
          duration: 500ms
          param: timeout_operation_mode_availability
          source: requirement
        # THE SERIAL LINK (phase8-W30). This subscriber sits behind the
        # island gateway and the UART, so its transport is its own, not the
        # topic's (a host subscriber of the same topic has none): the
        # per-subscriber `max_transport` is rlm's key for exactly that.
        # 56 ms = the measured hop in plus 20 %: the gate's publish on the
        # host to this subscriber's take on the island (gateway, 921,600-baud
        # UART, rx), 18.53-46.42 ms over the 12 edges of the phase9-C7 round
        # on the current image (ELF sha256 df1bf38a1090bb46..., main 4cb670c,
        # nano-ros 43fc1c2f7; fr-a1..3, fr-b1..3; max fr-a3). 46.42 x 1.2 =
        # 55.70 -> 56. Before C7 it was 81, from the pre-I14 image (phase8-W31's
        # 12 edges, 8.93-67.02 ms; 67.02 x 1.2 = 80.42 -> 81), and 57 from
        # W30 to phase9-W5 (W8's 18 edges, 12.29-47.43). Every takeover-route
        # row measured since phase9-W5 fits 56 + 149 = 205 (max 126.56,
        # d12-b3s). Cross-clock: an
        # island stamp moved onto the host clock by the smallest
        # publish->receipt pair is never early, so the term is over-stated
        # by the smallest out-link delay, never under-stated. play_launch
        # 0.14.0 charges it once on the reaction route (F1), so it is no
        # longer inside `call_mrm`.
        max_transport:
          duration: 56ms
          source: { measured: { max: 46.42ms, n: 12, margin: 0.2 } }
        qos: { depth: 1 }
        on_violation:
          # `reported` since phase8-W7: the handler also reacts to the VALUE
          # (isAvailableCurrentOperationMode()), which is odd_exit.
          on: [omission, reported]
          mechanism: application
          reaction: call_mrm
          within: { duration: 149ms, source: derived }   # the reaction path's own budget (`reaction-within`)
      # The comfortable settle's supervision sees standstill here
      # (`observes:` above): the handler notes the speed of every take, and
      # route 2 judges the latest at its due. The transport is not measured
      # on this topic: it is the availability's `max_transport` (46.42 x 1.2,
      # n 12, below), which crosses the same gateway and serial link, and
      # route 2's observation delay (CONFIG_ISLAND_SUPERVISOR_STANDSTILL_
      # OBSERVE_MS 156) uses the same 56.
      kinematic_state:
        min_rate_hz: 10
        max_transport: { duration: 56ms, source: derived }
        qos: { depth: 1 }
      # Behind the same link, and downsampled 40 -> 10 Hz by the gateway
      # (demo/l3/router/island-gateway.json5), so a change of mode waits
      # for the next sample the downsampler passes: the host probe's receipt
      # of MANUAL to the island's take was 63.65-118.78 ms in the five a
      # runs (cross-clock, as the link above). 118.78 x 1.2 = 142.54 -> 143.
      # Nothing in the fault arithmetic reads it: the driver's answer is
      # bounded by the window, on the host (phase8-W30).
      control_mode:
        min_rate_hz: 10
        max_transport:
          duration: 143ms
          source: { measured: { max: 118.78ms, n: 5, margin: 0.2 } }
        qos: { depth: 1 }
      comfortable_stop_status: { min_rate_hz: 9, qos: { depth: 1 } }
      emergency_stop_status: { min_rate_hz: 9, qos: { depth: 1 } }
      # Latched, published on CHANGE by default_adapi: no rate is claimed.
      # TRANSIENT_LOCAL as upstream since phase8-W14 (nano-ros phase-473 W2
      # serves a transient-local subscription from the publisher's cache), so
      # a late joiner reads the current mode instead of waiting for a change.
      operation_mode_state: { qos: { depth: 1, durability: transient_local } }
    pub:
      # VOLATILE, stated on every publisher of the island (phase7-W8). The
      # source creates these with the default profile, which is volatile; but
      # nano-ros counts the transient-local retention pool (and one queryable
      # per such publisher) only when EVERY publisher states its durability --
      # nros-sizing-descriptor `transient_local_publishers_over`: "a count over
      # the rows that answered is not a bound on the row that did not" -- and
      # otherwise contributes zero. With 5 of 14 stated the queryable table
      # stayed at 26 and the pool at 2 (docs/boot-through.md, iteration 1).
      # Rate floors with margin (phase9, 2026-10-10): a `min_rate_hz` equal
      # to the producer's own timer rate (10 on a 10 Hz tick, 30 on 30) is a
      # promise no stream keeps under any stall: the runtime rule counts
      # samples in a 5 s window, the timer's Skip policy drops a tick for
      # every two periods the spin stalls, and the window then closes one
      # short (W4 gate (b): 9787/10000 and 28921/30000 after the commanded
      # overrun, beside the overrun's own verdict). One dropped tick in a
      # window is the overrun's business, not a rate fault, so the island's
      # own streams promise 9 and 27 (one period of slack per window) and
      # the handler requires the same of the operators' status. The host's
      # streams (kinematic_state, control_mode, control_cmd, the detector)
      # keep their floors: they are requirements on Autoware. Budgets are
      # unchanged: they derive from `update_rate`, not from the floor.
      mrm_state: { min_rate_hz: 9, qos: { durability: volatile } }
      # phase8-W7: MrmBehaviorStatus reused. AVAILABLE = idle, OPERATING =
      # the request is on, NOT_AVAILABLE = use_takeover_request is false.
      takeover_request_state: { min_rate_hz: 9, qos: { durability: volatile } }
      hazard_lights_cmd: { min_rate_hz: 9, qos: { durability: volatile } }

# The reactions, as scope paths from the guarded input to the topic that
# commits each rung. What each rung COSTS is the reaction walk the hazards
# take, which the checker derives; a scope path's own `max_latency` is the
# NOMINAL traversal.
#
# 218 ms, the NOMINAL traversal, which a scope path's budget is checked
# against: for a 10 Hz node, one sampling wait plus the tick's own budget.
# The checker charges the handler's timer `jitter:` in the sampling wait, so
# its critical path is 100 (event segment, the tick) + 100 (period) + 18
# (jitter) = 218 ms (`/mrm_handler = 218.00ms (100.00ms event-segment +
# 118.00ms sampling_cost)`), and 218 is the smallest budget that passes
# `scope-budget`. History: until phase8-W30 the fault route (110 ms) was
# shorter than the 200 ms sampling + tick path, and declaring 110 here made
# `scope-budget` reject the file. From phase8-W30 to phase9-W5 the board's
# `call_mrm` (206 ms) was the critical path, and 210 held it; at 149 ms
# (phase9-W5) the tick path is critical again, and play_launch 0.16.0 adds
# the jitter to it (phase9-C1: 210 -> 218). It is the scope's own budget,
# from the handler's take: the link in front of the take is not in it, and
# the 56 ms `max_transport` on that subscriber is not charged here (the
# guarded topic's publisher is `external: pub`, outside this tree).
# island.emergency_stop keeps 210 ms: the checker reports no critical path
# above it. island.comfortable_stop declares none: it crosses the operate
# service, which the nominal graph does not walk.
paths:
  island.tor:
    trigger: { input: [/system/operation_mode/availability] }
    output: [/system/takeover_request/state]
    max_latency: { duration: 218ms, source: derived }
  island.comfortable_stop:
    trigger: { input: [/system/operation_mode/availability] }
    output: [/planning/scenario_planning/max_velocity_candidates]
  island.emergency_stop:
    trigger: { input: [/system/operation_mode/availability] }
    output: [/system/emergency/control_cmd]
    max_latency: { duration: 210ms, source: requirement }

topics:
  # --- internal to the island: both sides are components in this image -------
  /system/mrm/comfortable_stop/status:
    type: tier4_system_msgs/msg/MrmBehaviorStatus
    pub: [mrm_comfortable_stop_operator/status]
    sub: [mrm_handler/comfortable_stop_status]
  /system/mrm/emergency_stop/status:
    type: tier4_system_msgs/msg/MrmBehaviorStatus
    pub: [mrm_emergency_stop_operator/status]
    sub: [mrm_handler/emergency_stop_status]

  # --- consumed by the island, produced by the vehicle or Autoware ----------
  /control/command/control_cmd:
    type: autoware_control_msgs/msg/Control
    external: pub
    sub: [mrm_emergency_stop_operator/control_cmd]
    rate_hz: 30
  # The guard. Its publisher is OUTSIDE this image and outside this launch
  # tree, and is named anyway (phase8-W7), by its absolute FQN so that it is
  # not qualified against this scope: odd_exit is a REPORTED fault, and the
  # checker derives a reported fault's detection from the publisher of the
  # verdict (its period, its timer's release jitter and its declared path
  # latency). With no publisher
  # named, odd_exit is `hazard-unguarded` and `just sync` refuses the file.
  # The name is the demo's: the L3 compositions' availability_gate (its
  # `gate-rt` container) republishes Autoware's availability with the ODD
  # verdict folded into `autonomous` (phase-8 doc D5). It is a 10 Hz timer;
  # its 20 ms path and 6 ms measured jitter are declared in the demo
  # composition (demo/l3/contracts/l3_takeover.contract.yaml, phase9-W6),
  # where the checker charges all three (detection 126 ms); this file does
  # not declare the gate's node, so it charges the 100 ms period alone.
  /system/operation_mode/availability:
    type: tier4_system_msgs/msg/OperationModeAvailability
    external: pub
    pub: [/availability_gate/availability]
    sub: [mrm_handler/operation_mode_availability]
    rate_hz: 10
  /localization/kinematic_state:
    type: nav_msgs/msg/Odometry
    external: pub
    sub: [mrm_handler/kinematic_state]
    rate_hz: 10
  /vehicle/status/control_mode:
    type: autoware_vehicle_msgs/msg/ControlModeReport
    external: pub
    sub: [mrm_handler/control_mode]
    rate_hz: 10
  /api/operation_mode/state:
    type: autoware_adapi_v1_msgs/msg/OperationModeState
    external: pub
    sub: [mrm_handler/operation_mode_state]

  # --- produced by the island, consumed outside it --------------------------
  /planning/scenario_planning/max_velocity_candidates:
    type: autoware_internal_planning_msgs/msg/VelocityLimit
    external: sub
    pub: [mrm_comfortable_stop_operator/max_velocity_candidates]
  /planning/scenario_planning/clear_velocity_limit:
    type: autoware_internal_planning_msgs/msg/VelocityLimitClearCommand
    external: sub
    pub: [mrm_comfortable_stop_operator/clear_velocity_limit]
  /system/emergency/control_cmd:
    type: autoware_control_msgs/msg/Control
    external: sub
    pub: [mrm_emergency_stop_operator/emergency_control_cmd]
  /system/fail_safe/mrm_state:
    type: autoware_adapi_v1_msgs/msg/MrmState
    external: sub
    pub: [mrm_handler/mrm_state]
  # phase8-W7: the takeover request, the takeover_request rung's reaction
  # output. Read on the host by the HMI and the timeline probe.
  /system/takeover_request/state:
    type: tier4_system_msgs/msg/MrmBehaviorStatus
    external: sub
    pub: [mrm_handler/takeover_request_state]
  /system/emergency/hazard_lights_cmd:
    type: autoware_vehicle_msgs/msg/HazardLightsCommand
    external: sub
    pub: [mrm_handler/hazard_lights_cmd]

# The two MRM operate services. `mrm_handler` is the arbiter: it decides which
# behaviour to run and calls the operator that runs it. Both sides are on this
# board, so both are stated and neither is external.
services:
  /system/mrm/comfortable_stop/operate:
    type: tier4_system_msgs/srv/OperateMrm
    server: [mrm_comfortable_stop_operator/operate]
    client: [mrm_handler/comfortable_stop_operate]
  /system/mrm/emergency_stop/operate:
    type: tier4_system_msgs/srv/OperateMrm
    server: [mrm_emergency_stop_operator/operate]
    client: [mrm_handler/emergency_stop_operate]
